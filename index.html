const { useState, useEffect, useMemo } = React;

/* ============================== Icons (no npm package — hand-drawn, lucide-style) ============================== */
function Ic({ children, size = 18, color = "currentColor", kind = "stroke" }) {
  if (kind === "fill") {
    return <svg width={size} height={size} viewBox="0 0 24 24" fill={color} stroke="none">{children}</svg>;
  }
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
  );
}
const Flower2 = (p) => <Ic {...p} kind="fill">
  <circle cx="12" cy="12" r="2.3" /><circle cx="12" cy="5" r="2.3" /><circle cx="12" cy="19" r="2.3" />
  <circle cx="5" cy="12" r="2.3" /><circle cx="19" cy="12" r="2.3" />
</Ic>;

</Ic>;
const Sparkles = (p) => <Ic {...p} kind="fill"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" /></Ic>;

const Check = (p) => <Ic {...p}><path d="M4 12l5 5L20 6" /></Ic>;
const Send = (p) => <Ic {...p}><path d="M22 2L11 13" /><path d="M22 2l-7 20-4-9-9-4 20-7z" /></Ic>;
const Globe = (p) => <Ic {...p}><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3a14 14 0 0 1 0 18" /><path d="M12 3a14 14 0 0 0 0 18" /></Ic>;
const User = (p) => <Ic {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></Ic>;
const BadgeCheck = (p) => <Ic {...p}><path d="M12 2l2.2 1.3 2.6-.4 1.1 2.4 2.4 1.1-.4 2.6L21 12l-1.3 2.2.4 2.6-2.4 1.1-1.1 2.4-2.6-.4L12 22l-2.2-1.3-2.6.4-1.1-2.4-2.4-1.1.4-2.6L3 12l1.3-2.2-.4-2.6 2.4-1.1L7.4 2.9l2.6.4L12 2z" /><path d="M9 12l2 2 4-4" /></Ic>;
const Coins = (p) => <Ic {...p}><circle cx="9" cy="10" r="6" /><path d="M14.5 15.5A6 6 0 1 0 9 4" /></Ic>;
const Clock = (p) => <Ic {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" /></Ic>;
const Lock = (p) => <Ic {...p}><rect x="4" y="11" width="16" height="9" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></Ic>;
const Store = (p) => <Ic {...p}><path d="M3 9l1.5-5h15L21 9" /><path d="M4 9v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9" /><path d="M9 19v-5h6v5" /></Ic>;
const Package = (p) => <Ic {...p}><path d="M21 8l-9-5-9 5 9 5 9-5z" /><path d="M3 8v9l9 5 9-5V8" /><path d="M12 13v9" /></Ic>;

/* ============================== Tokens ============================== */
const C = {
  noir: "#0B211B", vert: "#0F2E24", vertLo: "#153A2E",
  ivoire: "#F1ECDF", ivoireDim: "#B9C4B6",
  laiton: "#C6A05B", laitonLo: "#9C7C3E", laitonHi: "#E7D3A0",
  bloom: "#D98BA6", line: "#2A4438",
  paper: "#F5F6F3", card: "#FFFFFF", ink: "#16211B", inkDim: "#69756D",
  mline: "#E4E7E1", accent: "#2F6B4F", price: "#16211B", sale: "#C6472E",
};
const FONT_DISPLAY = "'Cormorant Garamond', Georgia, serif";
const FONT_BODY = "'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif";

/* Studiya fonida suzib yuruvchi barg/gulbarg zarralari (deterministik) */
const PETALS = [
  { l: 6,  d: 16, dl: 0,   s: 10, o: .35, k: 0 },
  { l: 16, d: 21, dl: 3,   s: 14, o: .25, k: 1 },
  { l: 26, d: 18, dl: 7,   s: 8,  o: .30, k: 2 },
  { l: 37, d: 24, dl: 1,   s: 12, o: .22, k: 0 },
  { l: 48, d: 17, dl: 9,   s: 9,  o: .33, k: 1 },
  { l: 58, d: 22, dl: 4,   s: 13, o: .24, k: 2 },
  { l: 68, d: 19, dl: 11,  s: 10, o: .30, k: 0 },
  { l: 77, d: 25, dl: 6,   s: 15, o: .20, k: 1 },
  { l: 86, d: 18, dl: 2,   s: 9,  o: .32, k: 2 },
  { l: 93, d: 23, dl: 8,   s: 11, o: .26, k: 0 },
];

const LOGO_STACK = "https://d8j0ntlcm91z4.cloudfront.net/user_370qfkcxfpKcDA0sH662HyZQBGj/hf_20260822_075921_266218b5-e18b-41f0-9412-33c7dfe35eed.png";

// Same origin as this page (site + admin + api all live in one Vercel project).
const API_BASE = "";
const BOT_USERNAME = "zetmeai_bot";
const MIN_ORDER = 200000;       // chakana (retail) uchun minimal buyurtma
const OPT_MIN_ORDER = 5000000;  // optom (wholesale) narxda xarid qilish uchun minimal savat

/* ============================== Helpers ============================== */
function fmt(n) {
  return Math.round(n).toLocaleString("uz-UZ").replace(/,/g, " ") + " so'm";
}

// chakana (retail) yoki optom (wholesale) narxni tanlaydi — ikkalasi ham
// admin panelda har bir variant uchun alohida kiritiladi (api/products.js)
function priceOf(v, mode) {
  return mode === "optom" ? Number(v.optPrice || 0) : Number(v.price || 0);
}

// one-time-order loyalty bonus — matches loyiha-holati.md jadvali
const BONUS_TIERS = [
  { min: 50000000, money: 3000000, tokin: 100 },
  { min: 30000000, money: 1600000, tokin: 50 },
  { min: 20000000, money: 1100000, tokin: 30 },
  { min: 15000000, money: 800000, tokin: 25 },
  { min: 10000000, money: 600000, tokin: 20 },
  { min: 5000000, money: 250000, tokin: 10 },
  { min: 1000000, money: 0, tokin: 0, gift: true },
];
function bonusFor(total) {
  for (const t of BONUS_TIERS) if (total >= t.min) return t;
  return null;
}
const TEASER_MIN = 300000;
const TEASER_MAX = 1000000;

const LANGS = [
  { code: "uz", label: "UZ", active: true },
  { code: "ru", label: "RU", active: false },
  { code: "en", label: "EN", active: false },
];

// membership tiers — badge color changes by token balance / purchased status
const TIERS_BADGE = [
  { id: "oddiy", label: "Oddiy", min: 0, color: C.inkDim, ring: C.mline },
  { id: "kumush", label: "Kumush a'zo", min: 20, color: "#8A94A6", ring: "#C7CCD6" },
  { id: "oltin", label: "Oltin a'zo", min: 60, color: C.laitonLo, ring: C.laiton },
  { id: "olmos", label: "Olmos a'zo", min: 150, color: "#3E7FB8", ring: "#8FC1EE" },
];
function tierForTokens(tokens, badgeOwned) {
  let t = TIERS_BADGE[0];
  for (const tier of TIERS_BADGE) if (tokens >= tier.min) t = tier;
  if (badgeOwned && t.id === "oddiy") return TIERS_BADGE[1];
  return t;
}

// tiny localStorage wrapper — never throws, works on the real deployed site
function storageGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) { return fallback; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
}

/* ============================== Product helpers ============================== */
function priceRangeText(p, mode) {
  const prices = (p.variants || []).map((v) => priceOf(v, mode)).filter((n) => n > 0);
  if (prices.length === 0) return "";
  const min = Math.min(...prices), max = Math.max(...prices);
  return min === max ? fmt(min) : `${fmt(min)} – ${fmt(max)}`;
}
// O'lchov birligi — sotuvchi mahsulotga tanlaydi (admin panel).
// Eski mahsulotlarda `unit` yo'q — ular litr hisoblanadi.
const UNIT_META = {
  litr:   { short: "L",    spec: "Hajmi" },
  gramm:  { short: "g",    spec: "Og'irligi" },
  olcham: { short: "sm",   spec: "O'lchami" },
  dona:   { short: "dona", spec: "Miqdori" },
};
const unitOf = (u) => UNIT_META[u] || UNIT_META.litr;
function litrRangeText(p) {
  const litrs = (p.variants || []).map((v) => v.litr).filter(Boolean);
  return litrs.join(", ") + " " + unitOf(p.unit).short;
}
// Rasm: yangi variantlarda `image` (bitta), eskilarida `images` (massiv, 2 tagacha)
// bo'lishi mumkin — ikkalasini ham qo'llab-quvvatlaymiz.
function variantImg(v) {
  if (!v) return "";
  if (v.image) return v.image;
  if (Array.isArray(v.images) && v.images.length > 0) return v.images[0];
  return "";
}
function variantImgs(v) {
  if (!v) return [];
  if (Array.isArray(v.images) && v.images.length > 0) return v.images;
  return v.image ? [v.image] : [];
}
function thumbUrl(p) {
  return variantImg(p.variants && p.variants[0]) || "";
}

/* ============================== Small UI bits ============================== */
function SourceMenu({ accent, onPick }) {
  const opts = [
    { id: "catalog", icon: ImageIcon, t: "Katalogdan tanlash", s: "Tuvaklar bo'limidan" },
    { id: "gallery", icon: Upload, t: "Galereyadan yuklash", s: "Telefondagi rasm" },
    { id: "camera", icon: Camera, t: "Rasmga olish", s: "Kamerani ochish" },
  ];
  return (
    <div className="src-menu" onClick={(e) => e.stopPropagation()}>
      {opts.map((o) => {
        const Ic = o.icon;
        return (
          <button key={o.id} className="src-item" onClick={() => onPick(o.id)}>
            <span className="src-ic" style={{ borderColor: accent, color: accent }}><Ic size={16} /></span>
            <span>
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>{o.t}</div>
              <div style={{ fontSize: 11.5, color: C.ivoireDim }}>{o.s}</div>
            </span>
          </button>
        );
      })}
    </div>
  );
}

function GenSlot({ label, icon: Icon, accent, image, onSetImage }) {
  const [open, setOpen] = useState(false);
  const fileRef = React.useRef(null);
  const camRef = React.useRef(null);

  function handleFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    onSetImage(url);
    setOpen(false);
  }
  function pickSource(id) {
    if (id === "gallery") fileRef.current?.click();
    else if (id === "camera") camRef.current?.click();
    else { onSetImage("catalog"); setOpen(false); }
  }

  return (
    <div className="genslot" style={{ position: "relative" }}>
      <input ref={fileRef} type="file" accept="image/*" hidden onChange={handleFile} />
      <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={handleFile} />
      <div className="genslot-box" style={{ borderColor: image ? accent : C.line }}>
        {image ? (
          image === "catalog"
            ? <div className="genslot-fill" style={{ color: accent }}><ImageIcon size={26} /><span>Katalogdan tanlandi</span></div>
            : <img src={image} alt={label} className="genslot-img" />
        ) : (
          <div className="genslot-empty">
            <Icon size={22} color={accent} />
            <span>{label}</span>
          </div>
        )}
        <button className="genslot-plus" style={{ background: accent }} onClick={() => setOpen((v) => !v)} aria-label="Qo'shish">
          {image ? <ChevronRight size={16} color={C.noir} /> : <Plus size={17} color={C.noir} />}
        </button>
        {open && <SourceMenu accent={accent} onPick={pickSource} />}
      </div>
    </div>
  );
}

/* ============================== Chakana / Optom toggle ============================== */
function PriceModeToggle({ mode, onChange }) {
  return (
    <div className="pmtoggle">
      <button className={"pmtoggle-btn" + (mode === "chakana" ? " active" : "")} onClick={() => onChange("chakana")}>
        <Store size={13} /> Chakana
      </button>
      <button className={"pmtoggle-btn" + (mode === "optom" ? " active" : "")} onClick={() => onChange("optom")}>
        <Package size={13} /> Optom
      </button>
    </div>
  );
}

/* ============================== Product detail modal (litr variant picker) ============================== */
function ProductModal({ p, priceMode, onClose, onAdd, onSendToStudio }) {
  const variants = p.variants || [];
  const [vi, setVi] = useState(0);
  const [qty, setQty] = useState(1);
  const [imgIdx, setImgIdx] = useState(0);
  const v = variants[vi] || variants[0] || {};
  const displayName = v.name || p.name;
  const displayColor = v.color || p.color;
  const unitPrice = priceOf(v, priceMode);
  const imgs = variantImgs(v);
  const heroImg = imgs[imgIdx] || imgs[0] || "";

  function pickVariant(i) { setVi(i); setImgIdx(0); }

  return (
    <div className="ov" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="pmodal">
        <button className="pm-close" onClick={onClose}><X size={18} /></button>
        <div className="pm-hero">
          {heroImg ? <img src={heroImg} alt={displayName} className="pm-hero-img" /> : <span style={{ fontSize: 54 }}>🪴</span>}
        </div>
        {imgs.length > 1 && (
          <div className="pm-thumbrow">
            {imgs.map((u, i) => (
              <button key={i} type="button" className={"pm-thumb" + (u === heroImg ? " active" : "")} onClick={() => setImgIdx(i)}>
                <img src={u} alt="" />
              </button>
            ))}
          </div>
        )}
        <div className="pm-body">
          <div className="pm-toprow">
            <span className="pm-modebadge">{priceMode === "optom" ? "Optom narx" : "Chakana narx"}</span>
            <span className="pm-shop"><Store size={11} /> {p.shopName || "Tuvaklar"}</span>
          </div>
          <h3 className="pm-title">{displayName}</h3>
          <div className="pm-price">{fmt(unitPrice)}</div>

          {variants.length > 1 && (
            <div className="pm-litrrow">
              {variants.map((vv, i) => (
                <button key={vv.id || i} className={"pm-litrchip" + (i === vi ? " active" : "")} onClick={() => pickVariant(i)}>
                  {vv.litr} {unitOf(p.unit).short}
                </button>
              ))}
            </div>
          )}

          <div className="pm-specs">
            <div><span>{unitOf(p.unit).spec}</span><b>{v.litr ? `${v.litr} ${unitOf(p.unit).short}` : "—"}</b></div>
            <div><span>O'lcham</span><b>{v.size || "—"}</b></div>
            <div><span>Rang</span><b>{displayColor || "—"}</b></div>
          </div>
          <div className="pm-qty">
            <button onClick={() => setQty((q) => Math.max(1, q - 1))}><Minus size={15} /></button>
            <span>{qty}</span>
            <button onClick={() => setQty((q) => q + 1)}><Plus size={15} /></button>
          </div>
          <button className="pm-add" onClick={() => { onAdd(p, v, qty); onClose(); }}>
            <ShoppingBag size={16} /> Savatga qo'shish — {fmt(unitPrice * qty)}
          </button>
          <button className="pm-studio" onClick={() => { onSendToStudio(p, v); onClose(); }}>
            <Sparkles size={15} /> {p.category === "gul" ? "Bu gulni tuvakka AI bilan moslab ko'rish" : "Shu tuvakka gulni AI bilan moslab ko'rish"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================== Cart drawer ============================== */
function CartDrawer({ items, priceMode, onClose, onQty, onCheckout, checking, checkoutError }) {
  const total = items.reduce((s, i) => s + priceOf(i, priceMode) * i.qty, 0);
  const minRequired = priceMode === "optom" ? OPT_MIN_ORDER : MIN_ORDER;
  const remaining = minRequired - total;
  const meetsMin = total >= minRequired;
  // MARKETPLACE: bonus/sovg'a faqat shu do'kon bonusni yoqqan bo'lsa ko'rsatiladi
  // (server ham xuddi shunday hisoblaydi — api/checkout.js)
  const cartShop = items[0] || null;
  const bonusOn = cartShop ? cartShop.bonusEnabled !== false : true;
  const bonus = bonusOn ? bonusFor(total) : null;
  const payTotal = bonus && bonus.money ? total - bonus.money : total;
  const showTeaser = bonusOn && total >= TEASER_MIN && total < TEASER_MAX;

  return (
    <div className="ov" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="cart">
        <div className="cart-head">
          <span style={{ fontFamily: FONT_DISPLAY, fontSize: 20 }}>Savat</span>
          <button className="pm-close" onClick={onClose}><X size={18} /></button>
        </div>

        <div className="cart-modebadge">{priceMode === "optom" ? "🏭 Optom narxda hisoblanmoqda" : "🛍️ Chakana narxda hisoblanmoqda"}</div>
        {cartShop && (
          <div className="cart-shopline"><Store size={13} /> Buyurtma <b>{cartShop.shopName}</b> do'konidan · bitta buyurtma = bitta do'kon</div>
        )}

        {items.length === 0 ? (
          <div className="cart-empty">Savat bo'sh. Tuvaklar bo'limidan mahsulot qo'shing.</div>
        ) : (
          <>
            <div className="cart-list">
              {items.map((it) => (
                <div key={it.key} className="cart-row">
                  <div className="cart-emoji">{it.image ? <img src={it.image} alt="" /> : "🪴"}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 13.5 }}>{it.name}</div>
                    <div style={{ fontSize: 12, color: C.inkDim }}>{it.litr} {unitOf(it.unit).short} · {fmt(priceOf(it, priceMode))}</div>
                  </div>
                  <div className="qty-mini">
                    <button onClick={() => onQty(it.key, -1)}><Minus size={13} /></button>
                    <span>{it.qty}</span>
                    <button onClick={() => onQty(it.key, 1)}><Plus size={13} /></button>
                  </div>
                </div>
              ))}
            </div>

            {showTeaser && (
              <div className="cart-teaser">🎁 Savatingizni to'ldiring — {fmt(TEASER_MAX)}lik chegaradan o'tsangiz, sirli sovg'a kutmoqda!</div>
            )}
            {bonus && bonus.gift && (
              <div className="cart-bonus">🎁 Bu buyurtmaga tuvak-sovg'a qo'shiladi (turi buyurtma bilan birga aniqlanadi)</div>
            )}
            {bonus && bonus.money > 0 && (
              <div className="cart-bonus">
                💰 Bonus: −{fmt(bonus.money)}{bonus.tokin ? ` + ${bonus.tokin} tokin` : ""} — avtomatik ayirildi
              </div>
            )}

            <div className="cart-totals">
              <div className="cart-total"><span>Jami</span><b>{fmt(total)}</b></div>
              {payTotal !== total && (
                <div className="cart-paytotal"><span>To'lov summasi</span><b>{fmt(payTotal)}</b></div>
              )}
            </div>

            {!meetsMin ? (
              <div className="cart-minwarn">
                <Lock size={14} />
                <div>
                  <div style={{ fontWeight: 600 }}>
                    {priceMode === "optom" ? "Optom narx uchun minimal buyurtma" : "Minimal buyurtma"} — {fmt(minRequired)}
                  </div>
                  <div style={{ fontSize: 11.5, marginTop: 2 }}>
                    Yana {fmt(remaining)}lik mahsulot qo'shing, shunda buyurtma berish faollashadi.
                    {priceMode === "optom" && " Yoki yuqoridagi \"Chakana\" tugmasiga o'ting."}
                  </div>
                </div>
              </div>
            ) : (
              <>
                <button className="pm-add" disabled={checking} onClick={onCheckout}>
                  <Send size={15} /> {checking ? "Yuborilmoqda…" : "Buyurtma berish"}
                </button>
                {checkoutError && <div className="cart-err">{checkoutError}</div>}
              </>
            )}
          </>
        )}
      </div>
    </div>
  );

/* ============================== Profile screen ============================== */
function ProfileScreen({ onClose, profile, tokens, badgeOwned, generations, onBuyTokens, onBuyBadge,
  cust, orders, linked, vouchers, onLink, onSaveName, onPhoto, onCancelOrder, onReceiveOrder, onPaidOrder }) {
  const [cancelingId, setCancelingId] = useState(null); // "tasdiqlaysizmi?" bosqichi
  const [cancelBusy, setCancelBusy] = useState(false);
  const [cancelErr, setCancelErr] = useState("");
  const [payFormId, setPayFormId] = useState(null);     // "To'lov qildim" izoh formasi
  const [payNote, setPayNote] = useState("");
  const [actBusy, setActBusy] = useState(false);
  async function doCancelOrder(id) {
    setCancelBusy(true); setCancelErr("");
    const err = await onCancelOrder(id);
    setCancelBusy(false);
    setCancelingId(null);
    if (err) setCancelErr(err);
  }
  async function doReceive(id) {
    setActBusy(true); setCancelErr("");
    const err = await onReceiveOrder(id);
    setActBusy(false);
    if (err) setCancelErr(err);
  }
  async function doPaid(id) {
    setActBusy(true); setCancelErr("");
    const err = await onPaidOrder(id, payNote.trim());
    setActBusy(false);
    if (err) setCancelErr(err);
    else { setPayFormId(null); setPayNote(""); }
  }
  const tier = tierForTokens(tokens, badgeOwned);
  const nextTier = TIERS_BADGE.find((t) => t.min > tokens);
  const photoRef = React.useRef(null);

  const [code, setCode] = useState("");
  const [linkBusy, setLinkBusy] = useState(false);
  const [linkErr, setLinkErr] = useState("");
  const [editName, setEditName] = useState(false);
  const [fn, setFn] = useState("");
  const [ln, setLn] = useState("");
  const [nameBusy, setNameBusy] = useState(false);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [photoErr, setPhotoErr] = useState("");

  const displayName = cust && (cust.firstName || cust.lastName)
    ? `${cust.firstName || ""} ${cust.lastName || ""}`.trim()
    : (cust && cust.name) || profile.name || "Mehmon";
  const displayPhone = (cust && cust.phone) || profile.phone || "";

  async function doLink() {
    setLinkBusy(true); setLinkErr("");
    const err = await onLink(code.trim());
    setLinkBusy(false);
    if (err) setLinkErr(err); else setCode("");
  }
  async function doSaveName() {
    setNameBusy(true);
    const err = await onSaveName(fn.trim(), ln.trim());
    setNameBusy(false);
    if (!err) setEditName(false);
  }
  async function onPhotoFile(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setPhotoBusy(true); setPhotoErr("");
    const err = await onPhoto(f);
    setPhotoBusy(false);
    if (err) setPhotoErr(err);
  }
  const dateOf = (ts) => {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, "0");
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  return (
    <div className="ov">
      <div className="profile">
        <button className="pm-close" onClick={onClose}><X size={18} /></button>
        <input ref={photoRef} type="file" accept="image/*" hidden onChange={onPhotoFile} />

        <div className="prof-head">
          <div className="prof-avatar" style={{ borderColor: tier.ring, cursor: linked ? "pointer" : "default" }}
            onClick={() => linked && photoRef.current && photoRef.current.click()}
            title={linked ? "Profil rasmini o'zgartirish" : ""}>
            {cust && cust.photo
              ? <img src={cust.photo} alt="" className="prof-photo" />
              : <User size={26} color={tier.color} />}
            {linked
              ? <span className="prof-cam"><Camera size={11} color="#fff" /></span>
              : <span className="prof-badge" style={{ background: tier.color }}><BadgeCheck size={13} color="#fff" /></span>}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            {!editName ? (
              <div className="prof-name">
                {displayName}
                {linked && (
                  <button className="prof-editbtn" onClick={() => {
                    setFn((cust && cust.firstName) || ""); setLn((cust && cust.lastName) || ""); setEditName(true);
                  }}>✎ tahrirlash</button>
                )}

            ) : (
              <div className="prof-nameedit">
                <input value={fn} placeholder="Ism" onChange={(e) => setFn(e.target.value)} />
                <input value={ln} placeholder="Familiya" onChange={(e) => setLn(e.target.value)} />

              </div>
            )}
            <div className="prof-tier" style={{ color: tier.color }}>{tier.label}</div>
            <div className="prof-phone">
              {displayPhone
                ? <>{displayPhone}{linked ? " · Telegram orqali ulangan" : ""}</>
                : "Telefon kiritilmagan"}
            </div>
            {photoBusy && <div className="prof-phone">Rasm yuklanmoqda…</div>}
            {photoErr && <div className="prof-err">{photoErr}</div>}
          </div>
        </div>

        {/* ---------- Buyurtmalarim ---------- */}
        <div className="prof-histhead">
          <ShoppingBag size={14} color={C.inkDim} />
          <span>Buyurtmalarim</span>

          <div className="prof-linkcard">
            <p>Buyurtmalaringizni shu yerda ko'rish uchun profilni Telegram hisobingizga ulang:</p>

            <div className="tg-step"><span>2</span><div>Bot bergan 6 xonali kodni shu yerga kiriting</div></div>
            <div className="prof-linkrow">
              <input value={code} inputMode="numeric" maxLength={6} placeholder="123456"
                onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} />
              <button disabled={linkBusy || code.length !== 6} onClick={doLink}>{linkBusy ? "…" : "Ulash"}</button>
            </div>
            {linkErr && <div className="prof-err">{linkErr}</div>}
            <a className="prof-botlink" href={`https://t.me/${BOT_USERNAME}`} target="_blank" rel="noreferrer">
              <Send size={13} /> Botni ochish
            </a>
          </div>
        ) : (
          <>
            {vouchers && vouchers.length > 0 && (
              <div className="prof-vouchers">
                {vouchers.map((v, i) => (
                  <div key={i} className="prof-voucher">
                    🎁 <b>{v.percent}% chegirma</b>{v.shopName ? ` — ${v.shopName} do'konidan` : ""} keyingi buyurtmangizga
                    (1 mln so'mgacha qismiga). Botda tasdiqlaganingizda avtomatik qo'llanadi.
                  </div>
                ))}
              </div>
            )}
            {cancelErr && <div className="prof-err" style={{ marginBottom: 8 }}>{cancelErr}</div>}
            {orders.length === 0 ? (
              <div className="prof-empty">Hali buyurtma yo'q. Do'konlardan xarid qilganingizda shu yerda ko'rinadi.</div>
            ) : (
              <div className="prof-orders">
                {orders.map((o, i) => (
                  <div key={i} className="prof-order">
                    <div className="prof-order-top">
                      <span className="prof-order-date">{dateOf(o.ts)}</span>
                      <span className={"po-status po-" + (o.status || "yangi")}>
                        {({ yangi: "🆕 Yangi", tayyorlanmoqda: "📦 Tayyorlanmoqda", yuborildi: "🚚 Yuborildi", yetkazildi: "✅ Yetkazildi", qabul: "✅ Qabul qilindi", bekor: "❌ Bekor" })[o.status || "yangi"]}
                      </span>
                    </div>
                    {o.shopName && <div className="prof-order-shop" style={{ marginBottom: 5 }}><Store size={10} /> {o.shopName}</div>}
                    <div className="prof-order-items">
                      {(o.items || []).slice(0, 3).map((it, k) => (
                        <div key={k}>{it.qty} × {it.name}</div>
                      ))}
                      {(o.items || []).length > 3 && <div>… yana {(o.items || []).length - 3} ta</div>}
                    </div>
                    <div className="prof-order-total">
                      {fmt(o.payTotal || o.total || 0)}
                      {o.voucherDiscount > 0 && <span className="po-vdisc"> · 🎁 −{fmt(o.voucherDiscount)} chegirma</span>}
                    </div>

                    {(o.status || "yangi") === "bekor" && (
                      <div className="po-cancelinfo">
                        {o.cancelledBy === "mijoz"
                          ? "Bu buyurtmani o'zingiz bekor qilgansiz."
                          : <>Sabab: {o.cancelReason || "ko'rsatilmagan"}{o.bonusPercent ? <><br />🎁 Uzr sifatida keyingi buyurtmangizga <b>{o.bonusPercent}% chegirma</b> berildi.</> : null}</>}
                      </div>
                    )}

                    {(o.status || "yangi") === "yangi" && o.id && o.sellerId && (
                      cancelingId === o.id ? (
                        <div className="po-cancelask">
                          <span>Rostdan bekor qilasizmi?</span>
                          <button className="po-cbtn po-cyes" disabled={cancelBusy} onClick={() => doCancelOrder(o.id)}>{cancelBusy ? "…" : "Ha, bekor qilish"}</button>
                          <button className="po-cbtn" onClick={() => setCancelingId(null)}>Yo'q</button>
                        </div>
                      ) : (
                        <button className="po-cancelbtn" onClick={() => { setCancelErr(""); setCancelingId(o.id); }}>
                          Bekor qilish
                        </button>
                      )
                    )}

                    {/* Buyurtma yuborilgan — mijoz qabul qilganda bosadi */}
                    {(o.status === "yuborildi") && o.id && o.sellerId && (
                      <button className="po-receivebtn" disabled={actBusy} onClick={() => doReceive(o.id)}>
                        ✅ Buyurtmani qabul qildim
                      </button>
                    )}

                    {/* To'lov chizig'i: sotuvchi bilan kelishib to'laysiz, keyin belgilaysiz */}
                    {(o.status || "yangi") !== "bekor" && o.id && o.sellerId && (
                      o.paymentStatus === "tolangan" ? (
                        <div className="po-payrow po-pay-done">✅ To'lov qabul qilingan</div>
                      ) : o.paymentStatus === "mijoz_toladi" ? (
                        <div className="po-payrow po-pay-wait">
                          💸 To'lov qilganingizni aytdingiz{o.paymentNote ? ` (${o.paymentNote})` : ""} — sotuvchi tasdiqlashi kutilmoqda
                        </div>
                      ) : (
                        <div className="po-payrow po-pay-none">
                          To'lov usulini sotuvchi bilan kelishasiz
                          {o.shopPhone && <a className="po-shoptel" href={"tel:" + o.shopPhone}>📞 {o.shopPhone}</a>}
                          <div style={{ marginTop: 7 }}>
                            {payFormId === o.id ? (
                              <div className="po-payform">
                                <input value={payNote} placeholder="Qanday to'ladingiz? (Payme, naqd...)"
                                  onChange={(e) => setPayNote(e.target.value)} />
                                <button disabled={actBusy} onClick={() => doPaid(o.id)}>{actBusy ? "…" : "Yuborish"}</button>
                              </div>
                            ) : (
                              <button className="po-paybtn" onClick={() => { setPayFormId(o.id); setPayNote(""); }}>💸 To'lov qildim</button>
                            )}
                          </div>
                        </div>
                      )
                    )}
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        <div className="prof-tokencard">
          <div className="prof-token-left">
            <Coins size={18} color={C.laiton} />
            <div>
              <div className="prof-token-n">{tokens}</div>
              <div className="prof-token-l">token qoldi</div>
            </div>
          </div>
          <button className="prof-topup" onClick={onBuyTokens}>Token sotib olish</button>
        </div>

        {nextTier && (
          <div className="prof-progress">
            <div className="prof-progress-row">
              <span>{tier.label}</span><span>{nextTier.label}</span>
            </div>
            <div className="prof-bar"><div className="prof-bar-fill" style={{ width: `${Math.min(100, (tokens / nextTier.min) * 100)}%`, background: nextTier.color }} /></div>
            <div className="prof-progress-hint">Yana {Math.max(0, nextTier.min - tokens)} token — {nextTier.label} darajasi</div>
          </div>
        )}

        <div className="prof-badgecard">
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span className="prof-badge-ic" style={{ background: badgeOwned ? tier.color : C.mline }}>
              <BadgeCheck size={16} color="#fff" />
            </span>
            <div>
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>Nishon (belgi)</div>
              <div style={{ fontSize: 11.5, color: C.inkDim }}>{badgeOwned ? "Faol — profilingizda ko'rinadi" : "Token to'plamasdan ham alohida sotib olinadi"}</div>
            </div>
          </div>
          {!badgeOwned && <button className="prof-badgebuy" onClick={onBuyBadge}>Sotib olish</button>}
          {badgeOwned && <Check size={18} color={C.accent} />}
        </div>

        <div className="prof-histhead">
          <Clock size={14} color={C.inkDim} />
          <span>Generatsiyalar tarixi</span>
        </div>
        {generations.length === 0 ? (
          <div className="prof-empty">Hali generatsiya qilinmagan. Studiyadan boshlang.</div>
        ) : (
          <div className="prof-grid">
            {generations.map((g, i) => (
              <div key={i} className="prof-gitem">
                {g.thumb ? <img src={g.thumb} alt="" /> : <Sparkles size={20} color={C.laitonLo} />}
                <span>{g.date}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== App ============================== */
function App() {
  const [flower, setFlower] = useState(null);
  const [pot, setPot] = useState(null);
  const [lang, setLang] = useState("uz");
  const [langOpen, setLangOpen] = useState(false);
  const [genLoading, setGenLoading] = useState(false);
  const [genDone, setGenDone] = useState(false);

  const [products, setProducts] = useState([]);
  const [productsLoading, setProductsLoading] = useState(true);
  const [productsError, setProductsError] = useState(null);
  const [shops, setShops] = useState([]);              // studiyadagi do'konlar devori
  const [shopsLoading, setShopsLoading] = useState(true);
  const [priceMode, setPriceMode] = useState("chakana"); // "chakana" | "optom"
  const [shopFilter, setShopFilter] = useState(null);    // null | { id, name } — do'kon sahifasi

  const [activeProduct, setActiveProduct] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState([]);
  // boshqa do'kondan mahsulot qo'shilmoqchi bo'lganda chiqadigan ogohlantirish:
  // { fam, variant, qty, currentShop, newShop } | null
  const [shopConflict, setShopConflict] = useState(null);
  const [checking, setChecking] = useState(false);
  const [checkoutError, setCheckoutError] = useState(null);
  const [order, setOrder] = useState(null); // { orderId, payTotal, shopName, voucherDiscount, voucherPercent }
  const [checkoutFormOpen, setCheckoutFormOpen] = useState(false);

  const [profileOpen, setProfileOpen] = useState(false);
  const [profile, setProfile] = useState({ name: "", phone: "" });
  // Telegram bilan ulangan mijoz hisobi (bot /kod orqali)
  const [custAuth, setCustAuth] = useState(null);       // { chatId, token }
  const [custProfile, setCustProfile] = useState(null); // { firstName, lastName, phone, photo, ... }
  const [custOrders, setCustOrders] = useState([]);
  const [custVouchers, setCustVouchers] = useState([]); // bekor kompensatsiyasi bonuslari
  const [tokens, setTokens] = useState(2);
  const [badgeOwned, setBadgeOwned] = useState(false);
  const [generations, setGenerations] = useState([]);

  // load persisted account state once (real localStorage — works on the live site)
  useEffect(() => {
    const c = storageGet("zetme_customer", null);
    if (c) { try { setProfile(JSON.parse(c)); } catch (e) {} }
    const t = storageGet("zetme_tokens", null);
    if (t != null) setTokens(Number(t));
    const b = storageGet("zetme_badge", null);
    if (b === "1") setBadgeOwned(true);
    const g = storageGet("zetme_generations", null);
    if (g) { try { setGenerations(JSON.parse(g)); } catch (e) {} }
    const ca = storageGet("zetme_cust_auth", null);
    if (ca) { try { setCustAuth(JSON.parse(ca)); } catch (e) {} }
  }, []);

  /* ---------------- mijoz profili (Telegram bilan ulangan) ---------------- */
  async function customerApi(payload) {
    const r = await fetch(`${API_BASE}/api/customer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    return r.json();
  }

  // ulangan bo'lsa — profil va buyurtmalarni yangilab turamiz
  useEffect(() => {
    if (!custAuth) return;
    customerApi({ action: "me", chatId: custAuth.chatId, token: custAuth.token })
      .then((d) => {
        if (d.ok) { setCustProfile(d.profile); setCustOrders(d.orders || []); setCustVouchers(d.vouchers || []); }
        else { setCustAuth(null); setCustProfile(null); setCustOrders([]); setCustVouchers([]); storageSet("zetme_cust_auth", ""); }
      })
      .catch(() => {});
  }, [custAuth && custAuth.chatId]);

  async function linkCustomer(code) {
    // saytdagi "web" hisob bo'lsa, tarixi Telegram hisobiga ko'chiriladi
    const extra = custAuth && String(custAuth.chatId).startsWith("w")
      ? { oldChatId: custAuth.chatId, oldToken: custAuth.token } : {};
    const d = await customerApi({ action: "link", code, ...extra });
    if (!d.ok) return d.error || "Xatolik";
    const auth = { chatId: d.chatId, token: d.token };
    setCustAuth(auth);
    setCustProfile(d.profile);
    setCustOrders(d.orders || []);
    setCustVouchers(d.vouchers || []);
    storageSet("zetme_cust_auth", JSON.stringify(auth));
    return null;
  }

  // Holat o'zgarishlarini kuzatish: har 60 soniyada yangilanadi,
  // yangilik bo'lsa pastki "Profil" tugmasida qizil nuqta chiqadi
  useEffect(() => {
    if (!custAuth) return;
    const t = setInterval(() => {
      customerApi({ action: "me", chatId: custAuth.chatId, token: custAuth.token })
        .then((d) => { if (d.ok) { setCustOrders(d.orders || []); setCustVouchers(d.vouchers || []); } })
        .catch(() => {});
    }, 60000);
    return () => clearInterval(t);
  }, [custAuth && custAuth.chatId]);

  // Profil ochilganda holatni darhol yangilaymiz
  useEffect(() => {
    if (!profileOpen || !custAuth) return;
    customerApi({ action: "me", chatId: custAuth.chatId, token: custAuth.token })
      .then((d) => { if (d.ok) { setCustProfile(d.profile); setCustOrders(d.orders || []); setCustVouchers(d.vouchers || []); } })
      .catch(() => {});
  }, [profileOpen]);

  const seenTs = Number(storageGet("zetme_seen_ts", "0")) || 0;

  // rasmni brauzerda kichraytirib (400px, JPEG) serverga yuboramiz
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const S = 400;
        const k = Math.min(1, S / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * k);
        canvas.height = Math.round(img.height * k);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
      };
      img.onerror = () => reject(new Error("Rasmni o'qib bo'lmadi"));
      img.src = URL.createObjectURL(file);
    });
  }

  async function setCustPhoto(file) {

      if (!d.ok) return d.error || "Xatolik";

  function doAddToCart(fam, variant, qty) {
    const key = `${fam.id}_${variant.id}`;
    setCart((c) => {
      const ex = c.find((i) => i.key === key);
      if (ex) return c.map((i) => (i.key === key ? { ...i, qty: i.qty + qty } : i));
      return [...c, {
        key, id: fam.id, variantId: variant.id,
        name: variant.name || fam.name, litr: variant.litr, unit: fam.unit || "litr",
        price: Number(variant.price), optPrice: Number(variant.optPrice),

        sellerId: fam.sellerId || "zetme",
        shopName: fam.shopName || "Tuvaklar",

    });

        fam, variant, qty,
        currentShop: cart[0].shopName,
        newShop: fam.shopName || "Tuvaklar",

      return;
    }
    doAddToCart(fam, variant, qty);
  }

    if (clearAndAdd && shopConflict) {
      setCart([]);

      const { fam, variant, qty } = shopConflict;
      setCart([{
        key: `${fam.id}_${variant.id}`, id: fam.id, variantId: variant.id,
        name: variant.name || fam.name, litr: variant.litr, unit: fam.unit || "litr",
        price: Number(variant.price), optPrice: Number(variant.optPrice),

                <span className="market-optnote">Optom narx — {fmt(OPT_MIN_ORDER)}+ savatda</span>
              )}
            </div>

            {shopGroups.length > 1 && (
              <div className="secchips">
                {shopGroups.map((g) => (
                  <button key={g.id} className="secchip" onClick={() => scrollToSection(g.id)}>
                    {g.name} <span>{g.items.length}</span>
                  </button>
                ))}
              </div>
            )}

            {visibleProducts.length === 0 && (
              <div className="market-state">
                {priceMode === "optom"
                  ? "Bu do'kon mahsulotlariga hali optom narx kiritilmagan."
                  : "Bu do'konda hozircha mahsulot yo'q."}
              </div>
            )}

            {shopGroups.map((g) => (
              <div key={g.id} className="secblock" id={"sec-" + g.id}>
                {shopGroups.length > 1 && (
                  <h3 className="sec-title">{g.name} <span className="sec-count">{g.items.length}</span></h3>
                )}
                <div className="grid">
                  {g.items.map((p) => (
                    <div key={p.id} className="pcard" onClick={() => setActiveProduct(p)}>
                      <div className="pcard-img">
                        {thumbUrl(p) ? <img src={thumbUrl(p)} alt={p.name} /> : <span style={{ fontSize: 34 }}>🪴</span>}
                      </div>
                      <div className="pcard-body">
                        <div className="pcard-name">{p.name}</div>
                        <div className="pcard-meta">{litrRangeText(p)}{p.color ? ` · ${p.color}` : ""}</div>
                        <div className="pcard-price">{priceRangeText(p, priceMode)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </>
        )}
      </section>

      {/* bottom nav (mobile) */}
      <nav className="bottomnav">
        <button className="bn-item active" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
          <Sparkles size={18} /><span>Studiya</span>
        </button>
        <button className="bn-item" onClick={() => { const el = document.getElementById("market"); if (el) el.scrollIntoView({ behavior: "smooth" }); }}>
          <Store size={18} /><span>Mahsulotlar</span>
        </button>
        <button className="bn-item" onClick={() => setCartOpen(true)} style={{ position: "relative" }}>
          <ShoppingBag size={18} />
          {cartCount > 0 && <span className="bn-badge">{cartCount}</span>}
          <span>Savat</span>
        </button>
        <button className="bn-item" onClick={() => setProfileOpen(true)} style={{ position: "relative" }}>
          <User size={18} />
          {hasNews && !profileOpen && <span className="bn-dot" />}
          <span>Profil</span>
        </button>
      </nav>

      {activeProduct && (
        <ProductModal p={activeProduct} priceMode={priceMode} onClose={() => setActiveProduct(null)} onAdd={addToCart} onSendToStudio={sendPotToStudio} />
      )}
      {cartOpen && (
        <CartDrawer
          items={cart}
          priceMode={priceMode}
          onClose={() => setCartOpen(false)}
          onQty={changeQty}
          onCheckout={checkout}
          checking={checking}
          checkoutError={checkoutError}
        />
      )}
      {checkoutFormOpen && (
        <CheckoutForm
          initial={{
            name: (custProfile && (custProfile.firstName || custProfile.name)) || profile.name || "",
            phone: (custProfile && custProfile.phone) || profile.phone || "",
            region: (custProfile && custProfile.region) || profile.region || "",
          }}
          itemCount={cart.length}
          payTotal={cartPayTotal}
          shopName={cart[0] ? cart[0].shopName : ""}
          busy={checking}
          error={checkoutError}
          onSubmit={placeOrder}
          onClose={() => setCheckoutFormOpen(false)}
        />
      )}
      {order && (
        <OrderSuccess
          orderId={order.orderId}
          payTotal={order.payTotal}
          shopName={order.shopName}
          voucherDiscount={order.voucherDiscount}
          voucherPercent={order.voucherPercent}
          onClose={() => setOrder(null)}
          onOpenProfile={() => { setOrder(null); setProfileOpen(true); }}
        />
      )}
      {shopConflict && (
        <div className="ov" onClick={(e) => e.target === e.currentTarget && resolveShopConflict(false)}>
          <div className="conflict">
            <div className="conflict-ic"><Store size={22} color={C.laitonLo} /></div>
            <h3 style={{ fontFamily: FONT_DISPLAY, fontSize: 20, margin: "0 0 6px" }}>Savatda boshqa do'kon mahsuloti bor</h3>
            <p style={{ fontSize: 13.5, color: C.inkDim, margin: "0 0 16px", lineHeight: 1.55 }}>
              Savatingizda hozir <b>{shopConflict.currentShop}</b> do'konining mahsulotlari turibdi.
              Bitta buyurtmada faqat bitta do'kondan xarid qilinadi — avval joriy buyurtmani yakunlang,
              yoki savatni tozalab <b>{shopConflict.newShop}</b> do'konidan boshlang.
            </p>
            <button className="pm-add" onClick={() => { resolveShopConflict(false); setCartOpen(true); }}>
              <ShoppingBag size={15} /> Joriy buyurtmani yakunlash ({shopConflict.currentShop})
            </button>
            <button className="conflict-clear" onClick={() => resolveShopConflict(true)}>
              Savatni tozalash va {shopConflict.newShop} dan boshlash
            </button>
            <button className="conflict-cancel" onClick={() => resolveShopConflict(false)}>Bekor qilish</button>
          </div>
        </div>
      )}
      {profileOpen && (
        <ProfileScreen onClose={() => setProfileOpen(false)} profile={profile} tokens={tokens}
          badgeOwned={badgeOwned} generations={generations} onBuyTokens={buyTokens} onBuyBadge={buyBadge}
          cust={custProfile} orders={custOrders} linked={!!custAuth}
          vouchers={custVouchers.map((v) => ({ ...v, shopName: (shops.find((s) => s.id === v.sellerId) || {}).shopName || "" }))}
          onLink={linkCustomer} onSaveName={saveCustName} onPhoto={setCustPhoto} onCancelOrder={cancelCustOrder}
          onReceiveOrder={receiveCustOrder} onPaidOrder={paidCustOrder} />
      )}
    </div>
  );
}

.market-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.market-optnote{font-size:11px;color:${C.laitonLo};font-weight:600}
.market-state{font-size:13px;color:${C.inkDim};background:${C.card};border:1px solid ${C.mline};border-radius:12px;padding:18px;text-align:center}
.market-state.err{color:${C.sale}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}

/* ---------- MARKET: do'konlar ro'yxati (1-qadam) ---------- */
.market-hint{font-size:12.5px;color:${C.inkDim};margin:0 0 14px}
.mshop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mshop-card{text-align:left;padding:0;background:${C.card};border:1px solid ${C.mline};border-radius:16px;overflow:hidden;
  cursor:pointer;font-family:inherit;animation:swFade .5s cubic-bezier(.22,1,.36,1) both;
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s}
.mshop-card:hover{transform:translateY(-4px);border-color:${C.laiton};box-shadow:0 12px 26px rgba(11,33,27,.12)}
.mshop-img{position:relative;aspect-ratio:1/1;background:linear-gradient(150deg,#eef1ec,#e2e8e1);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.mshop-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.mshop-card:hover .mshop-img img{transform:scale(1.07)}
.mshop-letter{font-family:${FONT_DISPLAY};font-size:42px;color:${C.laitonLo};opacity:.6}
.mshop-star{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:20px;background:${C.laiton};
  color:${C.noir};font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mshop-body{padding:10px 12px 12px}
.mshop-name{font-weight:600;font-size:14px;color:${C.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mshop-count{display:flex;align-items:center;gap:2px;font-size:11.5px;color:${C.inkDim};margin-top:2px}

/* ---------- MARKET: do'kon ichi (2-qadam) ---------- */
.shopback{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid ${C.mline};
  color:${C.inkDim};border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:pointer;margin-bottom:12px}
.shopback:hover{border-color:${C.ink};color:${C.ink}}
.shophead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shophead-img{width:56px;height:56px;flex-shrink:0;border-radius:16px;overflow:hidden;border:1px solid ${C.mline};
  background:linear-gradient(150deg,#eef1ec,#e2e8e1);display:flex;align-items:center;justify-content:center}
.shophead-img img{width:100%;height:100%;object-fit:cover}
.shophead-name{font-family:${FONT_DISPLAY};font-size:23px;font-weight:600;color:${C.ink};margin:0;line-height:1.1}
.shophead-meta{font-size:12px;color:${C.inkDim};margin-top:2px}
.secchips{position:sticky;top:0;z-index:25;display:flex;gap:7px;overflow-x:auto;padding:10px 2px;margin:0 -2px 6px;
  background:linear-gradient(${C.paper} 88%,transparent);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.secchips::-webkit-scrollbar{display:none}
.secchip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;border:1px solid ${C.mline};background:${C.card};
  color:${C.ink};border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.secchip:hover{border-color:${C.laiton}}
.secchip span{font-size:10.5px;color:${C.laitonLo};font-weight:700}
.secblock{scroll-margin-top:52px}
.sec-title{display:flex;align-items:baseline;gap:7px;font-family:${FONT_DISPLAY};font-size:20px;font-weight:600;
  color:${C.ink};margin:18px 0 10px}
.sec-count{font-family:${FONT_BODY};font-size:11px;font-weight:600;color:${C.laitonLo}}
.pcard{background:${C.card};border:1px solid ${C.mline};border-radius:14px;padding:10px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;font-family:${FONT_BODY}}
.pcard-shop{display:inline-flex;align-items:center;gap:4px;background:transparent;border:none;padding:0;
  font-size:10.5px;font-weight:700;color:${C.laitonLo};cursor:pointer;font-family:${FONT_BODY};text-align:left}
.pcard-shop:hover{text-decoration:underline}
.pcard-img{background:${C.paper};border-radius:10px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pcard-name{font-size:12.5px;font-weight:600;color:${C.ink};line-height:1.3}
.pcard-meta{font-size:11px;color:${C.inkDim}}
.pcard-price{font-size:13.5px;font-weight:700;color:${C.price};margin-top:2px}

/* ---------- kategoriya chiplari + do'kon banneri ---------- */
.catchips{display:inline-flex;gap:6px}
.catchip{border:1px solid ${C.mline};background:${C.card};color:${C.inkDim};border-radius:20px;padding:6px 12px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:${FONT_BODY}}
.catchip.active{border-color:${C.ink};background:${C.ink};color:#fff}
.shopbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FCF3E2;
  border:1px solid #EFD9A8;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:${C.laitonLo}}
.shopbanner span{display:flex;align-items:center;gap:7px}
.shopbanner button{display:flex;align-items:center;gap:4px;background:transparent;border:1px solid ${C.laitonLo};
  color:${C.laitonLo};border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:${FONT_BODY}}

/* ---------- chakana/optom toggle ---------- */
.pmtoggle{display:inline-flex;background:${C.card};border:1px solid ${C.mline};border-radius:20px;padding:3px}
.pmtoggle-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;border-radius:16px;
  padding:6px 12px;font-size:12px;font-weight:600;color:${C.inkDim};cursor:pointer;font-family:${FONT_BODY}}
.pmtoggle-btn.active{background:${C.accent};color:#fff}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:${C.card};border-top:1px solid ${C.mline};
  display:flex;z-index:15;padding:6px 0 8px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;
  color:${C.inkDim};font-size:10.5px;font-family:${FONT_BODY};cursor:pointer;position:relative}
.bn-item.active{color:${C.accent};font-weight:600}
.bn-badge{position:absolute;top:-4px;right:calc(50% - 18px);background:${C.sale};color:#fff;font-size:9px;
  border-radius:20px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ---------- overlay shared ---------- */
.ov{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pm-close{position:absolute;top:12px;right:12px;background:${C.paper};border:1px solid ${C.mline};border-radius:20px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}

/* product modal */
.pmodal{position:relative;background:${C.card};width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;animation:slideup .3s ease both}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.pm-hero{aspect-ratio:4/3;max-height:340px;width:100%;background:${C.paper};display:flex;align-items:center;justify-content:center;overflow:hidden}
.pm-hero-img{width:100%;height:100%;object-fit:contain}
.pm-thumbrow{display:flex;gap:8px;padding:10px 20px 0}
.pm-thumb{width:52px;height:52px;border-radius:10px;border:2px solid ${C.mline};background:${C.paper};padding:0;cursor:pointer;overflow:hidden}
.pm-thumb.active{border-color:${C.accent}}
.pm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pm-body{padding:18px 20px 24px}
.pm-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.pm-modebadge{font-size:10.5px;font-weight:700;color:${C.accent};text-transform:uppercase;letter-spacing:.04em}
.pm-shop{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:${C.laitonLo}}
.pm-title{font-family:${FONT_DISPLAY};font-size:22px;margin:2px 0 8px;color:${C.ink}}
.pm-price{font-size:20px;font-weight:700;color:${C.ink};margin-bottom:14px}
.pm-litrrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pm-litrchip{border:1.5px solid ${C.mline};background:${C.paper};color:${C.ink};border-radius:20px;padding:7px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:${FONT_BODY}}
.pm-litrchip.active{border-color:${C.accent};background:${C.accent};color:#fff}
.pm-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pm-specs div{background:${C.paper};border-radius:10px;padding:8px;text-align:center}
.pm-specs span{display:block;font-size:10px;color:${C.inkDim}}
.pm-specs b{font-size:12px;color:${C.ink}}
.pm-qty{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px}
.pm-qty button{width:34px;height:34px;border-radius:10px;border:1px solid ${C.mline};background:${C.paper};cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.pm-qty span{font-size:16px;font-weight:600;min-width:22px;text-align:center}
.pm-add{width:100%;background:${C.accent};color:#fff;border:none;border-radius:14px;padding:14px;font-weight:600;
  font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:${FONT_BODY}}
.pm-add:disabled{opacity:.5;cursor:not-allowed}
.pm-studio{width:100%;background:transparent;border:1px solid ${C.laitonLo};color:${C.laitonLo};border-radius:14px;
  padding:12px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;margin-top:8px;font-family:${FONT_BODY}}

/* cart */
.cart{position:relative;background:${C.card};width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:85vh;overflow-y:auto;padding:18px 18px 22px;animation:slideup .3s ease both}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cart-modebadge{font-size:11.5px;font-weight:600;color:${C.accent};background:#EAF3EC;border-radius:10px;
  padding:7px 10px;margin-bottom:8px;display:inline-block}
.cart-shopline{display:flex;align-items:center;gap:7px;font-size:12px;color:${C.laitonLo};background:#FCF3E2;
  border-radius:10px;padding:8px 10px;margin-bottom:14px}
.cart-shopline b{font-weight:700}

/* do'kon to'qnashuvi ogohlantirishi */
.conflict{position:relative;background:${C.card};width:100%;max-width:440px;border-radius:20px 20px 0 0;
  padding:24px 20px 26px;animation:slideup .3s ease both;text-align:left}
.conflict-ic{width:46px;height:46px;border-radius:14px;background:#FCF3E2;display:flex;align-items:center;
  justify-content:center;margin-bottom:12px}
.conflict-clear{width:100%;background:transparent;border:1.5px solid ${C.laitonLo};color:${C.laitonLo};border-radius:14px;
  padding:12px;font-weight:600;font-size:13px;cursor:pointer;margin-top:8px;font-family:${FONT_BODY}}
.conflict-cancel{width:100%;background:transparent;border:none;color:${C.inkDim};padding:10px;font-size:12.5px;
  cursor:pointer;margin-top:4px;font-family:${FONT_BODY}}
.cart-empty{text-align:center;color:${C.inkDim};font-size:13.5px;padding:30px 10px}
.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.cart-row{display:flex;align-items:center;gap:10px}
.cart-emoji{width:44px;height:44px;background:${C.paper};border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.cart-emoji img{width:100%;height:100%;object-fit:cover}
.qty-mini{display:flex;align-items:center;gap:8px}
.qty-mini button{width:24px;height:24px;border-radius:7px;border:1px solid ${C.mline};background:${C.paper};cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.qty-mini span{font-size:13px;font-weight:600;min-width:16px;text-align:center}
.cart-teaser{background:#FBEFEA;color:${C.sale};font-size:12px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.cart-bonus{background:#FCF3E2;color:${C.laitonLo};font-size:12px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.cart-totals{border-top:1px dashed ${C.mline};padding-top:10px;margin-bottom:14px}
.cart-total{display:flex;justify-content:space-between;font-size:17px}
.cart-total b{color:${C.ink}}
.cart-paytotal{display:flex;justify-content:space-between;font-size:13.5px;color:${C.accent};margin-top:4px}
.cart-err{color:${C.sale};font-size:12.5px;margin-top:8px;text-align:center}
.cart-minwarn{display:flex;gap:10px;align-items:flex-start;background:#FBEFEA;color:${C.sale};border-radius:12px;
  padding:12px 14px;font-size:12.5px}
.tg-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.tg-step{display:flex;align-items:center;gap:10px;font-size:13px;color:${C.ink}}
.tg-step span{width:22px;height:22px;border-radius:50%;background:${C.paper};border:1px solid ${C.mline};
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${C.accent};flex-shrink:0}

/* checkout */
.checkout{position:relative;background:${C.card};width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:22px 20px 26px;animation:slideup .3s ease both;text-align:left}
.tg-badge{display:inline-block;background:#E7F3FE;color:#2B7FD6;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.co-hint{font-size:11px;color:${C.inkDim};margin-top:12px;line-height:1.5}

/* profile screen */
.profile{position:relative;background:${C.card};width:100%;max-width:480px;border-radius:20px 20px 0 0;
  height:96vh;max-height:96vh;overflow-y:auto;padding:20px 20px 26px;animation:slideup .3s ease both;text-align:left}
.prof-photo{width:100%;height:100%;object-fit:cover;border-radius:50%}
.prof-cam{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:${C.accent};
  display:flex;align-items:center;justify-content:center;border:2px solid ${C.card}}
.prof-editbtn{background:transparent;border:none;color:${C.laitonLo};font-size:11px;font-weight:600;cursor:pointer;
  font-family:inherit;padding:0;margin-left:8px}
.prof-nameedit{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.prof-nameedit input{flex:1;min-width:90px;padding:7px 10px;border:1px solid ${C.mline};border-radius:9px;font-size:13px;font-family:inherit}
.prof-nameedit button{padding:7px 12px;border:none;border-radius:9px;background:${C.accent};color:#fff;font-size:12px;
  font-weight:600;font-family:inherit;cursor:pointer}
.prof-err{font-size:11.5px;color:${C.sale};margin-top:4px}
.prof-ordcount{font-style:normal;font-size:10.5px;color:${C.laitonLo};font-weight:700;margin-left:2px}
.prof-linkcard{background:${C.paper};border:1px solid ${C.mline};border-radius:14px;padding:14px;margin-bottom:14px}
.prof-linkcard p{margin:0 0 10px;font-size:12.5px;color:${C.inkDim};line-height:1.55}
.prof-linkrow{display:flex;gap:8px;margin-top:10px}
.prof-linkrow input{flex:1;padding:10px 12px;border:1px solid ${C.mline};border-radius:10px;font-size:16px;
  letter-spacing:4px;text-align:center;font-family:inherit}
.prof-linkrow button{padding:10px 18px;border:none;border-radius:10px;background:${C.accent};color:#fff;
  font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
.prof-linkrow button:disabled{opacity:.45}
.prof-botlink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;
  color:#2B7FD6;text-decoration:none}
.prof-orders{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.prof-order{background:${C.paper};border:1px solid ${C.mline};border-radius:13px;padding:11px 13px}
.prof-order-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.prof-order-date{font-size:11px;color:${C.inkDim}}
.prof-order-shop{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:${C.laitonLo}}
.po-status{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.po-yangi{background:#E7F3FE;color:#2B7FD6}
.po-tayyorlanmoqda{background:#FBF3E2;color:#8a6a2f}
.po-yetkazildi{background:#EAF3EC;color:${C.accent}}
.po-bekor{background:#FBEFEA;color:${C.sale}}
.po-yuborildi{background:#EEE9FB;color:#6B4FBB}
.po-qabul{background:#EAF3EC;color:${C.accent}}
.co-label{display:block;font-size:11.5px;font-weight:600;color:${C.inkDim};margin:10px 0 4px;text-align:left}
.co-input{width:100%;padding:11px 13px;border:1px solid ${C.mline};border-radius:11px;font-size:14.5px;font-family:${FONT_BODY};background:#fff;color:${C.ink}}
.os-ic{width:54px;height:54px;border-radius:50%;background:${C.accent};display:flex;align-items:center;justify-content:center;margin:6px auto 0}
.po-payrow{margin-top:8px;padding:9px 11px;border-radius:10px;font-size:12px;line-height:1.55}
.po-pay-none{background:${C.paper};border:1px dashed ${C.mline}}
.po-pay-wait{background:#FBF3E2;color:#6d5426}
.po-pay-done{background:#EAF3EC;color:${C.accent};font-weight:600}
.po-paybtn{background:${C.ink};border:none;color:#fff;border-radius:16px;padding:7px 14px;font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer}
.po-payform{display:flex;gap:6px;margin-top:7px}
.po-payform input{flex:1;padding:8px 11px;border:1px solid ${C.mline};border-radius:9px;font-size:12.5px;font-family:inherit}
.po-payform button{background:${C.accent};border:none;color:#fff;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.po-receivebtn{margin-top:8px;width:100%;background:${C.accent};border:none;color:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.po-shoptel{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:#2B7FD6;text-decoration:none;font-weight:600;margin-left:8px}
.bn-dot{position:absolute;top:2px;right:14px;width:8px;height:8px;border-radius:50%;background:${C.sale}}
.prof-vouchers{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.prof-voucher{background:#FBF3E2;border:1px solid ${C.laiton}55;border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.55;color:#6d5426}
.po-vdisc{font-weight:600;font-size:11.5px;color:${C.laitonLo}}
.po-cancelinfo{margin-top:7px;font-size:12px;line-height:1.55;color:${C.sale};background:#FBEFEA;border-radius:9px;padding:8px 11px}
.po-cancelbtn{margin-top:8px;background:transparent;border:1px solid ${C.mline};color:${C.inkDim};border-radius:16px;
  padding:6px 14px;font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer}
.po-cancelbtn:hover{border-color:${C.sale};color:${C.sale}}
.po-cancelask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:${C.inkDim}}
.po-cbtn{border:1px solid ${C.mline};background:#fff;border-radius:16px;padding:6px 12px;font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;color:${C.inkDim}}
.po-cyes{background:#FBEFEA;border-color:${C.sale};color:${C.sale}}
.prof-order-items{font-size:12px;color:${C.ink};line-height:1.55}
.prof-order-total{margin-top:6px;font-weight:700;font-size:13px;color:${C.ink}}
.prof-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.prof-avatar{position:relative;width:56px;height:56px;border-radius:50%;border:2px solid;background:${C.paper};
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prof-badge{position:absolute;bottom:-2px;right:-2px;width:19px;height:19px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;border:2px solid ${C.card}}
.prof-name{font-family:${FONT_DISPLAY};font-size:18px;font-weight:600;color:${C.ink}}
.prof-tier{font-size:12px;font-weight:700;margin:1px 0}
.prof-phone{font-size:12px;color:${C.inkDim}}

.prof-tokencard{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#16281f,${C.noir});
  color:${C.ivoire};border-radius:16px;padding:14px 16px;margin-bottom:14px}
.prof-token-left{display:flex;align-items:center;gap:10px}
.prof-token-n{font-family:${FONT_DISPLAY};font-size:22px;line-height:1}
.prof-token-l{font-size:10.5px;color:${C.ivoireDim}}
.prof-topup{background:${C.laiton};color:${C.noir};border:none;border-radius:20px;padding:8px 14px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:${FONT_BODY}}

.prof-progress{margin-bottom:14px}
.prof-progress-row{display:flex;justify-content:space-between;font-size:11px;color:${C.inkDim};margin-bottom:5px}
.prof-bar{height:6px;background:${C.mline};border-radius:10px;overflow:hidden}
.prof-bar-fill{height:100%;border-radius:10px;transition:width .4s ease}
.prof-progress-hint{font-size:10.5px;color:${C.inkDim};margin-top:5px}

.prof-badgecard{display:flex;align-items:center;justify-content:space-between;background:${C.paper};
  border:1px solid ${C.mline};border-radius:14px;padding:12px 14px;margin-bottom:20px}
.prof-badge-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prof-badgebuy{background:${C.ink};color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:11.5px;
  font-weight:700;cursor:pointer;font-family:${FONT_BODY}}

.prof-histhead{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:${C.ink};margin-bottom:10px}
.prof-empty{font-size:12.5px;color:${C.inkDim};background:${C.paper};border-radius:12px;padding:16px;text-align:center}
.prof-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prof-gitem{aspect-ratio:1;background:${C.paper};border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;overflow:hidden;position:relative}
.prof-gitem img{width:100%;height:100%;object-fit:cover}
.prof-gitem span{position:absolute;bottom:2px;left:0;right:0;font-size:8px;color:#fff;background:#00000090;
  text-align:center;padding:1px 0}

@media (min-width:640px){
  .genslot{width:190px}
}
