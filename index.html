.sw-sub{font-size:12px;color:${C.ivoireDim};text-align:center;margin:0 0 18px;animation:swFade .6s ease .12s both}
.sw-empty{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:${C.ivoireDim};
  border:1px dashed ${C.line};border-radius:14px;padding:20px}

.sw-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.sw-tile{flex:0 1 clamp(112px,26vw,168px);max-width:168px;
  position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;cursor:pointer;padding:0;
  border:1px solid ${C.line};background:#0c261e;animation:swRise .62s cubic-bezier(.22,1,.36,1) both;
  transition:transform .32s cubic-bezier(.22,1,.36,1),border-color .32s,box-shadow .32s}
.sw-tile:hover,.sw-tile:focus-visible{transform:translateY(-6px);border-color:${C.laitonLo};
  box-shadow:0 16px 34px #0009,0 0 0 1px ${C.laiton}33;outline:none}
.sw-tile:active{transform:translateY(-2px) scale(.985)}
.sw-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,${C.vertLo},${C.noir})}
.sw-img img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.sw-tile:hover .sw-img img{transform:scale(1.09)}
.sw-letter{font-family:${FONT_DISPLAY};font-size:40px;color:${C.laiton};opacity:.7}
.sw-veil{position:absolute;inset:0;background:linear-gradient(to top,#000000cc 0%,#00000055 34%,transparent 62%)}
.sw-shine{position:absolute;top:-60%;left:0;width:42%;height:220%;pointer-events:none;
  background:linear-gradient(90deg,transparent,#ffffff26,transparent);transform:translateX(-140%) rotate(18deg)}
.sw-tile:hover .sw-shine{animation:swShine 1.05s ease-out}
.sw-name{position:absolute;left:9px;right:9px;bottom:9px;display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;color:${C.ivoire};text-shadow:0 1px 6px #000c;text-align:left;line-height:1.25}
.sw-name span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sw-count{position:absolute;top:8px;left:8px;min-width:20px;height:20px;padding:0 6px;border-radius:20px;
  background:#0b211bcc;border:1px solid ${C.line};color:${C.laitonHi};font-size:10.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.sw-bonus{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:20px;background:${C.laiton};
  color:#0B211B;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sw-skel{background:linear-gradient(150deg,${C.vertLo},${C.noir});animation:swSkel 1.4s ease-in-out infinite}

/* ---------- STUDIYA: ZETME AI HAQIDA ---------- */
.about{background:linear-gradient(180deg,${C.vert} 0%,${C.noir} 100%);color:${C.ivoire};padding:30px 16px 84px;
  border-top:1px solid ${C.line}}
.ab-inner{max-width:1100px;margin:0 auto}
.ab-title{font-family:${FONT_DISPLAY};font-weight:500;font-size:clamp(24px,6.2vw,34px);text-align:center;margin:0 0 10px;
  animation:swFade .6s ease .06s both}
.ab-title em{font-style:italic;color:${C.goldText}}
.ab-lead{max-width:620px;margin:0 auto 22px;text-align:center;font-size:13.5px;line-height:1.7;color:${C.ivoireDim};
  animation:swFade .6s ease .12s both}
.ab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.ab-card{background:#ffffff08;border:1px solid ${C.line};border-radius:16px;padding:16px 15px;
  animation:swFade .65s cubic-bezier(.22,1,.36,1) both;transition:transform .3s,border-color .3s,background .3s}
.ab-card:hover{transform:translateY(-4px);border-color:${C.laitonLo};background:#ffffff0d}
.ab-ic{width:38px;height:38px;border-radius:12px;border:1px solid ${C.laitonLo}66;background:#0c261e;
  display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.ab-ct{font-size:14px;font-weight:600;margin-bottom:5px;color:${C.ivoire}}
.ab-cd{font-size:12.5px;line-height:1.6;color:${C.ivoireDim}}
.ab-stats{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px;
  animation:swFade .7s ease .5s both}
.ab-stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.ab-stat b{font-family:${FONT_DISPLAY};font-size:26px;font-weight:600;color:${C.goldText};line-height:1}
.ab-stat span{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:${C.ivoireDim}}
.ab-stat-sep{width:1px;height:28px;background:${C.line}}

@media (prefers-reduced-motion: reduce){
  .rv,.hero-glow,.petal,.htitle,.htitle em,.cta-shine,.sh-chev,.genslot-box,.genslot-empty svg,
  .lotus-g,.ripple,.drop,.fire,.mist,.water-glow{animation:none!important}
  .ripple,.drop{opacity:0}
  .rv,.htitle{opacity:1;transform:none;filter:none}
  .sw-tile,.ab-card,.sw-eyebrow,.sw-title,.sw-sub,.ab-title,.ab-lead,.ab-stats,.sw-glow{animation:none!important}
  .sw-tile:hover .sw-shine{animation:none}
  .sw-tile,.ab-card{opacity:1;transform:none}
}

/* ---------- MARKETPLACE ---------- */
.market{padding:20px 16px 10px;max-width:1100px;margin:0 auto}
.market-full{min-height:100dvh;padding-bottom:90px;background:${C.paper};animation:swFade .35s ease both}
.market-fullhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.market-back{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid ${C.mline};
  border-radius:20px;padding:7px 13px 7px 10px;font-size:12px;font-weight:600;color:${C.inkDim};
  cursor:pointer;font-family:${FONT_BODY}}
.market-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.market-title{font-family:${FONT_DISPLAY};font-size:24px;color:${C.ink};margin:0;font-weight:600}
.market-sub{font-size:12px;color:${C.inkDim}}
.market-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.market-optnote{font-size:11px;color:${C.laitonLo};font-weight:600}
.market-state{font-size:13px;color:${C.inkDim};background:${C.card};border:1px solid ${C.mline};border-radius:12px;padding:18px;text-align:center}
.market-state.err{color:${C.sale}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}

/* ---------- MARKET: do'konlar ro'yxati (1-qadam) ---------- */
.market-hint{font-size:12.5px;color:${C.inkDim};margin:0 0 14px}
.mshop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mshop-card{text-align:left;padding:0;background:${C.card};border:1px solid ${C.mline};border-radius:16px;overflow:hidden;
  cursor:pointer;font-family:inherit;animation:swFade .5s cubic-bezier(.22,1,.36,1) both;
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s}
.mshop-card:hover{transform:translateY(-4px);border-color:${C.laiton};box-shadow:0 12px 26px rgba(11,33,27,.12)}
.mshop-img{position:relative;aspect-ratio:1/1;background:linear-gradient(150deg,#eef1ec,#e2e8e1);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.mshop-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.mshop-card:hover .mshop-img img{transform:scale(1.07)}
.mshop-letter{font-family:${FONT_DISPLAY};font-size:42px;color:${C.laitonLo};opacity:.6}
.mshop-star{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:20px;background:${C.laiton};
  color:#0B211B;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mshop-body{padding:10px 12px 12px}
.mshop-name{font-weight:600;font-size:14px;color:${C.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mshop-count{display:flex;align-items:center;gap:2px;font-size:11.5px;color:${C.inkDim};margin-top:2px}

/* ---------- MARKET: do'kon ichi (2-qadam) ---------- */
.shopback{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid ${C.mline};
  color:${C.inkDim};border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:pointer;margin-bottom:12px}
.shopback:hover{border-color:${C.ink};color:${C.ink}}
.shophead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shophead-img{width:56px;height:56px;flex-shrink:0;border-radius:16px;overflow:hidden;border:1px solid ${C.mline};
  background:linear-gradient(150deg,#eef1ec,#e2e8e1);display:flex;align-items:center;justify-content:center}
.shophead-img img{width:100%;height:100%;object-fit:cover}
.shophead-name{font-family:${FONT_DISPLAY};font-size:23px;font-weight:600;color:${C.ink};margin:0;line-height:1.1}
.shophead-meta{font-size:12px;color:${C.inkDim};margin-top:2px}
.secchips{position:sticky;top:0;z-index:25;display:flex;gap:7px;overflow-x:auto;padding:10px 2px;margin:0 -2px 6px;
  background:linear-gradient(${C.paper} 88%,transparent);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.secchips::-webkit-scrollbar{display:none}
.secchip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;border:1px solid ${C.mline};background:${C.card};
  color:${C.ink};border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.secchip:hover{border-color:${C.laiton}}
.secchip span{font-size:10.5px;color:${C.laitonLo};font-weight:700}
.secblock{scroll-margin-top:52px}
.sec-title{display:flex;align-items:baseline;gap:7px;font-family:${FONT_DISPLAY};font-size:20px;font-weight:600;
  color:${C.ink};margin:18px 0 10px}
.sec-count{font-family:${FONT_BODY};font-size:11px;font-weight:600;color:${C.laitonLo}}
.pcard{background:${C.card};border:1px solid ${C.mline};border-radius:14px;padding:10px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;font-family:${FONT_BODY}}
.pcard-shop{display:inline-flex;align-items:center;gap:4px;background:transparent;border:none;padding:0;
  font-size:10.5px;font-weight:700;color:${C.laitonLo};cursor:pointer;font-family:${FONT_BODY};text-align:left}
.pcard-shop:hover{text-decoration:underline}
.pcard-img{background:${C.paper};border-radius:10px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pcard-name{font-size:12.5px;font-weight:600;color:${C.ink};line-height:1.3}
.pcard-meta{font-size:11px;color:${C.inkDim}}
.pcard-price{font-size:13.5px;font-weight:700;color:${C.price};margin-top:2px}

/* ---------- kategoriya chiplari + do'kon banneri ---------- */
.catchips{display:inline-flex;gap:6px}
.catchip{border:1px solid ${C.mline};background:${C.card};color:${C.inkDim};border-radius:20px;padding:6px 12px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:${FONT_BODY}}
.catchip.active{border-color:${C.ink};background:${C.ink};color:#fff}
.shopbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FCF3E2;
  border:1px solid #EFD9A8;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:${C.laitonLo}}
.shopbanner span{display:flex;align-items:center;gap:7px}
.shopbanner button{display:flex;align-items:center;gap:4px;background:transparent;border:1px solid ${C.laitonLo};
  color:${C.laitonLo};border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:${FONT_BODY}}

/* ---------- chakana/optom toggle ---------- */
.pmtoggle{display:inline-flex;background:${C.card};border:1px solid ${C.mline};border-radius:20px;padding:3px}
.pmtoggle-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;border-radius:16px;
  padding:6px 12px;font-size:12px;font-weight:600;color:${C.inkDim};cursor:pointer;font-family:${FONT_BODY}}
.pmtoggle-btn.active{background:${C.accent};color:#fff}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:${C.card};border-top:1px solid ${C.mline};
  display:flex;z-index:60;padding:6px 6px 8px;gap:3px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;
  color:${C.inkDim};font-size:10.5px;font-family:${FONT_BODY};cursor:pointer;position:relative;
  padding:6px 2px;border-radius:14px;transition:background-color .25s ease,color .25s ease}
.bn-item.active{color:${C.accent};font-weight:600;background:${C.accentSoft}}
.bn-badge{position:absolute;top:-4px;right:calc(50% - 18px);background:${C.sale};color:#fff;font-size:9px;
  border-radius:20px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ---------- overlay shared ---------- */
/* Oddiy modallar (mahsulot, checkout, muvaffaqiyat) hammasining USTIDA turadi —
   pastki navigatsiyani ham to'liq yopadi, xuddi avvalgidek. */
.ov{position:fixed;inset:0;background:#0006;z-index:70;display:flex;align-items:flex-end;justify-content:center}
/* to'liq fullscreen oynalar (Savat/Profil) — orqa fonda hech narsa ko'rinmaydi,
   lekin pastki navigatsiya ULARDAN USTIDA qoladi, shunda navActive orqali
   "qaysi oyna faol" ekanini bo'yab ko'rsatib, boshqa oynaga o'tish imkonini beradi */
.ov-full{background:${C.paper};align-items:stretch;justify-content:stretch;bottom:64px;z-index:40}
.pm-close{position:absolute;top:12px;right:12px;background:${C.paper};border:1px solid ${C.mline};border-radius:20px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}

/* product modal */
.pmodal{position:relative;background:${C.card};width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;animation:slideup .3s ease both}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.pm-hero{aspect-ratio:4/3;max-height:340px;width:100%;background:${C.paper};display:flex;align-items:center;justify-content:center;overflow:hidden}
.pm-hero-img{width:100%;height:100%;object-fit:contain}
.pm-thumbrow{display:flex;gap:8px;padding:10px 20px 0}
.pm-thumb{width:52px;height:52px;border-radius:10px;border:2px solid ${C.mline};background:${C.paper};padding:0;cursor:pointer;overflow:hidden}
.pm-thumb.active{border-color:${C.accent}}
.pm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pm-body{padding:18px 20px 24px}
.pm-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.pm-modebadge{font-size:10.5px;font-weight:700;color:${C.accent};text-transform:uppercase;letter-spacing:.04em}
.pm-shop{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:${C.laitonLo}}
.pm-title{font-family:${FONT_DISPLAY};font-size:22px;margin:2px 0 8px;color:${C.ink}}
.pm-price{font-size:20px;font-weight:700;color:${C.ink};margin-bottom:14px}
.pm-litrrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pm-litrchip{border:1.5px solid ${C.mline};background:${C.paper};color:${C.ink};border-radius:20px;padding:7px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:${FONT_BODY}}
.pm-litrchip.active{border-color:${C.accent};background:${C.accent};color:#fff}
.pm-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pm-specs div{background:${C.paper};border-radius:10px;padding:8px;text-align:center}
.pm-specs span{display:block;font-size:10px;color:${C.inkDim}}
.pm-specs b{font-size:12px;color:${C.ink}}
.pm-qty{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px}
.pm-qty button{width:34px;height:34px;border-radius:10px;border:1px solid ${C.mline};background:${C.paper};cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.pm-qty span{font-size:16px;font-weight:600;min-width:22px;text-align:center}
.pm-add{width:100%;background:${C.accent};color:#fff;border:none;border-radius:14px;padding:14px;font-weight:600;
  font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:${FONT_BODY}}
.pm-add:disabled{opacity:.5;cursor:not-allowed}
.pm-studio{width:100%;background:transparent;border:1px solid ${C.laitonLo};color:${C.laitonLo};border-radius:14px;
  padding:12px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;margin-top:8px;font-family:${FONT_BODY}}

/* cart */
.cart{position:relative;background:${C.card};width:100%;max-width:600px;margin:0 auto;border-radius:0;
  height:100%;max-height:100%;overflow-y:auto;padding:18px 18px 30px;animation:slideup .3s ease both}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cart-modebadge{font-size:11.5px;font-weight:600;color:${C.accent};background:#EAF3EC;border-radius:10px;
  padding:7px 10px;margin-bottom:8px;display:inline-block}
.cart-shopline{display:flex;align-items:center;gap:7px;font-size:12px;color:${C.laitonLo};background:#FCF3E2;
  border-radius:10px;padding:8px 10px;margin-bottom:14px}
.cart-shopline b{font-weight:700}

/* savat: har sotuvchi uchun alohida premium blok */
.cart-group{border:1px solid ${C.mline};border-radius:18px;padding:16px 15px 15px;margin-bottom:16px;
  background:linear-gradient(160deg,${C.paper},${C.card});animation:swFade .4s ease both}
.cart-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;
  padding-bottom:11px;border-bottom:1px solid ${C.mline}}
.cart-group-shop{display:flex;align-items:center;gap:6px;font-size:13.5px;color:${C.ink}}
.cart-group-count{font-size:11px;color:${C.inkDim};font-weight:600;background:${C.mline}55;border-radius:20px;padding:3px 9px}
.cart-group-btn{margin-top:4px}
.cart-grand{border:1.5px solid ${C.laiton}55;border-radius:18px;padding:16px 16px 15px;margin-top:6px;
  background:linear-gradient(160deg,${C.laiton}14,transparent)}
.cart-grand-title{font-family:${FONT_DISPLAY};font-size:15.5px;color:${C.ink};margin-bottom:10px}
.cart-grand-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.cart-grand-row{display:flex;justify-content:space-between;font-size:12.5px;color:${C.inkDim}}
.cart-grand-row b{color:${C.ink};font-weight:600}
.cart-grand-total{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed ${C.laiton}66;
  padding-top:11px;font-size:15px;font-weight:700;color:${C.ink}}
.cart-grand-total b{color:${C.laitonHi};font-size:18px}

/* do'kon to'qnashuvi ogohlantirishi */
.conflict{position:relative;background:${C.card};width:100%;max-width:440px;border-radius:20px 20px 0 0;
  padding:24px 20px 26px;animation:slideup .3s ease both;text-align:left}
.conflict-ic{width:46px;height:46px;border-radius:14px;background:#FCF3E2;display:flex;align-items:center;
  justify-content:center;margin-bottom:12px}
.conflict-clear{width:100%;background:transparent;border:1.5px solid ${C.laitonLo};color:${C.laitonLo};border-radius:14px;
  padding:12px;font-weight:600;font-size:13px;cursor:pointer;margin-top:8px;font-family:${FONT_BODY}}
.conflict-cancel{width:100%;background:transparent;border:none;color:${C.inkDim};padding:10px;font-size:12.5px;
  cursor:pointer;margin-top:4px;font-family:${FONT_BODY}}
.cart-empty{text-align:center;color:${C.inkDim};font-size:13.5px;padding:30px 10px}
.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.cart-row{display:flex;align-items:center;gap:10px}
.cart-emoji{width:44px;height:44px;background:${C.paper};border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.cart-emoji img{width:100%;height:100%;object-fit:cover}
.qty-mini{display:flex;align-items:center;gap:8px}
.qty-mini button{width:24px;height:24px;border-radius:7px;border:1px solid ${C.mline};background:${C.paper};cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.qty-mini span{font-size:13px;font-weight:600;min-width:16px;text-align:center}
.cart-teaser{background:#FBEFEA;color:${C.sale};font-size:12px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.cart-bonus{background:#FCF3E2;color:${C.laitonLo};font-size:12px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.cart-totals{border-top:1px dashed ${C.mline};padding-top:10px;margin-bottom:14px}
.cart-total{display:flex;justify-content:space-between;font-size:17px}
.cart-total b{color:${C.ink}}

/* ============ KUN/TUN gul tugmasi — gul ochiladi (kun), g'uncha yumiladi (tun) ============ */
.bloom-toggle{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid #C6A05B66;cursor:pointer;
  overflow:hidden;padding:0;background:transparent;flex:0 0 auto;transition:box-shadow .5s,transform .3s}
.bloom-toggle:active{transform:scale(.92)}
.bt-day{box-shadow:0 0 14px #E7D3A045}
.bt-night{box-shadow:0 0 14px #4A6E8A40}
.bt-sky{position:absolute;inset:0;border-radius:50%;transition:background .9s ease}
.bt-day .bt-sky{background:radial-gradient(circle at 50% 40%,#F7E7B8 0%,#E4C377 50%,#B98F44 100%)}
.bt-night .bt-sky{background:radial-gradient(circle at 64% 30%,#27455C 0%,#0E2233 55%,#081420 100%)}
.bt-flower{position:absolute;inset:4px;width:30px;height:30px}
.bt-rays{transform-origin:20px 20px}
.bt-day .bt-rays{animation:btSpin 16s linear infinite}
.bt-rays line{stroke:#8A5F1E;stroke-width:1.5;stroke-linecap:round;transition:opacity .5s}
.bt-night .bt-rays line{opacity:0}
.bt-petals{transform-origin:20px 20px;transition:transform .9s cubic-bezier(.68,-.15,.32,1.15),opacity .55s ease}
.bt-night .bt-petals{transform:scale(.12) rotate(80deg);opacity:0}
.bt-petal{fill:#E7A8BE;stroke:#C87897;stroke-width:.5}
.bt-core{fill:#F0D48A;stroke:#B98F44;stroke-width:.6;transform-origin:20px 20px;transition:transform .8s,fill .8s}
.bt-night .bt-core{fill:#3E5A4C;transform:scale(.7)}
.bt-moon{fill:#EAD9A8;opacity:0;transform:translate(5px,-4px) scale(.5) rotate(-30deg);transform-origin:20px 20px;
  transition:opacity .7s ease .15s,transform .9s cubic-bezier(.65,0,.35,1)}
.bt-night .bt-moon{opacity:1;transform:none}
.bt-star{fill:#EAD9A8;opacity:0;transition:opacity .6s}
.bt-night .bt-star{animation:btTwinkle 2.6s ease-in-out infinite}
.bt-night .bs1{opacity:.9}
.bt-night .bs2{opacity:.7;animation-delay:.9s}
.bt-night .bs3{opacity:.6;animation-delay:1.6s}
@keyframes btSpin{to{transform:rotate(360deg)}}
@keyframes btTwinkle{0%,100%{opacity:.25}50%{opacity:.95}}

/* ============ UZ/RU — oltin barg slayder + gulbarg portlashi ============ */
.lang-petal{position:relative;display:flex;align-items:center;width:76px;height:34px;border-radius:20px;
  border:1px solid #C6A05B80;background:#0B211B8C;backdrop-filter:blur(8px);cursor:pointer;padding:3px;flex:0 0 auto}
.lp-opt{flex:1;text-align:center;font-family:${FONT_BODY};font-size:11px;letter-spacing:.14em;font-weight:600;
  color:#F1ECDF59;transition:color .45s;position:relative;z-index:1}
.lp-opt.on{color:#0B211B}
.lp-knob{position:absolute;top:2px;left:3px;width:34px;height:28px;border-radius:15px;overflow:hidden;
  background:linear-gradient(135deg,#E7D3A0,#C6A05B);
  transition:transform .55s cubic-bezier(.65,0,.35,1);box-shadow:0 2px 10px #C6A05B73;z-index:0}
.lp-ru .lp-knob{transform:translateX(34px)}
.lp-leaf{position:absolute;top:-3px;left:7px;width:20px;height:34px;opacity:.26;fill:#0B211B;
  transition:transform .55s cubic-bezier(.65,0,.35,1)}
.lp-leaf .lp-vein{stroke:#0B211B;stroke-width:.7;fill:none;opacity:.55}
.lp-ru .lp-leaf{transform:rotate(180deg)}
.lp-burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:2}
.lp-burst i{position:absolute;left:-2.5px;top:-4px;width:5px;height:8px;background:#D98BA6;
  border-radius:60% 60% 60% 60% / 72% 72% 46% 46%;opacity:0;animation:lpBurst .75s ease-out forwards}
@keyframes lpBurst{
  0%{opacity:.95;transform:rotate(var(--a)) translateY(-4px) scale(.5)}
  100%{opacity:0;transform:rotate(var(--a)) translateY(-30px) scale(1.15)}
}

  text-overflow:ellipsis;white-space:nowrap}

.lb-list{display:flex;flex-direction:column;gap:7px}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;
  border:1px solid #C6A05B22;background:#FFFFFF06;animation:swFade .5s ease both}
.lb-rank{width:20px;flex-shrink:0;text-align:center;font-size:12px;font-weight:700;color:${C.ivoireDim};font-family:${FONT_DISPLAY}}
.lb-row-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#0B211B;border:1px solid #C6A05B40;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lb-row-avatar img{width:100%;height:100%;object-fit:cover}
.lb-row-mid{flex:1;min-width:0}
.lb-row-name{font-size:12.5px;font-weight:600;color:#F1ECDF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row-orders{font-size:10.5px;color:${C.ivoireDim}}
.lb-row-amt{font-size:12px;font-weight:700;color:${C.goldText};flex-shrink:0}

/* ============ Studiya: Ilhom galereyasi ============ */
.insp{background:linear-gradient(180deg,${C.vert} 0%,${C.noir} 60%);color:${C.ivoire};padding:28px 0 34px}
.insp-inner{max-width:860px;margin:0 auto;padding:0 16px}
.insp-sub{font-size:12px;color:${C.ivoireDim};text-align:center;margin:0 0 4px}
.insp-row{display:flex;gap:14px;overflow-x:auto;padding:18px 18px 10px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:flex-start}
.insp-row::-webkit-scrollbar{display:none}
.insp-card{position:relative;flex:0 0 200px;height:320px;margin:0;border-radius:18px;overflow:hidden;
  border:1px solid #C6A05B40;background:#000;scroll-snap-align:center;animation:swFade .7s ease both;
  box-shadow:0 14px 34px #00000066}
.insp-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.6,.2,1)}
.insp-card:hover img{transform:scale(1.07)}
.insp-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:4px;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:${C.goldText};background:#0B211BB3;border:1px solid #C6A05B59;
  border-radius:20px;padding:3px 8px;backdrop-filter:blur(6px)}
.insp-card figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font-size:11.5px;color:#F1ECDF;
  background:linear-gradient(180deg,transparent,#000000C7 68%)}
@media (min-width:720px){
  .insp-row{justify-content:center}
  .insp-card{flex:0 0 220px;height:352px}
}
@media (prefers-reduced-motion: reduce){
  .bt-day .bt-rays{animation:none}
  .bt-night .bt-star{animation:none}
  .lp-burst i{animation:none}
  .insp-card img{transition:none}
}
