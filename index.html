/* Galichka — Instagram uslubidagi "tasdiqlangan" nishonga o'xshash, o'yma
   (scallop) rozetka + o'rtasida check belgisi. Daraja ortgani sari rozetka
   uchlari, gauhar (gem) nuqtalari va nur (glow) kuchayib boradi. */
function BadgeIcon({ tier, size = 40 }) {
  const b = badgeAt(tier);
  const free = b.id === 0;
  const pts = free ? 0 : b.points;
  const scallops = Array.from({ length: pts }, (_, i) => (360 / pts) * i);
  const ringR = 6.3;
  const gemAngles = Array.from({ length: b.gems }, (_, i) => (360 / Math.max(1, b.gems)) * i - 90);
  return (
    <span className={"gali-ic" + (b.legendary ? " gali-legendary" : "")} style={{ width: size, height: size }}>
      {b.glow > 0 && (
        <span className="gali-glow" style={{
          background: `radial-gradient(circle, ${b.ring}${b.glow >= 4 ? "cc" : b.glow >= 2 ? "88" : "55"}, transparent 70%)`,
          filter: `blur(${2 + b.glow}px)`,
        }} />
      )}
      <svg viewBox="0 0 40 40" width={size} height={size} className="gali-svg">
        <defs>
          <linearGradient id={`gg${tier}`} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor={b.ring} />
            <stop offset="100%" stopColor={b.color} />
          </linearGradient>
        </defs>
        {!free && scallops.map((a, i) => {
          const rad = (a * Math.PI) / 180;
          return <circle key={i} cx={20 + ringR * Math.cos(rad)} cy={20 + ringR * Math.sin(rad)} r="9.4" fill={`url(#gg${tier})`} />;
        })}
        <circle cx="20" cy="20" r={free ? 13.5 : 11.5} fill={free ? "none" : `url(#gg${tier})`}
          stroke={free ? b.color : "none"} strokeWidth={free ? 1.6 : 0} opacity={free ? 0.55 : 1} />
        <path d="M13.5 20.3l3.8 3.8 8.2-9" fill="none" stroke={free ? b.color : "#fff"}
          strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" opacity={free ? 0.85 : 1} />
        {gemAngles.map((a, i) => {
          const rad = (a * Math.PI) / 180;
          const r = 15.4;
          return <circle key={i} cx={20 + r * Math.cos(rad)} cy={20 + r * Math.sin(rad)} r="1.5" fill={b.ring} />;
        })}
      </svg>
    </span>
  );
}

  return v.image ? [v.image] : [];
}
function thumbUrl(p) {
  return variantImg(p.variants && p.variants[0]) || "";
}

/* ============================== Small UI bits ============================== */
function SourceMenu({ accent, onPick }) {
  const opts = [
    { id: "catalog", icon: ImageIcon, t: tr("srcCatalog"), s: tr("srcCatalogS") },
    { id: "gallery", icon: Upload, t: tr("srcGallery"), s: tr("srcGalleryS") },
    { id: "camera", icon: Camera, t: tr("srcCamera"), s: tr("srcCameraS") },
  ];
  return (
    <div className="src-menu" onClick={(e) => e.stopPropagation()}>
      {opts.map((o) => {
        const Ic = o.icon;
        return (
          <button key={o.id} className="src-item" onClick={() => onPick(o.id)}>
            <span className="src-ic" style={{ borderColor: accent, color: accent }}><Ic size={16} /></span>
            <span>
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>{o.t}</div>
              <div style={{ fontSize: 11.5, color: C.ivoireDim }}>{o.s}</div>
            </span>
          </button>
        );
      })}
    </div>
  );
}

function ZetmeMark({ size = "sm" }) {
  const word = "zetme";
  const showWord = size === "lg";
  return (
    <div className={"zmark zmark-" + size} aria-label="Zetme">
      <span className="zmark-zwrap">
        <span className="zmark-glow zg1" aria-hidden="true" />
        {showWord && <span className="zmark-glow zg2" aria-hidden="true" />}
        <img className="zmark-z" src={Z_LOGO} alt="Z" draggable="false" />
      </span>
      {showWord && (
        <span className="zmark-word" aria-hidden="true">
          {word.split("").map((ch, i) => (
            <em key={i} style={{ animationDelay: `${i * 90}ms` }}>{ch}</em>
          ))}
        </span>
      )}
    </div>
  );
}

function GenSlot({ label, icon: Icon, accent, image, onSetImage }) {
  const [open, setOpen] = useState(false);
  const fileRef = React.useRef(null);
  const camRef = React.useRef(null);

  function handleFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    onSetImage(url);
    setOpen(false);
  }
  function pickSource(id) {
    if (id === "gallery") fileRef.current?.click();
    else if (id === "camera") camRef.current?.click();
    else { onSetImage("catalog"); setOpen(false); }
  }

  return (
    <div className="genslot" style={{ position: "relative" }}>
      <input ref={fileRef} type="file" accept="image/*" hidden onChange={handleFile} />
      <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={handleFile} />
      <div className="genslot-box" style={{ borderColor: image ? accent : C.line }}>
        {image ? (
          image === "catalog"

  const displayColor = v.color || p.color;
  const unitPrice = priceOf(v, priceMode);
  const imgs = variantImgs(v);
  const heroImg = imgs[imgIdx] || imgs[0] || "";

  return (
    <div className="ov" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="pmodal">
        <button className="pm-close" onClick={onClose}><X size={18} /></button>

          {heroImg ? <img src={heroImg} alt={displayName} className="pm-hero-img" /> : <span style={{ fontSize: 54 }}>🪴</span>}
        </div>
        {imgs.length > 1 && (
          <div className="pm-thumbrow">
            {imgs.map((u, i) => (
              <button key={i} type="button" className={"pm-thumb" + (u === heroImg ? " active" : "")} onClick={() => setImgIdx(i)}>
                <img src={u} alt="" />
              </button>
            ))}
          </div>
        )}
        <div className="pm-body">
          <div className="pm-toprow">
            <span className="pm-modebadge">{priceMode === "optom" ? tr("pmOptom") : tr("pmChakana")}</span>
            <span className="pm-shop"><Store size={11} /> {p.shopName || "Tuvaklar"}</span>
          </div>
          <h3 className="pm-title">{displayName}</h3>
          <div className="pm-price">{fmt(unitPrice)}</div>

          {variants.length > 1 && (
            <div className="pm-litrrow">
              {variants.map((vv, i) => (
                <button key={vv.id || i} className={"pm-litrchip" + (i === vi ? " active" : "")} onClick={() => pickVariant(i)}>
                  {vv.litr} {unitOf(p.unit).short}

              ))}
            </div>

          <div className="pm-specs">

            <div><span>{tr("pmSize")}</span><b>{v.size || "—"}</b></div>
            <div><span>{tr("pmColor")}</span><b>{displayColor || "—"}</b></div>
          </div>
          <div className="pm-qty">
            <button onClick={() => setQty((q) => Math.max(1, q - 1))}><Minus size={15} /></button>
            <span>{qty}</span>
            <button onClick={() => setQty((q) => q + 1)}><Plus size={15} /></button>
          </div>
          <button className="pm-add" onClick={() => { onAdd(p, v, qty); onClose(); }}>
            <ShoppingBag size={16} /> {tr("addCart")}{fmt(unitPrice * qty)}
          </button>
          {AI_STUDIO_ENABLED && (
            <button className="pm-studio" onClick={() => { onSendToStudio(p, v); onClose(); }}>
              <Sparkles size={15} /> {p.category === "gul" ? tr("pmStudioGul") : tr("pmStudioTuvak")}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* Bitta sotuvchining savat bloki: ro'yxat, bonus, jami va o'z buyurtma tugmasi */
function CartShopGroup({ group, priceMode, onQty, onCheckout, index }) {
  const { sellerId, shopName, items, total, bonus, payTotal, qty } = group;
  const minRequired = priceMode === "optom" ? OPT_MIN_ORDER : MIN_ORDER;
  const remaining = minRequired - total;
  const meetsMin = total >= minRequired;
  const showTeaser = group.bonusEnabled && total >= TEASER_MIN && total < TEASER_MAX;

  return (
    <div className="cart-group" style={{ animationDelay: `${index * 70}ms` }}>
      <div className="cart-group-head">
        <div className="cart-group-shop"><Store size={13} color={C.laitonLo} /> <b>{shopName}</b></div>
        <span className="cart-group-count">{tr("cartGroupN", qty)}</span>
      </div>

      <div className="cart-list">
        {items.map((it) => (
          <div key={it.key} className="cart-row">
            <div className="cart-emoji">{it.image ? <img src={it.image} alt="" /> : "🪴"}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>{it.name}</div>
              <div style={{ fontSize: 12, color: C.inkDim }}>{it.litr} {unitOf(it.unit).short} · {fmt(priceOf(it, priceMode))}</div>
            </div>
            <div className="qty-mini">
              <button onClick={() => onQty(it.key, -1)}><Minus size={13} /></button>
              <span>{it.qty}</span>
              <button onClick={() => onQty(it.key, 1)}><Plus size={13} /></button>
            </div>
          </div>
        ))}
      </div>

      {showTeaser && (
        <div className="cart-teaser">{tr("teaser", fmt(TEASER_MAX))}</div>
      )}
      {bonus && bonus.gift && (
        <div className="cart-bonus">{tr("bonusGift")}</div>
      )}
      {bonus && bonus.money > 0 && (
        <div className="cart-bonus">
          💰 Bonus: −{fmt(bonus.money)}{bonus.tokin ? ` + ${bonus.tokin} tokin` : ""} — avtomatik ayirildi
        </div>
      )}

      <div className="cart-totals">
        <div className="cart-total"><span>{tr("total")}</span><b>{fmt(total)}</b></div>
        {payTotal !== total && (
          <div className="cart-paytotal"><span>{tr("payTotal")}</span><b>{fmt(payTotal)}</b></div>
        )}
      </div>

      {!meetsMin ? (
        <div className="cart-minwarn">
          <Lock size={14} />
          <div>
            <div style={{ fontWeight: 600 }}>
              {priceMode === "optom" ? tr("minOptom") : tr("minOrder")} — {fmt(minRequired)}
            </div>
            <div style={{ fontSize: 11.5, marginTop: 2 }}>
              {tr("addMore", fmt(remaining))}
              {priceMode === "optom" && tr("orChakana")}
            </div>
          </div>
        </div>
      ) : (
        <button className="pm-add cart-group-btn" onClick={() => onCheckout(sellerId)}>
          <Send size={15} /> {tr("placeOrder")} — {shopName}
        </button>
      )}
    </div>
  );
}

/* ============================== Profile screen ============================== */
function ProfileScreen({ onClose, profile, badgeTier, generations, onSelectBadge,
  cust, orders, linked, vouchers, onLink, onRegister, onSaveName, onPhoto, onCancelOrder, onReceiveOrder, onPaidOrder }) {
  const [cancelingId, setCancelingId] = useState(null); // "tasdiqlaysizmi?" bosqichi
  const [cancelBusy, setCancelBusy] = useState(false);
  const [cancelErr, setCancelErr] = useState("");
  const [payFormId, setPayFormId] = useState(null);     // "To'lov qildim" izoh formasi
  const [payNote, setPayNote] = useState("");
  const [actBusy, setActBusy] = useState(false);
  async function doCancelOrder(id) {
    setCancelBusy(true); setCancelErr("");
    const err = await onCancelOrder(id);
    setCancelBusy(false);
    setCancelingId(null);
    if (err) setCancelErr(err);
  }
  async function doReceive(id) {
    setActBusy(true); setCancelErr("");
    const err = await onReceiveOrder(id);
    setActBusy(false);
    if (err) setCancelErr(err);
  }
  async function doPaid(id) {
    setActBusy(true); setCancelErr("");
    const err = await onPaidOrder(id, payNote.trim());
    setActBusy(false);
    if (err) setCancelErr(err);
    else { setPayFormId(null); setPayNote(""); }
  }
  const tier = badgeAt(badgeTier);
  const photoRef = React.useRef(null);

  const [code, setCode] = useState("");
  const [linkBusy, setLinkBusy] = useState(false);
  const [linkErr, setLinkErr] = useState("");
  const [regName, setRegName] = useState("");
  const [regContact, setRegContact] = useState("");
  const [regBusy, setRegBusy] = useState(false);
  const [regErr, setRegErr] = useState("");
  const [editName, setEditName] = useState(false);
  const [fn, setFn] = useState("");
  const [ln, setLn] = useState("");
  const [nameBusy, setNameBusy] = useState(false);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [photoErr, setPhotoErr] = useState("");

  const displayName = cust && (cust.firstName || cust.lastName)
    ? `${cust.firstName || ""} ${cust.lastName || ""}`.trim()
    : (cust && cust.name) || profile.name || tr("guest");
  const displayPhone = (cust && cust.phone) || profile.phone || "";

  async function doLink() {
    setLinkBusy(true); setLinkErr("");
    const err = await onLink(code.trim());
    setLinkBusy(false);
    if (err) setLinkErr(err); else setCode("");
  }
  async function doRegister() {
    setRegBusy(true); setRegErr("");
    const err = await onRegister(regName.trim(), regContact.trim());
    setRegBusy(false);
    if (err) setRegErr(err); else { setRegName(""); setRegContact(""); }
  }
  async function doSaveName() {
    setNameBusy(true);
    const err = await onSaveName(fn.trim(), ln.trim());
    setNameBusy(false);
    if (!err) setEditName(false);
  }
  async function onPhotoFile(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setPhotoBusy(true); setPhotoErr("");
    const err = await onPhoto(f);
    setPhotoBusy(false);
    if (err) setPhotoErr(err);
  }
  const dateOf = (ts) => {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, "0");
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  return (
    <div className="ov ov-full">
      <div className="profile">
        <button className="pm-close" onClick={onClose}><X size={18} /></button>
        <input ref={photoRef} type="file" accept="image/*" hidden onChange={onPhotoFile} />

        <div className="prof-head">
          <div className="prof-avatar" style={{ borderColor: tier.ring, cursor: linked ? "pointer" : "default" }}
            onClick={() => linked && photoRef.current && photoRef.current.click()}
            title={linked ? "Profil rasmini o'zgartirish" : ""}>
            {cust && cust.photo
              ? <img src={cust.photo} alt="" className="prof-photo" />
              : <User size={26} color={tier.color} />}
            {linked
              ? <span className="prof-cam"><Camera size={11} color="#fff" /></span>
              : <span className="prof-badge" style={{ background: tier.color }}><BadgeCheck size={13} color="#fff" /></span>}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            {!editName ? (
              <div className="prof-name">
                {displayName}
                {linked && (
                  <button className="prof-editbtn" onClick={() => {
                    setFn((cust && cust.firstName) || ""); setLn((cust && cust.lastName) || ""); setEditName(true);
                  }}>{tr("edit")}</button>
                )}
              </div>
            ) : (
              <div className="prof-nameedit">
                <input value={fn} placeholder={tr("fName")} onChange={(e) => setFn(e.target.value)} />
                <input value={ln} placeholder={tr("lName")} onChange={(e) => setLn(e.target.value)} />
                <button onClick={doSaveName} disabled={nameBusy}>{nameBusy ? "…" : tr("save")}</button>
              </div>
            )}
            <div className="prof-tier" style={{ color: tier.color }}>{tier.label}</div>
            <div className="prof-phone">
              {displayPhone
                ? <>{displayPhone}{linked ? tr("tgLinked") : ""}</>
                : tr("noPhone")}
            </div>
            {photoBusy && <div className="prof-phone">{tr("photoLoading")}</div>}
            {photoErr && <div className="prof-err">{photoErr}</div>}
          </div>
        </div>

        {/* ---------- Buyurtmalarim ---------- */}
        <div className="prof-histhead">
          <ShoppingBag size={14} color={C.inkDim} />
          <span>{tr("myOrders")}</span>
          {linked && orders.length > 0 && <em className="prof-ordcount">{tr("nPcs", orders.length)}</em>}
        </div>

        {!linked ? (
          <div className="prof-linkcard">
            <p>{tr("linkIntro")}</p>
            <div className="tg-step"><span>1</span><div><b>@zetmeai_bot</b> {tr("linkStep1a")} <b>/kod</b> {tr("linkStep1b")}</div></div>
            <div className="tg-step"><span>2</span><div>{tr("linkStep2")}</div></div>
            <div className="prof-linkrow">
              <input value={code} inputMode="numeric" maxLength={6} placeholder="123456"
                onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} />
              <button disabled={linkBusy || code.length !== 6} onClick={doLink}>{linkBusy ? "…" : tr("link")}</button>
            </div>
            {linkErr && <div className="prof-err">{linkErr}</div>}
            <a className="prof-botlink" href={`https://t.me/${BOT_USERNAME}`} target="_blank" rel="noreferrer">
              <Send size={13} /> {tr("openBot")}
            </a>

            <div className="prof-reg-divider"><span>{tr("regOr")}</span></div>
            <div className="prof-regcard">
              <p>{tr("regTitle")}</p>
              <div className="prof-reg-row">
                <input value={regName} placeholder={tr("regName")} onChange={(e) => setRegName(e.target.value)} />
              </div>
              <div className="prof-reg-row">
                <input value={regContact} placeholder={tr("regContact")} onChange={(e) => setRegContact(e.target.value)} />
                <button disabled={regBusy || regName.trim().length < 2 || regContact.trim().length < 5} onClick={doRegister}>
                  {regBusy ? "…" : tr("regBtn")}
                </button>
              </div>
              <div className="prof-reg-hint">{tr("regHint")}</div>
              {regErr && <div className="prof-err">{regErr}</div>}
            </div>
          </div>
        ) : (
          <>
            {vouchers && vouchers.length > 0 && (
              <div className="prof-vouchers">

              <div className="prof-empty">{tr("noOrders")}</div>

              <div className="prof-orders">
                {orders.map((o, i) => (
                  <div key={i} className="prof-order">

                    <div className="prof-order-total">
                      {fmt(o.payTotal || o.total || 0)}

                    )}

                    {/* Buyurtma yuborilgan — mijoz qabul qilganda bosadi */}
                    {(o.status === "yuborildi") && o.id && o.sellerId && (
                      <button className="po-receivebtn" disabled={actBusy} onClick={() => doReceive(o.id)}>
                        {tr("received")}
                      </button>
                    )}

                    {/* To'lov chizig'i: sotuvchi bilan kelishib to'laysiz, keyin belgilaysiz */}
                    {(o.status || "yangi") !== "bekor" && o.id && o.sellerId && (
                      o.paymentStatus === "tolangan" ? (
                        <div className="po-payrow po-pay-done">{tr("payDone")}</div>
                      ) : o.paymentStatus === "mijoz_toladi" ? (
                        <div className="po-payrow po-pay-wait">
                          {tr("payWait1")}{o.paymentNote ? ` (${o.paymentNote})` : ""}{tr("payWait2")}
                        </div>
                      ) : (
                        <div className="po-payrow po-pay-none">
                          {tr("payAgree")}
                          {o.shopPhone && <a className="po-shoptel" href={"tel:" + o.shopPhone}>📞 {o.shopPhone}</a>}
                          <div style={{ marginTop: 7 }}>
                            {payFormId === o.id ? (
                              <div className="po-payform">
                                <input value={payNote} placeholder={tr("payPh")}
                                  onChange={(e) => setPayNote(e.target.value)} />
                                <button disabled={actBusy} onClick={() => doPaid(o.id)}>{actBusy ? "…" : tr("send")}</button>
                              </div>
                            ) : (
                              <button className="po-paybtn" onClick={() => { setPayFormId(o.id); setPayNote(""); }}>{tr("paidBtn")}</button>
                            )}
                          </div>
                        </div>
                      )
                    )}
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        <div className="prof-histhead">
          <BadgeCheck size={14} color={C.inkDim} />
          <span>{tr("badgesT")}</span>
        </div>
        <div className="gali-grid">
          {BADGES.map((b) => {
            const active = badgeTier === b.id;
            return (
              <button key={b.id} className={"gali-card" + (active ? " gali-active" : "")} onClick={() => onSelectBadge(b.id)}>
                {active && <span className="gali-check"><Check size={11} color="#fff" /></span>}
                <BadgeIcon tier={b.id} size={46} />
                <div className="gali-name">{b.label}</div>
                <div className="gali-price">{b.price === 0 ? tr("galiFree") : tr("galiMonth", fmt(b.price))}</div>
                <div className="gali-sel">{active ? tr("galiCurrent") : tr("galiSelect")}</div>
              </button>
            );
          })}
        </div>

        {AI_STUDIO_ENABLED && (
          <>
            <div className="prof-histhead">
              <Clock size={14} color={C.inkDim} />
              <span>{tr("genHistory")}</span>
            </div>
            {generations.length === 0 ? (
              <div className="prof-empty">{tr("genEmpty")}</div>
            ) : (
              <div className="prof-grid">
                {generations.map((g, i) => (
                  <div key={i} className="prof-gitem">
                    {g.thumb ? <img src={g.thumb} alt="" /> : <Sparkles size={20} color={C.laitonLo} />}
                    <span>{g.date}</span>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ============================== Mijozlar sotuv reytingi (liderlar taxtasi) ==============================
   Barcha do'konlar bo'yicha eng ko'p xarid qilgan mijozlar — davr (kunlik...yillik) va
   narx turi (chakana/optom) bo'yicha alohida filtrlanadi. Ma'lumot api/leaderboard.js dan. */
const LB_PERIODS = [
  { id: "daily", key: "lbDaily" }, { id: "weekly", key: "lbWeekly" }, { id: "monthly", key: "lbMonthly" },
  { id: "quarterly", key: "lbQuarterly" }, { id: "halfyear", key: "lbHalfyear" }, { id: "yearly", key: "lbYearly" },
];
const LB_MEDALS = ["🥇", "🥈", "🥉"];

function Leaderboard() {
  const [period, setPeriod] = useState("weekly");
  const [periodOpen, setPeriodOpen] = useState(false);
  const [priceMode, setPriceMode] = useState("chakana");
  const [ranking, setRanking] = useState(null); // null = yuklanmoqda
  const [err, setErr] = useState(null);

  useEffect(() => {
    let alive = true;
    setRanking(null); setErr(null);
    fetch(`${API_BASE}/api/leaderboard`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ period, priceMode }),
    })
      .then((r) => r.json())
      .then((d) => {
        if (!alive) return;
        if (d.ok) setRanking(d.ranking || []); else setErr(d.error || "Xatolik");
      })
      .catch(() => { if (alive) setErr("Xatolik"); });
    return () => { alive = false; };
  }, [period, priceMode]);

  const top3 = (ranking || []).slice(0, 3);
  const rest = (ranking || []).slice(3, 10);

  return (
    <section className="lb">
      <div className="lb-inner">
        <p className="sw-eyebrow">{tr("lbEyebrow")}</p>
        <h2 className="ab-title"><Trophy size={20} color={C.laiton} /> {tr("lbTitle")}</h2>
        <p className="hiw-lead">{tr("lbSub")}</p>

        <div className="lb-filters">
          <div className="lb-toggle">
            <button className={"lb-toggle-btn" + (priceMode === "chakana" ? " active" : "")} onClick={() => setPriceMode("chakana")}>{tr("lbRetail")}</button>
            <button className={"lb-toggle-btn" + (priceMode === "optom" ? " active" : "")} onClick={() => setPriceMode("optom")}>{tr("lbWholesale")}</button>
          </div>
          <div className="lb-perioddd">
            <button className={"lb-dd-btn" + (periodOpen ? " open" : "")} onClick={() => setPeriodOpen((v) => !v)}>
              <span>{tr((LB_PERIODS.find((p) => p.id === period) || LB_PERIODS[1]).key)}</span>
              <ChevronDown size={14} />
            </button>
            {periodOpen && (
              <>
                <button className="lb-dd-veil" aria-hidden="true" onClick={() => setPeriodOpen(false)} />
                <div className="lb-dd-list">
                  {LB_PERIODS.map((p) => (
                    <button key={p.id} className={"lb-dd-opt" + (period === p.id ? " active" : "")}
                      onClick={() => { setPeriod(p.id); setPeriodOpen(false); }}>
                      {tr(p.key)}
                      {period === p.id && <Check size={13} />}
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>

        {ranking === null && !err && <div className="lb-state">{tr("lbLoading")}</div>}
        {err && <div className="lb-state">{err}</div>}
        {ranking && ranking.length === 0 && <div className="lb-state">{tr("lbEmpty")}</div>}

        {ranking && ranking.length > 0 && (
          <>
            <div className="lb-podium">
              {[1, 0, 2].map((i) => {
                const r = top3[i];
                if (!r) return <div key={i} className={"lb-podium-item lb-p" + (i + 1) + " lb-podium-empty"} />;
                return (
                  <div key={r.chatId} className={"lb-podium-item lb-p" + (i + 1)}>
                    <div className="lb-medal">{LB_MEDALS[i]}</div>
                    <div className="lb-avatar">
                      {r.photo ? <img src={r.photo} alt="" /> : <User size={i === 0 ? 24 : 18} color={C.laitonLo} />}
                    </div>
                    <div className="lb-name">{r.name}</div>
                    <div className="lb-amt">{fmt(r.total)}</div>
                  </div>
                );
              })}
            </div>

            {rest.length > 0 && (
              <div className="lb-list">
                {rest.map((r) => (
                  <div key={r.chatId} className="lb-row">
                    <span className="lb-rank">{r.rank}</span>
                    <div className="lb-row-avatar">
                      {r.photo ? <img src={r.photo} alt="" /> : <User size={15} color={C.laitonLo} />}
                    </div>
                    <div className="lb-row-mid">
                      <div className="lb-row-name">{r.name}</div>
                      <div className="lb-row-orders">{tr("lbOrdersN", r.orders)}</div>
                    </div>
                    <div className="lb-row-amt">{fmt(r.total)}</div>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </div>
    </section>
  );
}

/* ============================== App ============================== */
function App() {

  /* Hero video: ba'zi mobil brauzerlar (Telegram ichki brauzeri, iOS Low Power)
     autoplay'ni bloklaydi — birinchi teginish/scrollda videoni qayta ishga tushiramiz */
  useEffect(() => {
    const kick = () => {
      const v = document.querySelector(".hero-video");
      if (v && v.paused) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    };
    kick();
    const evs = ["touchstart", "click", "scroll"];
    evs.forEach((e) => window.addEventListener(e, kick, { once: true, passive: true }));
    document.addEventListener("visibilitychange", kick);
    return () => {
      evs.forEach((e) => window.removeEventListener(e, kick));
      document.removeEventListener("visibilitychange", kick);
    };
  }, []);
  const [genLoading, setGenLoading] = useState(false);
  const [genDone, setGenDone] = useState(false);

  const [products, setProducts] = useState([]);
  const [productsLoading, setProductsLoading] = useState(true);
  const [productsError, setProductsError] = useState(null);
  const [shops, setShops] = useState([]);              // studiyadagi do'konlar devori
  const [shopsLoading, setShopsLoading] = useState(true);
  const [priceMode, setPriceMode] = useState("chakana"); // "chakana" | "optom"
  const [shopFilter, setShopFilter] = useState(null);    // null | { id, name } — do'kon sahifasi

  // FULLSCREEN OYNALAR: Studiya/Mahsulotlar — asosiy "sahifa" almashinuvi (bittasi to'liq
  // ko'rinadi, ikkinchisi butunlay yashiriladi — orqa fonda hech narsa qolmaydi).
  // Savat/Profil esa modallar (pastda), lekin ular ham endi to'liq fullscreen bo'ladi.
  const [mainTab, setMainTab] = useState("studio"); // "studio" | "products"

  const [activeProduct, setActiveProduct] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);

  const [checking, setChecking] = useState(false);

  const [order, setOrder] = useState(null); // { orderId, payTotal, shopName, voucherDiscount, voucherPercent }
  const [checkoutFormOpen, setCheckoutFormOpen] = useState(false);
  const [checkoutSellerId, setCheckoutSellerId] = useState(null); // qaysi do'kon uchun buyurtma formasi ochilgan

  const [profileOpen, setProfileOpen] = useState(false);
  const [profile, setProfile] = useState({ name: "", phone: "" });
  // Telegram bilan ulangan mijoz hisobi (bot /kod orqali)
  const [custAuth, setCustAuth] = useState(null);       // { chatId, token }
  const [custProfile, setCustProfile] = useState(null); // { firstName, lastName, phone, photo, ... }
  const [custOrders, setCustOrders] = useState([]);
  const [custVouchers, setCustVouchers] = useState([]); // bekor kompensatsiyasi bonuslari

  // Savat/Profil (fullscreen oynalar) ochiq paytda orqadagi sahifa aylanmasin
  useEffect(() => {

    return () => { document.body.style.overflow = ""; };
  }, [cartOpen, profileOpen]);

  // load persisted account state once (real localStorage — works on the live site)
  useEffect(() => {
    const c = storageGet("zetme_customer", null);
    if (c) { try { setProfile(JSON.parse(c)); } catch (e) {} }
    const t = storageGet("zetme_tokens", null);

    else { const b = storageGet("zetme_badge", null); if (b === "1") setBadgeTier(1); } // eski format bilan moslik
    const g = storageGet("zetme_generations", null);
    if (g) { try { setGenerations(JSON.parse(g)); } catch (e) {} }
    const ca = storageGet("zetme_cust_auth", null);
    if (ca) { try { setCustAuth(JSON.parse(ca)); } catch (e) {} }
  }, []);

  /* ---------------- mijoz profili (Telegram bilan ulangan) ---------------- */
  async function customerApi(payload) {
    const r = await fetch(`${API_BASE}/api/customer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    return r.json();
  }

  // ulangan bo'lsa — profil va buyurtmalarni yangilab turamiz
  useEffect(() => {
    if (!custAuth) return;
    customerApi({ action: "me", chatId: custAuth.chatId, token: custAuth.token })
      .then((d) => {
        if (d.ok) { setCustProfile(d.profile); setCustOrders(d.orders || []); setCustVouchers(d.vouchers || []); }
        else { setCustAuth(null); setCustProfile(null); setCustOrders([]); setCustVouchers([]); storageSet("zetme_cust_auth", ""); }
      })
      .catch(() => {});
  }, [custAuth && custAuth.chatId]);

  async function linkCustomer(code) {
    // saytdagi "web" hisob bo'lsa, tarixi Telegram hisobiga ko'chiriladi
    const extra = custAuth && String(custAuth.chatId).startsWith("w")
      ? { oldChatId: custAuth.chatId, oldToken: custAuth.token } : {};
    const d = await customerApi({ action: "link", code, ...extra });
    if (!d.ok) return d.error || "Xatolik";
    const auth = { chatId: d.chatId, token: d.token };
    setCustAuth(auth);
    setCustProfile(d.profile);
    setCustOrders(d.orders || []);
    setCustVouchers(d.vouchers || []);
    storageSet("zetme_cust_auth", JSON.stringify(auth));
    return null;
  }

  // Telefon yoki gmail bilan ro'yxatdan o'tish (Telegram shart emas) — chindan
  // tasdiqlanmagan "eslab qolish" hisobi, checkout paytida ochiladigan "web"
  // hisobning aynan o'zi (api/customer.js "register" amali).
  async function registerCustomer(name, contact) {
    const isEmail = contact.includes("@");
    const payload = { action: "register", name };
    if (isEmail) payload.email = contact; else payload.phone = contact;
    const d = await customerApi(payload);
    if (!d.ok) return d.error || "Xatolik";
    const auth = { chatId: d.chatId, token: d.token };
    setCustAuth(auth);
    setCustProfile(d.profile);
    setCustOrders(d.orders || []);
    setCustVouchers(d.vouchers || []);
    storageSet("zetme_cust_auth", JSON.stringify(auth));
    return null;
  }

  // Holat o'zgarishlarini kuzatish: har 60 soniyada yangilanadi,
  // yangilik bo'lsa pastki "Profil" tugmasida qizil nuqta chiqadi
  useEffect(() => {
    if (!custAuth) return;
    const t = setInterval(() => {
      customerApi({ action: "me", chatId: custAuth.chatId, token: custAuth.token })
        .then((d) => { if (d.ok) { setCustOrders(d.orders || []); setCustVouchers(d.vouchers || []); } })
        .catch(() => {});
    }, 60000);
    return () => clearInterval(t);
  }, [custAuth && custAuth.chatId]);

  // Profil ochilganda holatni darhol yangilaymiz
  useEffect(() => {
    if (!profileOpen || !custAuth) return;
    customerApi({ action: "me", chatId: custAuth.chatId, token: custAuth.token })
      .then((d) => { if (d.ok) { setCustProfile(d.profile); setCustOrders(d.orders || []); setCustVouchers(d.vouchers || []); } })
      .catch(() => {});
  }, [profileOpen]);

  const seenTs = Number(storageGet("zetme_seen_ts", "0")) || 0;
  const hasNews = custOrders.some((o) => Math.max(o.statusTs || 0, o.paymentConfirmTs || 0) > seenTs);
  useEffect(() => {
    if (profileOpen) storageSet("zetme_seen_ts", String(Date.now()));
  }, [profileOpen, custOrders.length]);

  async function receiveCustOrder(id) {
    if (!custAuth) return "Hisob topilmadi";
    const d = await customerApi({ action: "receiveOrder", ...custAuth, id });
    if (!d.ok) return d.error || "Xatolik";
    setCustOrders(d.orders || []);
    return null;
  }
  async function paidCustOrder(id, note) {
    if (!custAuth) return "Hisob topilmadi";
    const d = await customerApi({ action: "paidOrder", ...custAuth, id, note });
    if (!d.ok) return d.error || "Xatolik";
    setCustOrders(d.orders || []);
    return null;
  }

  // Mijoz buyurtmani bekor qiladi — faqat status "yangi" bo'lganda (server tekshiradi)
  async function cancelCustOrder(id) {
    if (!custAuth) return "Avval Telegram bilan ulang";
    const d = await customerApi({ action: "cancelOrder", ...custAuth, id });
    if (!d.ok) return d.error || "Xatolik";
    setCustOrders(d.orders || []);
    return null;
  }

  async function saveCustName(firstName, lastName) {
    if (!custAuth) return "Avval Telegram bilan ulang";
    const d = await customerApi({ action: "updateProfile", ...custAuth, firstName, lastName });
    if (!d.ok) return d.error || "Xatolik";
    setCustProfile(d.profile);
    return null;
  }

  // rasmni brauzerda kichraytirib (400px, JPEG) serverga yuboramiz
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const S = 400;
        const k = Math.min(1, S / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * k);
        canvas.height = Math.round(img.height * k);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
      };
      img.onerror = () => reject(new Error("Rasmni o'qib bo'lmadi"));
      img.src = URL.createObjectURL(file);
    });
  }

  async function setCustPhoto(file) {
    if (!custAuth) return "Avval Telegram bilan ulang";
    try {
      const dataBase64 = await compressPhoto(file);
      const d = await customerApi({ action: "setPhoto", ...custAuth, dataBase64, contentType: "image/jpeg" });
      if (!d.ok) return d.error || "Xatolik";
      setCustProfile((p) => ({ ...(p || {}), photo: d.photo }));
      return null;
    } catch (e) { return e.message; }
  }

  // load real product catalog — MARKETPLACE: endi barcha kategoriya (tuvak + gul),
  // har mahsulotda sellerId + shopName + bonusEnabled keladi (api/products.js GET)
  useEffect(() => {
    fetch(`${API_BASE}/api/products`)
      .then((r) => r.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || "Mahsulotlarni yuklab bo'lmadi");
        const list = (data.products || []).filter((p) => Array.isArray(p.variants) && p.variants.length > 0);
        setProducts(list);
      })
      .catch((err) => setProductsError(err.message))
      .finally(() => setProductsLoading(false));
  }, []);

  // faol do'konlar ro'yxati (studiyadagi "Do'konlar" devori uchun)
  // api/sellers.js GET -> { ok, sellers:[{ id, shopName, shopLogo, bonusEnabled }] }
  useEffect(() => {
    fetch(`${API_BASE}/api/sellers`)
      .then((r) => r.json())
      .then((data) => { if (data.ok) setShops(data.sellers || []); })
      .catch(() => {})
      .finally(() => setShopsLoading(false));
  }, []);

  // Har do'kon uchun: rasm (sotuvchi yuklagan logotip, bo'lmasa birinchi mahsulot rasmi)
  // + mahsulotlar soni. Mahsuloti yo'q do'konlar ko'rsatilmaydi (bo'sh do'kon sahifasi ochilmasin).
  const shopWall = useMemo(() => {
    const count = {}, firstImg = {};
    products.forEach((p) => {
      const sid = p.sellerId || "zetme";
      count[sid] = (count[sid] || 0) + 1;
      if (!firstImg[sid]) {
        const im = thumbUrl(p);
        if (im) firstImg[sid] = im;
      }
    });
    return shops
      .map((s) => ({
        id: s.id,
        name: s.shopName || "Do'kon",
        img: s.shopLogo || firstImg[s.id] || "",
        count: count[s.id] || 0,
        bonus: !!s.bonusEnabled,
      }))
      .filter((s) => s.count > 0)
      .sort((a, b) => b.count - a.count);
  }, [shops, products]);

  // STUDIYA devori uchun: MAHSULOTGA OID HECH NARSA KO'RSATILMAYDI —
  // faqat sotuvchi o'zi yuklagan do'kon rasmi (bo'lmasa nomining bosh harfi) va nomi.
  const studioShops = useMemo(() => shops.map((s) => ({
    id: s.id,
    name: s.shopName || "Do'kon",
    img: s.shopLogo || "",
    bonus: !!s.bonusEnabled,
  })), [shops]);

  function openShopById(s) {
    setShopFilter({ id: s.id, name: s.name });
    setActiveProduct(null);
    // Studiya oynasidan (do'konlar devori) bosilgan bo'lsa — Mahsulotlar
    // fullscreen oynasiga o'tkazamiz (endi u alohida sahifa, scroll emas)
    setMainTab("products");
  }

  // Filtrlash: narx rejimi (optom narxi yo'q variantlar yashirinadi) +
  // kategoriya (Barchasi/Tuvaklar/Gullar) + do'kon sahifasi (shopFilter)
  const visibleProducts = useMemo(() => {
    return products
      .map((p) => ({ ...p, variants: (p.variants || []).filter((v) => priceOf(v, priceMode) > 0) }))
      .filter((p) => p.variants.length > 0)
      .filter((p) => (shopFilter ? (p.sellerId || "zetme") === shopFilter.id : true));
  }, [products, priceMode, shopFilter]);

  // Do'kon sahifasi: mahsulotlar sotuvchining o'z bo'limlari bo'yicha guruhlanadi
  // (Uzum Tezkor menyusi kabi). Bo'limsizlar oxirida "Boshqalar" ostida.
  const shopGroups = useMemo(() => {
    if (!shopFilter) return [];
    const shop = shops.find((s) => s.id === shopFilter.id);
    const secs = (shop && shop.sections) || [];
    const groups = secs.map((s) => ({ id: s.id, name: s.name, items: [] }));
    const other = { id: "other", name: "Boshqalar", items: [] };
    visibleProducts.forEach((p) => {
      const g = groups.find((x) => x.id === p.sectionId);
      (g || other).items.push(p);
    });
    const out = groups.filter((g) => g.items.length > 0);
    if (other.items.length) out.push(other);
    return out;
  }, [shopFilter, shops, visibleProducts]);

  const currentShopTile = shopFilter ? shopWall.find((s) => s.id === shopFilter.id) : null;

  function scrollToSection(gid) {
    const el = document.getElementById("sec-" + gid);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function changePriceMode(mode) {
    setPriceMode(mode);
    setActiveProduct(null); // ochiq modal eski narx rejimi bilan chalkashib qolmasin
  }

  const canGenerate = flower && pot && tokens > 0;
  function generate() {
    if (tokens <= 0) { setProfileOpen(true); return; }
    setGenLoading(true);
    setTimeout(() => {
      setGenLoading(false);
      setGenDone(true);
      const newTokens = tokens - 1;
      setTokens(newTokens);
      const rec = { thumb: flower && flower !== "catalog" ? flower : null, date: new Date().toLocaleDateString("uz-UZ") };
      const newGens = [rec, ...generations].slice(0, 24);
      setGenerations(newGens);
      storageSet("zetme_tokens", String(newTokens));
      storageSet("zetme_generations", JSON.stringify(newGens));
    }, 1400);
  }
  function buyTokens() {
    // demo top-up — real Payme/Click payment wires here later (xarajat-va-tolov-rejasi.md)
    const newTokens = tokens + 10;
    setTokens(newTokens);
    storageSet("zetme_tokens", String(newTokens));
  }
  function selectBadge(idx) {
    const i = Math.max(0, Math.min(BADGES.length - 1, idx || 0));
    setBadgeTier(i);
    storageSet("zetme_badge_tier", String(i));
  }

  // MARKETPLACE: savatda BIR NECHTA do'kon mahsulotlari bo'lishi mumkin —
  // har biri Savat oynasida alohida guruh sifatida ko'rsatiladi, har birining
  // o'z "Buyurtma berish" tugmasi bor (checkout esa har doim bitta sotuvchiga
  // tegishli qatorlarnigina yuboradi — buni server ham talab qiladi).
  function doAddToCart(fam, variant, qty) {
    const key = `${fam.id}_${variant.id}`;
    setCart((c) => {
      const ex = c.find((i) => i.key === key);
      if (ex) return c.map((i) => (i.key === key ? { ...i, qty: i.qty + qty } : i));
      return [...c, {
        key, id: fam.id, variantId: variant.id,
        name: variant.name || fam.name, litr: variant.litr, unit: fam.unit || "litr",
        price: Number(variant.price), optPrice: Number(variant.optPrice),
        image: variantImg(variant), qty,
        sellerId: fam.sellerId || "zetme",
        shopName: fam.shopName || "Tuvaklar",
        bonusEnabled: fam.bonusEnabled !== false,
      }];
    });
  }
  function addToCart(fam, variant, qty) {
    doAddToCart(fam, variant, qty);
  }
  function openShop(p) {
    setShopFilter({ id: p.sellerId || "zetme", name: p.shopName || "Tuvaklar" });
    setActiveProduct(null);
  }
  function changeQty(key, d) {
    setCart((c) => c.map((i) => (i.key === key ? { ...i, qty: Math.max(1, i.qty + d) } : i)).filter((i) => i.qty > 0));
  }
  function sendPotToStudio(p, variant) {
    const img = variantImg(variant) || "catalog";
    if ((p.category || "tuvak") === "gul") setFlower(img);
    else setPot(img);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // "Buyurtma berish" bosilganda forma ochiladi (Telegram kerak emas).
  // Savatda bir nechta do'kon bo'lishi mumkin — shuning uchun QAYSI sotuvchi
  // uchun buyurtma berilayotgani aniq belgilanadi (sellerId).
  function checkout(sellerId) {
    setCheckoutSellerId(sellerId);
    setCartOpen(false);
    setCheckoutError(null);
    setCheckoutFormOpen(true);
  }

  async function placeOrder(customerData) {
    setChecking(true);
    setCheckoutError(null);
    try {
      const sellerItems = cart.filter((i) => i.sellerId === checkoutSellerId);
      const res = await fetch(`${API_BASE}/api/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          priceMode,
          items: sellerItems.map((i) => ({ id: i.id, variantId: i.variantId, qty: i.qty })),
          customer: customerData,
          auth: custAuth || undefined,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Buyurtmani yuborib bo'lmadi");
      // hisob: server yangi "web" hisob ochgan bo'lishi mumkin — saqlaymiz
      if (data.auth && data.auth.chatId) {
        setCustAuth(data.auth);
        storageSet("zetme_cust_auth", JSON.stringify(data.auth));
      }
      // forma ma'lumotlarini eslab qolamiz
      setProfile({ name: customerData.name, phone: customerData.phone, region: customerData.region });
      storageSet("zetme_customer", JSON.stringify({ name: customerData.name, phone: customerData.phone, region: customerData.region }));
      setOrder({
        orderId: data.orderId, payTotal: data.payTotal, shopName: data.shopName,
        voucherDiscount: data.voucherDiscount || 0, voucherPercent: data.voucherPercent || 0,
      });
      // faqat SHU sotuvchining qatorlari savatdan olib tashlanadi — boshqa
      // do'konlardan qo'shilgan mahsulotlar savatda saqlanib qoladi
      setCart((c) => c.filter((i) => i.sellerId !== checkoutSellerId));
      setCheckoutFormOpen(false);
      setCheckoutSellerId(null);
    } catch (err) {
      setCheckoutError(err.message);
    } finally {
      setChecking(false);
    }
  }

  const cartCount = cart.reduce((s, i) => s + i.qty, 0);
  const cartPayTotal = cart.reduce((s, i) => s + priceOf(i, priceMode) * i.qty, 0);

  // Savatni sotuvchi bo'yicha guruhlaymiz — har bir do'kon o'z bloki,
  // o'z summasi va o'z "Buyurtma berish" tugmasi bilan ko'rinadi.
  const cartGroups = useMemo(() => {
    const map = new Map();
    cart.forEach((it) => {
      if (!map.has(it.sellerId)) {
        map.set(it.sellerId, { sellerId: it.sellerId, shopName: it.shopName, items: [], bonusEnabled: it.bonusEnabled !== false });
      }
      map.get(it.sellerId).items.push(it);
    });
    return Array.from(map.values()).map((g) => {
      const total = g.items.reduce((s, i) => s + priceOf(i, priceMode) * i.qty, 0);
      const qty = g.items.reduce((s, i) => s + i.qty, 0);
      const bonus = g.bonusEnabled ? bonusFor(total) : null;
      const payTotal = bonus && bonus.money ? total - bonus.money : total;
      return { ...g, total, qty, bonus, payTotal };
    });
  }, [cart, priceMode]);

  const checkoutGroup = cartGroups.find((g) => g.sellerId === checkoutSellerId) || null;
  const tier = badgeAt(badgeTier);

  return (
    <div className="root">
      <style>{buildCSS()}</style>

      {/* ===================== STUDIYA OYNASI: to'liq fullscreen sahifa ===================== */}
      {mainTab === "studio" && (
      <React.Fragment>
      <LeafRain />

      {/* ===================== TOP: premium AI hero + studio ===================== */}
      <section className="hero">
        <div className="hero-grain" />
        <div className="hero-glow hg1" />
        <div className="hero-glow hg2" />
        <div className="hero-petals" aria-hidden="true">
          {PETALS.map((pt, i) => (
            <span key={i} className={"petal pk" + pt.k}
              style={{ left: pt.l + "%", width: pt.s, height: pt.s, opacity: pt.o,
                animationDuration: pt.d + "s", animationDelay: pt.dl + "s" }} />
          ))}
        </div>
        {/* KINEMATIK SAHNA: qora tun, nurlanuvchi nilufar, suv sathi va halqa to'lqinlar */}
        <div className="hero-scene" aria-hidden="true">
          <video className="hero-video" src={HERO_VIDEO} poster={HERO_POSTER}
            autoPlay muted loop playsInline preload="auto"
            ref={(el) => {
              if (!el) return;
              /* React "muted" atributini DOMga yozmaydi (react#10389) — iOS/Telegram
                 brauzerlari esa autoplay uchun aynan shu atributni talab qiladi */
              el.muted = true;
              el.setAttribute("muted", "");
              el.setAttribute("webkit-playsinline", "");
              const pr = el.play();
              if (pr && pr.catch) pr.catch(() => {});
            }} />
          <div className="hero-veil" />
          <div className="mist m1" />
          <div className="mist m2" />
          <div className="water">
            <div className="water-glow" />
            <span className="ripple rp1" />
            <span className="ripple rp2" />
            <span className="ripple rp3" />
          </div>
          <span className="drop" />
          <span className="fire ff1" /><span className="fire ff2" /><span className="fire ff3" />
          <span className="fire ff4" /><span className="fire ff5" /><span className="fire ff6" />
        </div>
        <header className="topbar">
          <ZetmeMark size="sm" />
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button className="prof-entry" onClick={() => { setProfileOpen(true); setCartOpen(false); }}>
              <span className="prof-entry-ring" style={{ borderColor: tier.ring }}>
                <User size={14} color={tier.color} />
              </span>
              {AI_STUDIO_ENABLED && <span className="prof-entry-tok"><Coins size={11} color={C.laiton} /> {tokens}</span>}
            </button>
            {/* KUN/TUN — gul ochiladi (kun) / g'uncha bo'lib yumiladi (tun) */}
            <button className={"bloom-toggle " + (theme === "day" ? "bt-day" : "bt-night")}
              onClick={toggleTheme} aria-label="Kun/Tun" title={theme === "day" ? tr("toNight") : tr("toDay")}>
              <span className="bt-sky" />
              <svg className="bt-flower" viewBox="0 0 40 40" aria-hidden="true">
                <g className="bt-rays">
                  {[0, 45, 90, 135, 180, 225, 270, 315].map((a) => (
                    <line key={a} x1="20" y1="3.5" x2="20" y2="7" transform={`rotate(${a} 20 20)`} />
                  ))}
                </g>
                <g className="bt-petals">
                  {[0, 72, 144, 216, 288].map((a) => (
                    <ellipse key={a} className="bt-petal" cx="20" cy="12.6" rx="4.4" ry="7.2" transform={`rotate(${a} 20 20)`} />
                  ))}
                </g>
                <circle className="bt-core" cx="20" cy="20" r="4.2" />
                <path className="bt-moon" d="M26 11.5a9.8 9.8 0 1 0 2.6 15.8A8 8 0 0 1 26 11.5z" />
                <circle className="bt-star bs1" cx="11" cy="12.5" r="1.1" />
                <circle className="bt-star bs2" cx="29.5" cy="28" r="0.9" />
                <circle className="bt-star bs3" cx="13.5" cy="28.5" r="0.8" />
              </svg>
            </button>
            {/* UZ/RU — oltin barg slayder + gulbarg portlashi */}
            <button className={"lang-petal " + (lang === "ru" ? "lp-ru" : "lp-uz")} onClick={switchLang} aria-label="Til / Язык">
              <span className="lp-knob">
                <svg viewBox="0 0 20 20" className="lp-leaf" aria-hidden="true">
                  <path d="M10 1 C15.5 6 16.5 12 10 19 C3.5 12 4.5 6 10 1 Z" />

                </svg>
              </span>
              <span className={"lp-opt" + (lang === "uz" ? " on" : "")}>UZ</span>
              <span className={"lp-opt" + (lang === "ru" ? " on" : "")}>RU</span>
              {langBurst > 0 && (
                <span className="lp-burst" key={langBurst} aria-hidden="true">
                  {[0, 60, 120, 180, 240, 300].map((a) => <i key={a} style={{ "--a": a + "deg" }} />)}
                </span>
              )}
            </button>
          </div>
        </header>

        <p className="eyebrow rv rv1">{tr("eyebrow")}</p>
        <h1 className="htitle">{tr("heroT1")} <em>{tr("heroEm")}</em> {tr("heroT2")}</h1>
        <div className="h-ornament rv rv3" aria-hidden="true">
          <span className="h-line" /><Flower2 size={11} color={C.laiton} /><span className="h-line" />
        </div>

        {AI_STUDIO_ENABLED ? (
          <React.Fragment>
            <div className="genrow rv rv4">
              <GenSlot label={tr("slotFlower")} icon={Flower2} accent={C.bloom} image={flower} onSetImage={setFlower} />
              <div className="plus-sep"><Plus size={16} color={C.laiton} /></div>
              <GenSlot label={tr("slotPot")} icon={Sprout} accent={C.laiton} image={pot} onSetImage={setPot} />
            </div>

            <button className="gen-cta rv rv5" disabled={!canGenerate || genLoading} onClick={generate}>
              <span className="cta-shine" aria-hidden="true" />
              <Sparkles size={17} /> {genLoading ? tr("generating") : tr("generate")}
            </button>

            {genDone && !genLoading && (
              <div className="gen-result">
                <Sparkles size={15} color={C.laiton} />
                <span>{tr("genDone")}</span>
              </div>
            )}
          </React.Fragment>
        ) : null}

        <button className="scrollhint rv rv6" aria-label="Do'konlarga o'tish"
          onClick={() => { const el = document.getElementById("shops"); if (el) el.scrollIntoView({ behavior: "smooth" }); }}>
          <span>{tr("seeShops")}</span>
          <span className="sh-chev"><ChevronRight size={15} /></span>
        </button>
      </section>

      {/* ===================== STUDIYA: do'konlar devori ===================== */}
      <section className="shopwall" id="shops">
        <div className="sw-glow" />
        <div className="sw-inner">
          <p className="sw-eyebrow">{tr("partners")}</p>
          <h2 className="sw-title">{tr("shopsTitle")}</h2>
          <p className="sw-sub">
            {studioShops.length > 0 ? tr("shopsSub", studioShops.length) : tr("shopsSoon")}
          </p>

          {shopsLoading ? (
            <div className="sw-grid">
              {[0, 1, 2, 3].map((i) => <div key={i} className="sw-tile sw-skel" style={{ animationDelay: `${i * 90}ms` }} />)}
            </div>
          ) : studioShops.length === 0 ? (
            <div className="sw-empty"><Store size={16} color={C.laitonLo} /> {tr("noActiveShop")}</div>
          ) : (
            <div className="sw-grid">
              {studioShops.map((s, i) => (
                <button key={s.id} className="sw-tile" style={{ animationDelay: `${i * 80}ms` }}
                  onClick={() => openShopById(s)} title={`${s.name} do'koni`}>
                  <div className="sw-img">
                    {s.img
                      ? <img src={s.img} alt={s.name} loading="lazy" />
                      : <span className="sw-letter">{(s.name || "?").trim().charAt(0).toUpperCase()}</span>}
                  </div>
                  <span className="sw-shine" />
                  <div className="sw-veil" />
                  <div className="sw-name"><Store size={11} color={C.laitonHi} /><span>{s.name}</span></div>
                  {s.bonus && <div className="sw-bonus" title="Bonus tizimi yoqilgan">★</div>}
                </button>
              ))}
            </div>
          )}
        </div>
      </section>

      {/* ===================== MIJOZLAR SOTUV REYTINGI (liderlar taxtasi) ===================== */}
      <Leaderboard />

      {/* ===================== MA'LUMOTLAR: sayt haqida, buyurtma qo'llanmasi, qoidalar ===================== */}
      <section className="hiw" id="info">
        <div className="hiw-inner">
          <p className="sw-eyebrow">{tr("hiwEyebrow")}</p>
          <h2 className="ab-title">{tr("hiwTitle")}</h2>
          <p className="hiw-lead">{tr("hiwLead")}</p>
          <div className="hiw-row hiw-row4">
            {[
              { ic: Store,       t: tr("hiw1t"), d: tr("hiw1d") },
              { ic: ShoppingBag, t: tr("hiw2t"), d: tr("hiw2d") },
              { ic: User,        t: tr("hiw3t"), d: tr("hiw3d") },
              { ic: Check,       t: tr("hiw4t"), d: tr("hiw4d") },
            ].map((s, i) => {
              const Ic = s.ic;
              return (
                <div key={i} className="hiw-step" style={{ animationDelay: `${i * 130}ms` }}>
                  <div className="hiw-num"><span className="hiw-n">{i + 1}</span><Ic size={17} color={C.laitonHi} /></div>
                  <div className="hiw-t">{s.t}</div>
                  <div className="hiw-d">{s.d}</div>
                </div>
              );

          </div>

          <div className="hiw-rules">
            <div className="hiw-rules-ic"><BadgeCheck size={19} color={C.laitonHi} /></div>
            <div>
              <div className="hiw-rules-t">{tr("rulesT")}</div>
              <p className="hiw-rules-d">{tr("rulesD")}</p>
            </div>
          </div>
        </div>
      </section>

      {/* ===================== STUDIYA: Ilhom galereyasi (AI yoqilganda ko'rinadi) ===================== */}
      {AI_STUDIO_ENABLED && (
        <section className="insp">
          <div className="insp-inner">
            <p className="sw-eyebrow">{tr("inspEyebrow")}</p>
            <h2 className="ab-title">{tr("inspTitle")}</h2>
            <p className="insp-sub">{tr("inspSub")}</p>
          </div>
          <div className="insp-row">
            {INSP.map((g, i) => (
              <figure key={i} className="insp-card" style={{ animationDelay: `${i * 110}ms` }}>
                <img src={g.img} alt={tr(g.cap)} loading="lazy" />
                <span className="insp-badge"><Sparkles size={10} /> {tr("inspBadge")}</span>
                <figcaption>{tr(g.cap)}</figcaption>
              </figure>
            ))}
          </div>
        </section>
      )}

      {/* ===================== STUDIYA: Zetme AI haqida ===================== */}
      <section className="about" id="about">
        <div className="ab-inner">
          <p className="sw-eyebrow">Zetme</p>
          <h2 className="ab-title">{tr("abT1")} <em>{tr("abEm")}</em> {tr("abT2")}</h2>
          <p className="ab-lead">{tr("abLead")}</p>

          <div className="ab-grid">
            {[
              { ic: Sparkles, t: tr("abC1t"), d: tr("abC1d") },
              { ic: Clock,    t: tr("abC2t"), d: tr("abC2d") },
              { ic: Store,    t: tr("abC3t"), d: tr("abC3d") },
              { ic: Coins,    t: tr("abC4t"), d: tr("abC4d") },
            ].map((f, i) => (
              <div key={f.t} className="ab-card" style={{ animationDelay: `${120 + i * 90}ms` }}>
                <div className="ab-ic"><f.ic size={19} color={C.laitonHi} /></div>
                <div className="ab-ct">{f.t}</div>
                <div className="ab-cd">{f.d}</div>
              </div>
            ))}
          </div>

          <div className="ab-stats">
            <div className="ab-stat"><b>{studioShops.length || "—"}</b><span>{tr("statShopN", studioShops.length)}</span></div>
            <div className="ab-stat-sep" />
            <div className="ab-stat"><b>{products.length || "—"}</b><span>{tr("statProdN", products.length)}</span></div>
            <div className="ab-stat-sep" />
            <div className="ab-stat"><b>24/7</b><span>{tr("statOpen")}</span></div>
          </div>

      </React.Fragment>

      {/* ===================== MAHSULOTLAR OYNASI: to'liq fullscreen sahifa ===================== */}
      {mainTab === "products" && (
      <section className="market market-full" id="market">
        <div className="market-fullhead">
          <button className="market-back" onClick={() => setMainTab("studio")}>
            <ArrowLeft size={15} /> {tr("navStudio")}
          </button>
          <ZetmeMark size="sm" />
        </div>
        {!shopFilter ? (
          /* ---------- 1-qadam: faqat do'konlar ro'yxati ---------- */
          <>
            <div className="market-head">
              <h2 className="market-title">{tr("marketTitle")}</h2>
              <span className="market-sub">{tr("marketShopsN", shopWall.length)}</span>
            </div>
            <p className="market-hint">{tr("marketHint")}</p>

            {(productsLoading || shopsLoading) && <div className="market-state">{tr("loading")}</div>}
            {!productsLoading && productsError && <div className="market-state err">{tr("loadFail")}{productsError}</div>}
            {!productsLoading && !shopsLoading && !productsError && shopWall.length === 0 && (

            <div className="mshop-grid">
              {shopWall.map((s, i) => (
                <button key={s.id} className="mshop-card" style={{ animationDelay: `${i * 60}ms` }} onClick={() => openShopById(s)}>
                  <div className="mshop-img">
                    {s.img ? <img src={s.img} alt={s.name} loading="lazy" /> : <span className="mshop-letter">{(s.name || "?").trim().charAt(0).toUpperCase()}</span>}
                    {s.bonus && <span className="mshop-star">★</span>}
                  </div>
                  <div className="mshop-body">
                    <div className="mshop-name">{s.name}</div>
                    <div className="mshop-count">{tr("productN", s.count)} <ChevronRight size={12} /></div>
                  </div>
                </button>
              ))}
            </div>
          </>
        ) : (
          /* ---------- 2-qadam: do'kon ichi — bo'limlar menyusi ---------- */
          <>
            <button className="shopback" onClick={() => setShopFilter(null)}>
              <ArrowLeft size={15} /> {tr("allShops")}
            </button>

            <div className="shophead">
              <div className="shophead-img">
                {currentShopTile && currentShopTile.img
                  ? <img src={currentShopTile.img} alt={shopFilter.name} />
                  : <Store size={22} color={C.laitonLo} />}
              </div>
              <div>
                <h2 className="shophead-name">{shopFilter.name}</h2>
                <div className="shophead-meta">
                  {tr("productN", visibleProducts.length)}
                  {currentShopTile && currentShopTile.bonus ? tr("bonusGifts") : ""}

              </div>
            </div>

            <div className="market-toolbar">
              <PriceModeToggle mode={priceMode} onChange={changePriceMode} />
              {priceMode === "optom" && (
                <span className="market-optnote">{tr("optNote", fmt(OPT_MIN_ORDER))}</span>

            </div>

            {shopGroups.length > 1 && (
              <div className="secchips">
                {shopGroups.map((g) => (
                  <button key={g.id} className="secchip" onClick={() => scrollToSection(g.id)}>
                    {g.name} <span>{g.items.length}</span>

            )}

            {visibleProducts.length === 0 && (
              <div className="market-state">
                {priceMode === "optom" ? tr("emptyShopOptom") : tr("emptyShop")}

            {shopGroups.map((g) => (
              <div key={g.id} className="secblock" id={"sec-" + g.id}>
                {shopGroups.length > 1 && (
                  <h3 className="sec-title">{g.name} <span className="sec-count">{g.items.length}</span></h3>

                <div className="grid">
                  {g.items.map((p) => (
                    <div key={p.id} className="pcard" onClick={() => setActiveProduct(p)}>
                      <div className="pcard-img">
                        {thumbUrl(p) ? <img src={thumbUrl(p)} alt={p.name} /> : <span style={{ fontSize: 34 }}>🪴</span>}
                      </div>
                      <div className="pcard-body">
                        <div className="pcard-name">{p.name}</div>
                        <div className="pcard-meta">{litrRangeText(p)}{p.color ? ` · ${p.color}` : ""}</div>
                        <div className="pcard-price">{priceRangeText(p, priceMode)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </>
        )}
      </section>
      )}

      {/* bottom nav (mobile) — har doim ustida, qaysi oyna faolligini bo'yab ko'rsatadi.
          Har safar faqat BITTA fullscreen oyna faol bo'lishi uchun boshqalari yopiladi. */}
      <nav className="bottomnav">
        <button className={"bn-item" + (navActive === "studio" ? " active" : "")}
          onClick={() => { setMainTab("studio"); setCartOpen(false); setProfileOpen(false); }}>
          <Sparkles size={18} /><span>{tr("navStudio")}</span>
        </button>
        <button className={"bn-item" + (navActive === "products" ? " active" : "")}
          onClick={() => { setMainTab("products"); setCartOpen(false); setProfileOpen(false); }}>
          <Store size={18} /><span>{tr("navProducts")}</span>
        </button>
        <button className={"bn-item" + (navActive === "cart" ? " active" : "")}
          onClick={() => { setCartOpen(true); setProfileOpen(false); }} style={{ position: "relative" }}>
          <ShoppingBag size={18} />
          {cartCount > 0 && <span className="bn-badge">{cartCount}</span>}
          <span>{tr("navCart")}</span>
        </button>
        <button className={"bn-item" + (navActive === "profile" ? " active" : "")}
          onClick={() => { setProfileOpen(true); setCartOpen(false); }} style={{ position: "relative" }}>
          <User size={18} />
          {hasNews && !profileOpen && <span className="bn-dot" />}
          <span>{tr("navProfile")}</span>
        </button>
      </nav>

      {activeProduct && (
        <ProductModal p={activeProduct} priceMode={priceMode} onClose={() => setActiveProduct(null)} onAdd={addToCart} onSendToStudio={sendPotToStudio} />
      )}
      {cartOpen && (
        <CartDrawer
          groups={cartGroups}
          cartCount={cartCount}
          cartPayTotal={cartPayTotal}
          priceMode={priceMode}
          onClose={() => setCartOpen(false)}
          onQty={changeQty}
          onCheckout={checkout}
          checking={checking}
          checkoutError={checkoutError}
        />
      )}
      {checkoutFormOpen && checkoutGroup && (
        <CheckoutForm
          initial={{
            name: (custProfile && (custProfile.firstName || custProfile.name)) || profile.name || "",
            phone: (custProfile && custProfile.phone) || profile.phone || "",
            region: (custProfile && custProfile.region) || profile.region || "",
          }}
          itemCount={checkoutGroup.items.length}
          payTotal={checkoutGroup.payTotal}
          shopName={checkoutGroup.shopName}
          busy={checking}
          error={checkoutError}
          onSubmit={placeOrder}
          onClose={() => { setCheckoutFormOpen(false); setCheckoutSellerId(null); }}
        />
      )}
      {order && (
        <OrderSuccess
          orderId={order.orderId}
          payTotal={order.payTotal}
          shopName={order.shopName}
          voucherDiscount={order.voucherDiscount}
          voucherPercent={order.voucherPercent}
          onClose={() => setOrder(null)}
          onOpenProfile={() => { setOrder(null); setProfileOpen(true); }}
        />
      )}
      {profileOpen && (
        <ProfileScreen onClose={() => setProfileOpen(false)} profile={profile}
          badgeTier={badgeTier} generations={generations} onSelectBadge={selectBadge}
          cust={custProfile} orders={custOrders} linked={!!custAuth}
          vouchers={custVouchers.map((v) => ({ ...v, shopName: (shops.find((s) => s.id === v.sellerId) || {}).shopName || "" }))}
          onLink={linkCustomer} onRegister={registerCustomer} onSaveName={saveCustName} onPhoto={setCustPhoto} onCancelOrder={cancelCustOrder}
          onReceiveOrder={receiveCustOrder} onPaidOrder={paidCustOrder} />
      )}
    </div>
  );
}
