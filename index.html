<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zetme AI — Gul va tuvak studiyasi</title>
<meta name="description" content="Zetme AI — gulingizni tuvakda AI bilan ko'ring, tuvaklar katalogidan xarid qiling." />

<!-- PWA: telefonga "ilova" sifatida o'rnatish uchun — manifest + ikonalar + tema rangi.
     Haqiqiy build/servis kerak emas, bularning barchasi statik fayllar. -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12241B" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zetme" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- 2026-09-11: sayt endi Vite bilan OLDINDAN yig'iladi (Vercel buni o'zi qiladi).
     App kodi src/main.jsx da; brauzerga tayyor, siqilgan JS boradi — Babel yo'q. -->
<script>
  // servis vorker: PWA o'rnatilishi va tez ochilishi uchun (ixtiyoriy, xato bo'lsa ham sayt ishlayveradi)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
