const plural = (n, a, b, c) => {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return a;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b;
  return c;
};

  let v = d[k] !== undefined ? d[k] : STR.uz[k];
  if (typeof v === "function") return v(...a);
  return v === undefined ? k : v;
};

// tiny localStorage wrapper — never throws, works on the real deployed site
function storageGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) { return fallback; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
}

function priceRangeText(p, mode) {
  const prices = (p.variants || []).map((v) => priceOf(v, mode)).filter((n) => n > 0);
  if (prices.length === 0) return "";
  const min = Math.min(...prices), max = Math.max(...prices);
  return min === max ? fmt(min) : `${fmt(min)} – ${fmt(max)}`;
}
// O'lchov birligi — sotuvchi mahsulotga tanlaydi (admin panel).
// Eski mahsulotlarda `unit` yo'q — ular litr hisoblanadi.
const UNIT_META = {
  litr:   { short: "L",    spec: "Hajmi" },
  gramm:  { short: "g",    spec: "Og'irligi" },
  olcham: { short: "sm",   spec: "O'lchami" },
  dona:   { short: "dona", spec: "Miqdori" },
};
const unitOf = (u) => UNIT_META[u] || UNIT_META.litr;
function litrRangeText(p) {
  const litrs = (p.variants || []).map((v) => v.litr).filter(Boolean);
  return litrs.join(", ") + " " + unitOf(p.unit).short;
}
// Rasm: yangi variantlarda `image` (bitta), eskilarida `images` (massiv, 2 tagacha)
// bo'lishi mumkin — ikkalasini ham qo'llab-quvvatlaymiz.
function variantImg(v) {
  if (!v) return "";
  if (v.image) return v.image;
  if (Array.isArray(v.images) && v.images.length > 0) return v.images[0];
  return "";
}
function variantImgs(v) {
  if (!v) return [];
  if (Array.isArray(v.images) && v.images.length > 0) return v.images;
  return v.image ? [v.image] : [];
}
function thumbUrl(p) {
  return variantImg(p.variants && p.variants[0]) || "";
}

function GenSlot({ label, icon: Icon, accent, image, onSetImage }) {
  const [open, setOpen] = useState(false);
  const fileRef = React.useRef(null);
  const camRef = React.useRef(null);

  function handleFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    onSetImage(url);
    setOpen(false);
  }
  function pickSource(id) {
    if (id === "gallery") fileRef.current?.click();
    else if (id === "camera") camRef.current?.click();
    else { onSetImage("catalog"); setOpen(false); }
  }

  return (
    <div className="genslot" style={{ position: "relative" }}>
      <input ref={fileRef} type="file" accept="image/*" hidden onChange={handleFile} />
      <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={handleFile} />
      <div className="genslot-box" style={{ borderColor: image ? accent : C.line }}>
        {image ? (
          image === "catalog"
            ? <div className="genslot-fill" style={{ color: accent }}><ImageIcon size={26} /><span>{tr("srcPicked")}</span></div>
            : <img src={image} alt={label} className="genslot-img" />
        ) : (
          <div className="genslot-empty">
            <Icon size={22} color={accent} />
            <span>{label}</span>
          </div>
        )}
        <button className="genslot-plus" style={{ background: accent }} onClick={() => setOpen((v) => !v)} aria-label="Qo'shish">
          {image ? <ChevronRight size={16} color={C.noir} /> : <Plus size={17} color={C.noir} />}
        </button>
        {open && <SourceMenu accent={accent} onPick={pickSource} />}
      </div>
    </div>
  );
}

          <div className="pm-thumbrow">
            {imgs.map((u, i) => (
              <button key={i} type="button" className={"pm-thumb" + (u === heroImg ? " active" : "")} onClick={() => setImgIdx(i)}>
                <img src={u} alt="" />

        )}
        <div className="pm-body">

            <span className="pm-modebadge">{priceMode === "optom" ? tr("pmOptom") : tr("pmChakana")}</span>

          </div>
          <h3 className="pm-title">{displayName}</h3>
          <div className="pm-price">{fmt(unitPrice)}</div>

          {variants.length > 1 && (
            <div className="pm-litrrow">
              {variants.map((vv, i) => (
                <button key={vv.id || i} className={"pm-litrchip" + (i === vi ? " active" : "")} onClick={() => pickVariant(i)}>
                  {vv.litr} {unitOf(p.unit).short}
                </button>
              ))}
            </div>
          )}

          <div className="pm-specs">
            <div><span>{unitOf(p.unit).spec}</span><b>{v.litr ? `${v.litr} ${unitOf(p.unit).short}` : "—"}</b></div>
            <div><span>{tr("pmSize")}</span><b>{v.size || "—"}</b></div>
            <div><span>{tr("pmColor")}</span><b>{displayColor || "—"}</b></div>
          </div>
          <div className="pm-qty">
            <button onClick={() => setQty((q) => Math.max(1, q - 1))}><Minus size={15} /></button>
            <span>{qty}</span>
            <button onClick={() => setQty((q) => q + 1)}><Plus size={15} /></button>
          </div>
          <button className="pm-add" onClick={() => { onAdd(p, v, qty); onClose(); }}>
            <ShoppingBag size={16} /> {tr("addCart")}{fmt(unitPrice * qty)}
          </button>
          {AI_STUDIO_ENABLED && (
            <button className="pm-studio" onClick={() => { onSendToStudio(p, v); onClose(); }}>
              <Sparkles size={15} /> {p.category === "gul" ? tr("pmStudioGul") : tr("pmStudioTuvak")}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function CartDrawer({ items, priceMode, onClose, onQty, onCheckout, checking, checkoutError }) {
  const total = items.reduce((s, i) => s + priceOf(i, priceMode) * i.qty, 0);
  const minRequired = priceMode === "optom" ? OPT_MIN_ORDER : MIN_ORDER;
  const remaining = minRequired - total;
  const meetsMin = total >= minRequired;
  // MARKETPLACE: bonus/sovg'a faqat shu do'kon bonusni yoqqan bo'lsa ko'rsatiladi
  // (server ham xuddi shunday hisoblaydi — api/checkout.js)
  const cartShop = items[0] || null;
  const bonusOn = cartShop ? cartShop.bonusEnabled !== false : true;
  const bonus = bonusOn ? bonusFor(total) : null;
  const payTotal = bonus && bonus.money ? total - bonus.money : total;
  const showTeaser = bonusOn && total >= TEASER_MIN && total < TEASER_MAX;

  return (
    <div className="ov ov-full" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="cart">
        <div className="cart-head">
          <span style={{ fontFamily: FONT_DISPLAY, fontSize: 20 }}>{tr("cartTitle")}</span>
          <button className="pm-close" onClick={onClose}><X size={18} /></button>
        </div>

        <div className="cart-modebadge">{priceMode === "optom" ? tr("modeOptomCalc") : tr("modeChakCalc")}</div>
        {cartShop && (
          <div className="cart-shopline"><Store size={13} /> {tr("cartFrom1")} <b>{cartShop.shopName}</b> {tr("cartFrom2")}</div>
        )}

        {items.length === 0 ? (
          <div className="cart-empty">{tr("cartEmpty")}</div>
        ) : (
          <>
            <div className="cart-list">
              {items.map((it) => (
                <div key={it.key} className="cart-row">
                  <div className="cart-emoji">{it.image ? <img src={it.image} alt="" /> : "🪴"}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 13.5 }}>{it.name}</div>
                    <div style={{ fontSize: 12, color: C.inkDim }}>{it.litr} {unitOf(it.unit).short} · {fmt(priceOf(it, priceMode))}</div>
                  </div>
                  <div className="qty-mini">
                    <button onClick={() => onQty(it.key, -1)}><Minus size={13} /></button>
                    <span>{it.qty}</span>
                    <button onClick={() => onQty(it.key, 1)}><Plus size={13} /></button>
                  </div>
                </div>
              ))}
            </div>

            {showTeaser && (
              <div className="cart-teaser">{tr("teaser", fmt(TEASER_MAX))}</div>
            )}
            {bonus && bonus.gift && (
              <div className="cart-bonus">{tr("bonusGift")}</div>
            )}
            {bonus && bonus.money > 0 && (
              <div className="cart-bonus">
                💰 Bonus: −{fmt(bonus.money)}{bonus.tokin ? ` + ${bonus.tokin} tokin` : ""} — avtomatik ayirildi
              </div>
            )}

            <div className="cart-totals">
              <div className="cart-total"><span>{tr("total")}</span><b>{fmt(total)}</b></div>
              {payTotal !== total && (
                <div className="cart-paytotal"><span>{tr("payTotal")}</span><b>{fmt(payTotal)}</b></div>
              )}
            </div>

            {!meetsMin ? (
              <div className="cart-minwarn">
                <Lock size={14} />
                <div>
                  <div style={{ fontWeight: 600 }}>
                    {priceMode === "optom" ? tr("minOptom") : tr("minOrder")} — {fmt(minRequired)}
                  </div>
                  <div style={{ fontSize: 11.5, marginTop: 2 }}>
                    {tr("addMore", fmt(remaining))}
                    {priceMode === "optom" && tr("orChakana")}
                  </div>
                </div>
              </div>
            ) : (
              <>
                <button className="pm-add" disabled={checking} onClick={onCheckout}>
                  <Send size={15} /> {checking ? tr("sending") : tr("placeOrder")}
                </button>
                {checkoutError && <div className="cart-err">{checkoutError}</div>}
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

    setCancelBusy(true); setCancelErr("");
    const err = await onCancelOrder(id);
    setCancelBusy(false);
    setCancelingId(null);
    if (err) setCancelErr(err);
  }
  async function doReceive(id) {
    setActBusy(true); setCancelErr("");
    const err = await onReceiveOrder(id);
    setActBusy(false);
    if (err) setCancelErr(err);
  }
  async function doPaid(id) {
    setActBusy(true); setCancelErr("");
    const err = await onPaidOrder(id, payNote.trim());
    setActBusy(false);
    if (err) setCancelErr(err);
    else { setPayFormId(null); setPayNote(""); }
  }
  const tier = tierForTokens(tokens, badgeOwned);
  const nextTier = TIERS_BADGE.find((t) => t.min > tokens);
  const photoRef = React.useRef(null);

  const [code, setCode] = useState("");
  const [linkBusy, setLinkBusy] = useState(false);
  const [linkErr, setLinkErr] = useState("");
  const [editName, setEditName] = useState(false);
  const [fn, setFn] = useState("");
  const [ln, setLn] = useState("");

  const [photoBusy, setPhotoBusy] = useState(false);

  const displayPhone = (cust && cust.phone) || profile.phone || "";

  async function doLink() {
    setLinkBusy(true); setLinkErr("");
    const err = await onLink(code.trim());
    setLinkBusy(false);
    if (err) setLinkErr(err); else setCode("");

  async function doSaveName() {
    setNameBusy(true);
    const err = await onSaveName(fn.trim(), ln.trim());
    setNameBusy(false);
    if (!err) setEditName(false);

  async function onPhotoFile(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setPhotoBusy(true); setPhotoErr("");
    const err = await onPhoto(f);
    setPhotoBusy(false);
    if (err) setPhotoErr(err);

    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, "0");
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;

      <div className="profile">

        <div className="prof-head">
          <div className="prof-avatar" style={{ borderColor: tier.ring, cursor: linked ? "pointer" : "default" }}

              ? <img src={cust.photo} alt="" className="prof-photo" />

            {!editName ? (
              <div className="prof-name">

                    setFn((cust && cust.firstName) || ""); setLn((cust && cust.lastName) || ""); setEditName(true);

            {cancelErr && <div className="prof-err" style={{ marginBottom: 8 }}>{cancelErr}</div>}
            {orders.length === 0 ? (

            ) : (

                    <div className="prof-order-top">

                    <div className="prof-order-total">

                      </div>
                    )}

                    {(o.status || "yangi") === "yangi" && o.id && o.sellerId && (
                      cancelingId === o.id ? (
                        <div className="po-cancelask">
                          <span>{tr("confirmCancel")}</span>
                          <button className="po-cbtn po-cyes" disabled={cancelBusy} onClick={() => doCancelOrder(o.id)}>{cancelBusy ? "…" : tr("yesCancel")}</button>
                          <button className="po-cbtn" onClick={() => setCancelingId(null)}>{tr("no")}</button>

                      ) : (
                        <button className="po-cancelbtn" onClick={() => { setCancelErr(""); setCancelingId(o.id); }}>
                          {tr("cancel")}

                    {/* Buyurtma yuborilgan — mijoz qabul qilganda bosadi */}

                      o.paymentStatus === "tolangan" ? (

                        <div className="po-payrow po-pay-wait">

        <div className="prof-histhead">
          <Clock size={14} color={C.inkDim} />
          <span>{tr("genHistory")}</span>
        </div>
        {generations.length === 0 ? (
          <div className="prof-empty">{tr("genEmpty")}</div>

          <div className="prof-grid">
            {generations.map((g, i) => (
              <div key={i} className="prof-gitem">
                {g.thumb ? <img src={g.thumb} alt="" /> : <Sparkles size={20} color={C.laitonLo} />}
                <span>{g.date}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== App ============================== */
function App() {
  const [flower, setFlower] = useState(null);
  const [pot, setPot] = useState(null);
  const [lang, setLang] = useState(LANG);
  const [theme, setTheme] = useState(THEME);
  const [langBurst, setLangBurst] = useState(0);
  const switchLang = () => { const l = lang === "uz" ? "ru" : "uz"; applyLang(l); setLang(l); setLangBurst(Date.now()); };
  const toggleTheme = () => { const t = theme === "day" ? "night" : "day"; applyTheme(t); setTheme(t); };

  /* Hero video: ba'zi mobil brauzerlar (Telegram ichki brauzeri, iOS Low Power)
     autoplay'ni bloklaydi — birinchi teginish/scrollda videoni qayta ishga tushiramiz */
  useEffect(() => {
    const kick = () => {
      const v = document.querySelector(".hero-video");
      if (v && v.paused) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    };
    kick();
    const evs = ["touchstart", "click", "scroll"];
    evs.forEach((e) => window.addEventListener(e, kick, { once: true, passive: true }));
    document.addEventListener("visibilitychange", kick);
    return () => {
      evs.forEach((e) => window.removeEventListener(e, kick));
      document.removeEventListener("visibilitychange", kick);
    };
  }, []);
  const [genLoading, setGenLoading] = useState(false);
  const [genDone, setGenDone] = useState(false);

  const [products, setProducts] = useState([]);
  const [productsLoading, setProductsLoading] = useState(true);
  const [productsError, setProductsError] = useState(null);
  const [shops, setShops] = useState([]);              // studiyadagi do'konlar devori
  const [shopsLoading, setShopsLoading] = useState(true);
  const [priceMode, setPriceMode] = useState("chakana"); // "chakana" | "optom"
  const [shopFilter, setShopFilter] = useState(null);    // null | { id, name } — do'kon sahifasi

  // FULLSCREEN OYNALAR: Studiya/Mahsulotlar — asosiy "sahifa" almashinuvi (bittasi to'liq
  // ko'rinadi, ikkinchisi butunlay yashiriladi — orqa fonda hech narsa qolmaydi).
  // Savat/Profil esa modallar (pastda), lekin ular ham endi to'liq fullscreen bo'ladi.
  const [mainTab, setMainTab] = useState("studio"); // "studio" | "products"
  useEffect(() => { window.scrollTo(0, 0); }, [mainTab]);

  const [activeProduct, setActiveProduct] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState([]);
  // boshqa do'kondan mahsulot qo'shilmoqchi bo'lganda chiqadigan ogohlantirish:

  // rasmni brauzerda kichraytirib (400px, JPEG) serverga yuboramiz
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const S = 400;
        const k = Math.min(1, S / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * k);
        canvas.height = Math.round(img.height * k);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
      };
      img.onerror = () => reject(new Error("Rasmni o'qib bo'lmadi"));
      img.src = URL.createObjectURL(file);
    });
  }

  async function setCustPhoto(file) {

  function doAddToCart(fam, variant, qty) {
    const key = `${fam.id}_${variant.id}`;
    setCart((c) => {
      const ex = c.find((i) => i.key === key);
      if (ex) return c.map((i) => (i.key === key ? { ...i, qty: i.qty + qty } : i));
      return [...c, {
        key, id: fam.id, variantId: variant.id,
        name: variant.name || fam.name, litr: variant.litr, unit: fam.unit || "litr",
        price: Number(variant.price), optPrice: Number(variant.optPrice),
        image: variantImg(variant), qty,
        sellerId: fam.sellerId || "zetme",
        shopName: fam.shopName || "Tuvaklar",
        bonusEnabled: fam.bonusEnabled !== false,

    });

    if (cart.length > 0 && cart[0].sellerId !== newSellerId) {
      setShopConflict({
        fam, variant, qty,
        currentShop: cart[0].shopName,
        newShop: fam.shopName || "Tuvaklar",
      });
      return;
    }
    doAddToCart(fam, variant, qty);
  }

    if (clearAndAdd && shopConflict) {

      const { fam, variant, qty } = shopConflict;
      setCart([{

            </div>

            <button className="gen-cta rv rv5" disabled={!canGenerate || genLoading} onClick={generate}>
              <span className="cta-shine" aria-hidden="true" />
              <Sparkles size={17} /> {genLoading ? tr("generating") : tr("generate")}
            </button>

            {genDone && !genLoading && (
              <div className="gen-result">
                <Sparkles size={15} color={C.laiton} />
                <span>{tr("genDone")}</span>
              </div>
            )}
          </React.Fragment>
        ) : (
          /* AI montaj hozircha o'chirilgan — o'rniga nafis, davomiy animatsiyali
             Zetme markasi turadi (tez orada qaytadi degan kayfiyatda). */
          <div className="hero-center rv rv4" aria-hidden="false">
            <div className="hc-ring hc-r1" />
            <div className="hc-ring hc-r2" />
            <ZetmeMark size="lg" />
            <p className="hc-soon">{tr("aiSoon")}</p>
          </div>
        )}

        <button className="scrollhint rv rv6" aria-label="Do'konlarga o'tish"
          onClick={() => { const el = document.getElementById("shops"); if (el) el.scrollIntoView({ behavior: "smooth" }); }}>
          <span>{tr("seeShops")}</span>
          <span className="sh-chev"><ChevronRight size={15} /></span>
        </button>
      </section>

      {/* ===================== STUDIYA: do'konlar devori ===================== */}
      <section className="shopwall" id="shops">
        <div className="sw-glow" />
        <div className="sw-inner">
          <p className="sw-eyebrow">{tr("partners")}</p>
          <h2 className="sw-title">{tr("shopsTitle")}</h2>
          <p className="sw-sub">
            {studioShops.length > 0 ? tr("shopsSub", studioShops.length) : tr("shopsSoon")}
          </p>

          {shopsLoading ? (
            <div className="sw-grid">
              {[0, 1, 2, 3].map((i) => <div key={i} className="sw-tile sw-skel" style={{ animationDelay: `${i * 90}ms` }} />)}
            </div>
          ) : studioShops.length === 0 ? (
            <div className="sw-empty"><Store size={16} color={C.laitonLo} /> {tr("noActiveShop")}</div>
          ) : (
            <div className="sw-grid">
              {studioShops.map((s, i) => (
                <button key={s.id} className="sw-tile" style={{ animationDelay: `${i * 80}ms` }}
                  onClick={() => openShopById(s)} title={`${s.name} do'koni`}>
                  <div className="sw-img">
                    {s.img
                      ? <img src={s.img} alt={s.name} loading="lazy" />
                      : <span className="sw-letter">{(s.name || "?").trim().charAt(0).toUpperCase()}</span>}
                  </div>
                  <span className="sw-shine" />
                  <div className="sw-veil" />
                  <div className="sw-name"><Store size={11} color={C.laitonHi} /><span>{s.name}</span></div>
                  {s.bonus && <div className="sw-bonus" title="Bonus tizimi yoqilgan">★</div>}
                </button>
              ))}
            </div>
          )}
        </div>
      </section>

      {/* ===================== MA'LUMOTLAR: sayt haqida, buyurtma qo'llanmasi, qoidalar ===================== */}
      <section className="hiw" id="info">
        <div className="hiw-inner">
          <p className="sw-eyebrow">{tr("hiwEyebrow")}</p>
          <h2 className="ab-title">{tr("hiwTitle")}</h2>
          <p className="hiw-lead">{tr("hiwLead")}</p>
          <div className="hiw-row hiw-row4">
            {[
              { ic: Store,       t: tr("hiw1t"), d: tr("hiw1d") },
              { ic: ShoppingBag, t: tr("hiw2t"), d: tr("hiw2d") },
              { ic: User,        t: tr("hiw3t"), d: tr("hiw3d") },
              { ic: Check,       t: tr("hiw4t"), d: tr("hiw4d") },
            ].map((s, i) => {
              const Ic = s.ic;
              return (
                <div key={i} className="hiw-step" style={{ animationDelay: `${i * 130}ms` }}>
                  <div className="hiw-num"><span className="hiw-n">{i + 1}</span><Ic size={17} color={C.laitonHi} /></div>
                  <div className="hiw-t">{s.t}</div>
                  <div className="hiw-d">{s.d}</div>
                </div>
              );
            })}
          </div>

          <div className="hiw-rules">
            <div className="hiw-rules-ic"><BadgeCheck size={19} color={C.laitonHi} /></div>
            <div>
              <div className="hiw-rules-t">{tr("rulesT")}</div>
              <p className="hiw-rules-d">{tr("rulesD")}</p>
            </div>
          </div>
        </div>
      </section>

      {/* ===================== STUDIYA: Ilhom galereyasi (AI yoqilganda ko'rinadi) ===================== */}
      {AI_STUDIO_ENABLED && (
        <section className="insp">
          <div className="insp-inner">
            <p className="sw-eyebrow">{tr("inspEyebrow")}</p>
            <h2 className="ab-title">{tr("inspTitle")}</h2>
            <p className="insp-sub">{tr("inspSub")}</p>
          </div>
          <div className="insp-row">
            {INSP.map((g, i) => (
              <figure key={i} className="insp-card" style={{ animationDelay: `${i * 110}ms` }}>
                <img src={g.img} alt={tr(g.cap)} loading="lazy" />
                <span className="insp-badge"><Sparkles size={10} /> {tr("inspBadge")}</span>
                <figcaption>{tr(g.cap)}</figcaption>
              </figure>
            ))}
          </div>
        </section>
      )}

      {/* ===================== STUDIYA: Zetme AI haqida ===================== */}
      <section className="about" id="about">
        <div className="ab-inner">
          <p className="sw-eyebrow">Zetme AI</p>
          <h2 className="ab-title">{tr("abT1")} <em>{tr("abEm")}</em> {tr("abT2")}</h2>
          <p className="ab-lead">{tr("abLead")}</p>

          <div className="ab-grid">
            {[
              { ic: Sparkles, t: tr("abC1t"), d: tr("abC1d") },
              { ic: Clock,    t: tr("abC2t"), d: tr("abC2d") },
              { ic: Store,    t: tr("abC3t"), d: tr("abC3d") },
              { ic: Coins,    t: tr("abC4t"), d: tr("abC4d") },
            ].map((f, i) => (
              <div key={f.t} className="ab-card" style={{ animationDelay: `${120 + i * 90}ms` }}>
                <div className="ab-ic"><f.ic size={19} color={C.laitonHi} /></div>
                <div className="ab-ct">{f.t}</div>
                <div className="ab-cd">{f.d}</div>
              </div>
            ))}
          </div>

          <div className="ab-stats">
            <div className="ab-stat"><b>{studioShops.length || "—"}</b><span>{tr("statShopN", studioShops.length)}</span></div>
            <div className="ab-stat-sep" />
            <div className="ab-stat"><b>{products.length || "—"}</b><span>{tr("statProdN", products.length)}</span></div>
            <div className="ab-stat-sep" />
            <div className="ab-stat"><b>24/7</b><span>{tr("statOpen")}</span></div>
          </div>
        </div>
      </section>

      </React.Fragment>
      )}

      {/* ===================== MAHSULOTLAR OYNASI: to'liq fullscreen sahifa ===================== */}
      {mainTab === "products" && (
      <section className="market market-full" id="market">
        <div className="market-fullhead">
          <button className="market-back" onClick={() => setMainTab("studio")}>
            <ArrowLeft size={15} /> {tr("navStudio")}
          </button>
          <ZetmeMark size="sm" />
        </div>
        {!shopFilter ? (
          /* ---------- 1-qadam: faqat do'konlar ro'yxati ---------- */
          <>
            <div className="market-head">
              <h2 className="market-title">{tr("marketTitle")}</h2>
              <span className="market-sub">{tr("marketShopsN", shopWall.length)}</span>
            </div>
            <p className="market-hint">{tr("marketHint")}</p>

            {(productsLoading || shopsLoading) && <div className="market-state">{tr("loading")}</div>}
            {!productsLoading && productsError && <div className="market-state err">{tr("loadFail")}{productsError}</div>}
            {!productsLoading && !shopsLoading && !productsError && shopWall.length === 0 && (
              <div className="market-state">{tr("noShopsYet")}</div>
            )}

            <div className="mshop-grid">
              {shopWall.map((s, i) => (
                <button key={s.id} className="mshop-card" style={{ animationDelay: `${i * 60}ms` }} onClick={() => openShopById(s)}>
                  <div className="mshop-img">
                    {s.img ? <img src={s.img} alt={s.name} loading="lazy" /> : <span className="mshop-letter">{(s.name || "?").trim().charAt(0).toUpperCase()}</span>}
                    {s.bonus && <span className="mshop-star">★</span>}
                  </div>
                  <div className="mshop-body">
                    <div className="mshop-name">{s.name}</div>
                    <div className="mshop-count">{tr("productN", s.count)} <ChevronRight size={12} /></div>
                  </div>
                </button>
              ))}
            </div>
          </>
        ) : (
          /* ---------- 2-qadam: do'kon ichi — bo'limlar menyusi ---------- */
          <>
            <button className="shopback" onClick={() => setShopFilter(null)}>
              <ArrowLeft size={15} /> {tr("allShops")}
            </button>

            <div className="shophead">
              <div className="shophead-img">
                {currentShopTile && currentShopTile.img
                  ? <img src={currentShopTile.img} alt={shopFilter.name} />
                  : <Store size={22} color={C.laitonLo} />}
              </div>
              <div>
                <h2 className="shophead-name">{shopFilter.name}</h2>
                <div className="shophead-meta">
                  {tr("productN", visibleProducts.length)}
                  {currentShopTile && currentShopTile.bonus ? tr("bonusGifts") : ""}
                </div>
              </div>
            </div>

            <div className="market-toolbar">
              <PriceModeToggle mode={priceMode} onChange={changePriceMode} />
              {priceMode === "optom" && (
                <span className="market-optnote">{tr("optNote", fmt(OPT_MIN_ORDER))}</span>
              )}
            </div>

            {shopGroups.length > 1 && (
              <div className="secchips">
                {shopGroups.map((g) => (
                  <button key={g.id} className="secchip" onClick={() => scrollToSection(g.id)}>
                    {g.name} <span>{g.items.length}</span>
                  </button>
                ))}
              </div>
            )}

            {visibleProducts.length === 0 && (
              <div className="market-state">
                {priceMode === "optom" ? tr("emptyShopOptom") : tr("emptyShop")}
              </div>
            )}

            {shopGroups.map((g) => (
              <div key={g.id} className="secblock" id={"sec-" + g.id}>
                {shopGroups.length > 1 && (
                  <h3 className="sec-title">{g.name} <span className="sec-count">{g.items.length}</span></h3>
                )}
                <div className="grid">
                  {g.items.map((p) => (
                    <div key={p.id} className="pcard" onClick={() => setActiveProduct(p)}>
                      <div className="pcard-img">
                        {thumbUrl(p) ? <img src={thumbUrl(p)} alt={p.name} /> : <span style={{ fontSize: 34 }}>🪴</span>}
                      </div>
                      <div className="pcard-body">
                        <div className="pcard-name">{p.name}</div>
                        <div className="pcard-meta">{litrRangeText(p)}{p.color ? ` · ${p.color}` : ""}</div>
                        <div className="pcard-price">{priceRangeText(p, priceMode)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </>
        )}
      </section>
      )}

      {/* bottom nav (mobile) — har doim ustida, qaysi oyna faolligini bo'yab ko'rsatadi.
          Har safar faqat BITTA fullscreen oyna faol bo'lishi uchun boshqalari yopiladi. */}
      <nav className="bottomnav">
        <button className={"bn-item" + (navActive === "studio" ? " active" : "")}
          onClick={() => { setMainTab("studio"); setCartOpen(false); setProfileOpen(false); }}>
          <Sparkles size={18} /><span>{tr("navStudio")}</span>
        </button>
        <button className={"bn-item" + (navActive === "products" ? " active" : "")}
          onClick={() => { setMainTab("products"); setCartOpen(false); setProfileOpen(false); }}>
          <Store size={18} /><span>{tr("navProducts")}</span>
        </button>
        <button className={"bn-item" + (navActive === "cart" ? " active" : "")}
          onClick={() => { setCartOpen(true); setProfileOpen(false); }} style={{ position: "relative" }}>
          <ShoppingBag size={18} />
          {cartCount > 0 && <span className="bn-badge">{cartCount}</span>}
          <span>{tr("navCart")}</span>
        </button>
        <button className={"bn-item" + (navActive === "profile" ? " active" : "")}
          onClick={() => { setProfileOpen(true); setCartOpen(false); }} style={{ position: "relative" }}>
          <User size={18} />
          {hasNews && !profileOpen && <span className="bn-dot" />}
          <span>{tr("navProfile")}</span>
        </button>
      </nav>

      {activeProduct && (
        <ProductModal p={activeProduct} priceMode={priceMode} onClose={() => setActiveProduct(null)} onAdd={addToCart} onSendToStudio={sendPotToStudio} />
      )}
      {cartOpen && (
        <CartDrawer
          items={cart}
          priceMode={priceMode}
          onClose={() => setCartOpen(false)}
          onQty={changeQty}
          onCheckout={checkout}
          checking={checking}
          checkoutError={checkoutError}
        />
      )}
      {checkoutFormOpen && (
        <CheckoutForm
          initial={{
            name: (custProfile && (custProfile.firstName || custProfile.name)) || profile.name || "",
            phone: (custProfile && custProfile.phone) || profile.phone || "",
            region: (custProfile && custProfile.region) || profile.region || "",
          }}
          itemCount={cart.length}
          payTotal={cartPayTotal}
          shopName={cart[0] ? cart[0].shopName : ""}
          busy={checking}
          error={checkoutError}
          onSubmit={placeOrder}
          onClose={() => setCheckoutFormOpen(false)}
        />
      )}
      {order && (
        <OrderSuccess
          orderId={order.orderId}
          payTotal={order.payTotal}
          shopName={order.shopName}
          voucherDiscount={order.voucherDiscount}
          voucherPercent={order.voucherPercent}
          onClose={() => setOrder(null)}
          onOpenProfile={() => { setOrder(null); setProfileOpen(true); }}
        />
      )}
      {shopConflict && (
        <div className="ov" onClick={(e) => e.target === e.currentTarget && resolveShopConflict(false)}>
          <div className="conflict">
            <div className="conflict-ic"><Store size={22} color={C.laitonLo} /></div>
            <h3 style={{ fontFamily: FONT_DISPLAY, fontSize: 20, margin: "0 0 6px" }}>{tr("confT")}</h3>
            <p style={{ fontSize: 13.5, color: C.inkDim, margin: "0 0 16px", lineHeight: 1.55 }}>
              {tr("confB1")} <b>{shopConflict.currentShop}</b>{tr("confB2")} <b>{shopConflict.newShop}</b>{tr("confB3")}
            </p>
            <button className="pm-add" onClick={() => { resolveShopConflict(false); setCartOpen(true); }}>
              <ShoppingBag size={15} /> {tr("confFinish")} ({shopConflict.currentShop})
            </button>
            <button className="conflict-clear" onClick={() => resolveShopConflict(true)}>
              {tr("confClear1")} {shopConflict.newShop} {tr("confClear2")}
            </button>
            <button className="conflict-cancel" onClick={() => resolveShopConflict(false)}>{tr("cancel")}</button>
          </div>
        </div>
      )}
      {profileOpen && (
        <ProfileScreen onClose={() => setProfileOpen(false)} profile={profile} tokens={tokens}
          badgeOwned={badgeOwned} generations={generations} onBuyTokens={buyTokens} onBuyBadge={buyBadge}
          cust={custProfile} orders={custOrders} linked={!!custAuth}
          vouchers={custVouchers.map((v) => ({ ...v, shopName: (shops.find((s) => s.id === v.sellerId) || {}).shopName || "" }))}
          onLink={linkCustomer} onSaveName={saveCustName} onPhoto={setCustPhoto} onCancelOrder={cancelCustOrder}
          onReceiveOrder={receiveCustOrder} onPaidOrder={paidCustOrder} />
      )}
    </div>
  );
}

/* ============================== CSS ============================== */
const buildCSS = () => `
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap');
*{box-sizing:border-box}
.root{font-family:${FONT_BODY};background:${C.paper};
  background-image:radial-gradient(120% 46% at 50% 0%, ${C.accentSoft}, transparent 62%);
  background-repeat:no-repeat;min-height:100vh;padding-bottom:74px;
  transition:background-color .55s ease}
.root, .root *{transition:background-color .4s ease, border-color .4s ease, color .25s ease}

/* ---------- HERO / STUDIO — premium vayb ---------- */
@keyframes rvIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes hgPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
@keyframes petalFloat{
  0%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-52vh) translateX(14px) rotate(160deg)}
  100%{transform:translateY(-104vh) translateX(-8px) rotate(320deg)}}
@keyframes emShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes artDraw{to{stroke-dashoffset:0}}
@keyframes ctaSweep{0%{transform:translateX(-160%) rotate(16deg)}55%,100%{transform:translateX(260%) rotate(16deg)}}
@keyframes chevBounce{0%,100%{transform:rotate(90deg) translateX(0)}50%{transform:rotate(90deg) translateX(5px)}}
@keyframes slotBreathe{0%,100%{border-color:${C.line}}50%{border-color:${C.laitonLo}88}}
@keyframes icFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.rv{animation:rvIn .8s cubic-bezier(.22,1,.36,1) both}
.rv1{animation-delay:.05s}.rv2{animation-delay:.16s}.rv3{animation-delay:.3s}
.rv4{animation-delay:.42s}.rv5{animation-delay:.56s}.rv6{animation-delay:.75s}

.hero{position:relative;color:${C.ivoire};padding:16px 18px 34px;overflow:hidden;
  background:radial-gradient(130% 110% at 50% 0%, #0e2c21 0%, #071811 45%, #020906 78%, #000 100%)}
.hero-grain{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%, #ffffff08, transparent 60%)}
.hero-glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(6px)}
.hg1{top:-120px;left:50%;margin-left:-210px;width:420px;height:300px;
  background:radial-gradient(50% 50% at 50% 50%, ${C.laiton}26, transparent 70%);animation:hgPulse 8s ease-in-out infinite}
.hg2{bottom:-140px;right:-120px;width:380px;height:320px;
  background:radial-gradient(50% 50% at 50% 50%, ${C.accent}30, transparent 70%);animation:hgPulse 11s ease-in-out 2s infinite}
.hero-petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;bottom:-24px;display:block;animation:petalFloat linear infinite;filter:blur(.4px)}
.pk0{background:${C.laiton};border-radius:70% 0 70% 0}
.pk1{background:${C.bloom};border-radius:50% 50% 50% 0}
.pk2{background:${C.laitonHi};border-radius:70% 0 70% 0;transform:rotate(45deg)}
/* --- kinematik sahna: nilufar + suv --- */
@keyframes lotusSway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes lotusBreathe{0%,100%{opacity:.8;filter:brightness(.95)}50%{opacity:1;filter:brightness(1.18)}}
@keyframes rippleOut{0%{transform:translateX(-50%) scale(.12);opacity:.8}80%{opacity:.18}100%{transform:translateX(-50%) scale(1.35);opacity:0}}
@keyframes dropFall{0%,55%{opacity:0;transform:translateY(0)}60%{opacity:.9}96%{opacity:.9;transform:translateY(102px)}100%{opacity:0;transform:translateY(104px)}}
@keyframes fireDrift{0%,100%{transform:translate(0,0)}25%{transform:translate(9px,-14px)}50%{transform:translate(-6px,-24px)}75%{transform:translate(-12px,-9px)}}
@keyframes fireTwinkle{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes mistDrift{0%{transform:translateX(-8%)}100%{transform:translateX(8%)}}

.hero-scene{position:absolute;inset:0;pointer-events:none}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 64%;opacity:.92;background:#000}
.hero-veil{position:absolute;inset:0;
  background:linear-gradient(180deg,#000d 0%,#0008 20%,#0002 42%,#0003 68%,#000e 100%)}
.mist{position:absolute;width:150%;left:-25%;height:180px;filter:blur(34px);opacity:.5}
.m1{top:28%;background:radial-gradient(50% 60% at 50% 50%, #7fd8c81a, transparent 70%);
  animation:mistDrift 26s ease-in-out infinite alternate}
.m2{top:58%;background:radial-gradient(50% 60% at 40% 50%, ${C.laiton}14, transparent 70%);
  animation:mistDrift 34s ease-in-out 4s infinite alternate-reverse}
.water{position:absolute;left:0;right:0;bottom:0;height:96px;
  background:linear-gradient(to bottom, transparent, #03120dcc 55%, #020c08)}
.water-glow{position:absolute;left:50%;bottom:6px;width:280px;height:56px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, ${C.laiton}30, transparent 70%);filter:blur(8px);
  animation:lotusBreathe 5.2s ease-in-out infinite}
.ripple{position:absolute;left:50%;bottom:26px;width:190px;height:34px;border:1.5px solid #d9c58a66;
  border-radius:50%;transform:translateX(-50%) scale(.12);opacity:0;animation:rippleOut 5.2s ease-out infinite}
.rp2{animation-delay:1.7s;border-color:#7fd8c84d}
.rp3{animation-delay:3.4s}
.drop{position:absolute;left:50%;top:56%;width:3.5px;height:9px;margin-left:-2px;border-radius:50% 50% 60% 60%;
  background:linear-gradient(#fff3cf,#c6a05b);box-shadow:0 0 8px #ffedb8aa;
  animation:dropFall 5.2s ease-in .2s infinite}
.fire{position:absolute;border-radius:50%;
  animation:fireDrift 9s ease-in-out infinite, fireTwinkle 3.4s ease-in-out infinite}
.ff1{left:12%;top:34%;width:4px;height:4px;background:#ffe9b0;box-shadow:0 0 10px 2px #ffe9b088}
.ff2{left:84%;top:30%;width:3px;height:3px;background:#7fd8c8;box-shadow:0 0 9px 2px #7fd8c877;animation-delay:1.2s,.6s}
.ff3{left:22%;top:66%;width:3px;height:3px;background:#ffe9b0;box-shadow:0 0 9px 2px #ffe9b077;animation-delay:2.4s,1.4s}
.ff4{left:74%;top:62%;width:4px;height:4px;background:#e8b7c8;box-shadow:0 0 10px 2px #e8b7c877;animation-delay:3.6s,2s}
.ff5{left:48%;top:24%;width:3px;height:3px;background:#7fd8c8;box-shadow:0 0 8px 2px #7fd8c866;animation-delay:4.8s,.9s}
.ff6{left:63%;top:44%;width:3px;height:3px;background:#ffe9b0;box-shadow:0 0 9px 2px #ffe9b066;animation-delay:6s,2.7s}
.topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lang-wrap{position:relative}

/* ---------- ZETME MONO-LOGO: tilla "Z" + harf-baharf kirib-chiquvchi "zetme" ---------- */
.zmark{position:relative;display:inline-flex;align-items:center;gap:7px;line-height:1}
.zmark-z{position:relative;z-index:2;font-family:${FONT_DISPLAY};font-weight:600;
  background:linear-gradient(155deg,${C.laitonHi},${C.laiton} 55%,${C.laitonLo});
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 6px ${C.laiton}55)}
.zmark-word{position:relative;z-index:2;display:inline-flex;font-family:${FONT_DISPLAY};letter-spacing:.5px}
.zmark-word em{font-style:normal;display:inline-block;opacity:0;color:${C.laitonHi};
  animation:zmarkLetter 4.6s ease-in-out infinite}
.zmark-glow{position:absolute;left:0;top:50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, ${C.laiton}40, transparent 70%);
  transform:translate(-30%,-50%);animation:zmarkGlow 4.6s ease-in-out infinite}
.zmark-sm .zmark-z{font-size:26px}
.zmark-sm .zmark-word em{font-size:14px}
.zmark-sm .zmark-glow{width:34px;height:34px}
.zmark-lg{gap:12px}
.zmark-lg .zmark-z{font-size:86px}
.zmark-lg .zmark-word em{font-size:26px}
.zmark-lg .zmark-glow{width:110px;height:110px}
@keyframes zmarkLetter{
  0%,100%{opacity:0;transform:translateY(5px)}
  18%,68%{opacity:1;transform:translateY(0)}
  86%{opacity:0;transform:translateY(-5px)}
}
@keyframes zmarkGlow{
  0%,100%{opacity:.35;transform:translate(-30%,-50%) scale(.9)}
  50%{opacity:.75;transform:translate(-30%,-50%) scale(1.15)}
}

/* ---------- HERO markazi: AI montaj o'chirilganda shu animatsiya turadi ---------- */
.hero-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:40px 20px 32px;min-height:190px}
.hc-ring{position:absolute;border-radius:50%;border:1px solid ${C.laiton}33;pointer-events:none;
  animation:hcPulse 5.5s ease-out infinite}
.hc-r1{width:150px;height:150px}
.hc-r2{width:150px;height:150px;animation-delay:1.8s}
@keyframes hcPulse{
  0%{opacity:.55;transform:scale(.8)}
  100%{opacity:0;transform:scale(1.9)}
}
.hc-soon{position:relative;z-index:2;max-width:280px;text-align:center;font-size:12.5px;
  line-height:1.6;color:${C.ivoireDim};font-family:${FONT_BODY};margin:0}
.prof-entry{display:flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid ${C.line};border-radius:20px;
  padding:4px 10px 4px 4px;cursor:pointer}
.prof-entry-ring{width:22px;height:22px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;background:#0c261e}
.prof-entry-tok{display:flex;align-items:center;gap:3px;font-size:11px;color:${C.ivoire};font-family:${FONT_BODY}}

.lang-btn{display:flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid ${C.line};color:${C.ivoire};
  border-radius:20px;padding:6px 12px;font-size:12px;font-family:${FONT_BODY};cursor:pointer}
.lang-menu{position:absolute;top:36px;right:0;background:${C.vert};border:1px solid ${C.line};border-radius:12px;
  padding:6px;min-width:140px;z-index:20;box-shadow:0 10px 30px #0008}
.lang-item{display:flex;justify-content:space-between;width:100%;background:transparent;border:none;color:${C.ivoire};
  padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:${FONT_BODY}}
.lang-item:disabled{color:${C.ivoireDim};cursor:not-allowed}
.lang-item:not(:disabled):hover{background:#ffffff10}
.soon{font-size:10px;color:${C.laiton}}

.eyebrow{position:relative;z-index:2;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:${C.laiton};text-align:center;margin:10px 0 6px}
.htitle{position:relative;z-index:2;font-family:${FONT_DISPLAY};font-weight:500;text-align:center;font-size:clamp(30px,7.6vw,42px);
  margin:0 0 10px;line-height:1.08;text-shadow:0 2px 24px #0006}
.htitle em{font-style:italic;color:${C.laitonHi};
  background:linear-gradient(90deg,${C.laiton},${C.laitonHi} 30%,#fff6dc 50%,${C.laitonHi} 70%,${C.laiton});
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:emShimmer 5s linear infinite}
.h-ornament{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 20px}
.h-line{display:block;width:52px;height:1px;background:linear-gradient(90deg,transparent,${C.laitonLo});}
.h-ornament .h-line:last-child{background:linear-gradient(90deg,${C.laitonLo},transparent)}

.genrow{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.plus-sep{width:26px;height:26px;border-radius:20px;background:#ffffff10;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.genslot{width:150px}
.genslot-box{position:relative;height:150px;border:1.5px dashed ${C.line};border-radius:18px;
  background:linear-gradient(160deg,#ffffff0a,#0c261ecc);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:inset 0 1px 0 #ffffff10, 0 10px 30px #0005;
  animation:slotBreathe 5s ease-in-out infinite;transition:transform .3s,border-color .3s}
.genslot-box:hover{transform:translateY(-3px);border-color:${C.laitonLo}}
.genslot-empty svg{animation:icFloat 3.4s ease-in-out infinite}
.genslot-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:${C.ivoireDim};font-size:12px;text-align:center;padding:0 8px}
.genslot-fill{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center;padding:0 8px;font-weight:600}
.genslot-img{width:100%;height:100%;object-fit:cover}
.genslot-plus{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:20px;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px #0006}
.src-menu{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:210px;background:${C.vert};
  border:1px solid ${C.line};border-radius:14px;padding:8px;z-index:30;box-shadow:0 14px 40px #000a}
.src-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;padding:8px;border-radius:10px;cursor:pointer;text-align:left}
.src-item:hover{background:#ffffff0d}
.src-ic{width:32px;height:32px;border-radius:10px;border:1px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.gen-cta{position:relative;z-index:2;display:flex;margin:0 auto;align-items:center;gap:9px;overflow:hidden;
  background:linear-gradient(120deg,${C.laitonHi},${C.laiton});color:${C.noir};border:none;border-radius:40px;
  padding:14px 30px;font-weight:600;font-size:14.5px;font-family:${FONT_BODY};cursor:pointer;
  box-shadow:0 10px 28px ${C.laiton}44;transition:transform .25s,box-shadow .25s}
.gen-cta:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 14px 34px ${C.laiton}5c}
.gen-cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.cta-shine{position:absolute;top:-60%;left:0;width:34%;height:220%;pointer-events:none;
  background:linear-gradient(90deg,transparent,#ffffff66,transparent);animation:ctaSweep 4.5s ease-in-out 1.4s infinite}
.scrollhint{position:relative;z-index:2;display:flex;align-items:center;gap:7px;margin:22px auto 0;
  background:transparent;border:none;color:${C.ivoireDim};font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;
  font-family:${FONT_BODY};cursor:pointer}
.scrollhint:hover{color:${C.laitonHi}}
.sh-chev{display:inline-flex;animation:chevBounce 1.8s ease-in-out infinite}
.gen-result{position:relative;z-index:2;display:flex;align-items:center;gap:8px;justify-content:center;margin-top:14px;
  font-size:12.5px;color:${C.ivoireDim}}

/* ---------- STUDIYA: DO'KONLAR DEVORI ---------- */
@keyframes swRise{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes swFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes swShine{0%{transform:translateX(-140%) rotate(18deg)}55%{transform:translateX(240%) rotate(18deg)}100%{transform:translateX(240%) rotate(18deg)}}
@keyframes swGlow{0%,100%{opacity:.55;transform:translate(-50%,0) scale(1)}50%{opacity:.9;transform:translate(-50%,-8px) scale(1.08)}}
@keyframes swSkel{0%,100%{opacity:.35}50%{opacity:.7}}

.shopwall{position:relative;background:linear-gradient(180deg,${C.noir} 0%,${C.vert} 100%);color:${C.ivoire};
  padding:26px 16px 30px;overflow:hidden}
.sw-glow{position:absolute;top:-90px;left:50%;width:420px;height:260px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, ${C.laiton}22, transparent 70%);animation:swGlow 7s ease-in-out infinite}
.sw-inner{position:relative;z-index:2;max-width:1100px;margin:0 auto}
.sw-eyebrow{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:${C.laiton};text-align:center;margin:0 0 4px;
  animation:swFade .6s ease both}
.sw-title{font-family:${FONT_DISPLAY};font-weight:500;font-size:clamp(24px,6vw,32px);text-align:center;margin:0 0 4px;
  animation:swFade .6s ease .06s both}
.sw-sub{font-size:12px;color:${C.ivoireDim};text-align:center;margin:0 0 18px;animation:swFade .6s ease .12s both}
.sw-empty{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:${C.ivoireDim};
  border:1px dashed ${C.line};border-radius:14px;padding:20px}

.sw-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.sw-tile{flex:0 1 clamp(112px,26vw,168px);max-width:168px;
  position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;cursor:pointer;padding:0;
  border:1px solid ${C.line};background:#0c261e;animation:swRise .62s cubic-bezier(.22,1,.36,1) both;
  transition:transform .32s cubic-bezier(.22,1,.36,1),border-color .32s,box-shadow .32s}
.sw-tile:hover,.sw-tile:focus-visible{transform:translateY(-6px);border-color:${C.laitonLo};
  box-shadow:0 16px 34px #0009,0 0 0 1px ${C.laiton}33;outline:none}
.sw-tile:active{transform:translateY(-2px) scale(.985)}
.sw-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,${C.vertLo},${C.noir})}
.sw-img img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.sw-tile:hover .sw-img img{transform:scale(1.09)}
.sw-letter{font-family:${FONT_DISPLAY};font-size:40px;color:${C.laiton};opacity:.7}
.sw-veil{position:absolute;inset:0;background:linear-gradient(to top,#000000cc 0%,#00000055 34%,transparent 62%)}
.sw-shine{position:absolute;top:-60%;left:0;width:42%;height:220%;pointer-events:none;
  background:linear-gradient(90deg,transparent,#ffffff26,transparent);transform:translateX(-140%) rotate(18deg)}
.sw-tile:hover .sw-shine{animation:swShine 1.05s ease-out}
.sw-name{position:absolute;left:9px;right:9px;bottom:9px;display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;color:${C.ivoire};text-shadow:0 1px 6px #000c;text-align:left;line-height:1.25}
.sw-name span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sw-count{position:absolute;top:8px;left:8px;min-width:20px;height:20px;padding:0 6px;border-radius:20px;
  background:#0b211bcc;border:1px solid ${C.line};color:${C.laitonHi};font-size:10.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.sw-bonus{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:20px;background:${C.laiton};
  color:${C.noir};font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sw-skel{background:linear-gradient(150deg,${C.vertLo},${C.noir});animation:swSkel 1.4s ease-in-out infinite}

/* ---------- STUDIYA: ZETME AI HAQIDA ---------- */
.about{background:linear-gradient(180deg,${C.vert} 0%,${C.noir} 100%);color:${C.ivoire};padding:30px 16px 84px;
  border-top:1px solid ${C.line}}
.ab-inner{max-width:1100px;margin:0 auto}
.ab-title{font-family:${FONT_DISPLAY};font-weight:500;font-size:clamp(24px,6.2vw,34px);text-align:center;margin:0 0 10px;
  animation:swFade .6s ease .06s both}
.ab-title em{font-style:italic;color:${C.laitonHi}}
.ab-lead{max-width:620px;margin:0 auto 22px;text-align:center;font-size:13.5px;line-height:1.7;color:${C.ivoireDim};
  animation:swFade .6s ease .12s both}
.ab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.ab-card{background:#ffffff08;border:1px solid ${C.line};border-radius:16px;padding:16px 15px;
  animation:swFade .65s cubic-bezier(.22,1,.36,1) both;transition:transform .3s,border-color .3s,background .3s}
.ab-card:hover{transform:translateY(-4px);border-color:${C.laitonLo};background:#ffffff0d}
.ab-ic{width:38px;height:38px;border-radius:12px;border:1px solid ${C.laitonLo}66;background:#0c261e;
  display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.ab-ct{font-size:14px;font-weight:600;margin-bottom:5px;color:${C.ivoire}}
.ab-cd{font-size:12.5px;line-height:1.6;color:${C.ivoireDim}}
.ab-stats{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px;
  animation:swFade .7s ease .5s both}
.ab-stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.ab-stat b{font-family:${FONT_DISPLAY};font-size:26px;font-weight:600;color:${C.laitonHi};line-height:1}
.ab-stat span{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:${C.ivoireDim}}
.ab-stat-sep{width:1px;height:28px;background:${C.line}}

@media (prefers-reduced-motion: reduce){
  .rv,.hero-glow,.petal,.htitle em,.cta-shine,.sh-chev,.genslot-box,.genslot-empty svg,
  .lotus-g,.ripple,.drop,.fire,.mist,.water-glow{animation:none!important}
  .ripple,.drop{opacity:0}
  .rv{opacity:1;transform:none}
  .sw-tile,.ab-card,.sw-eyebrow,.sw-title,.sw-sub,.ab-title,.ab-lead,.ab-stats,.sw-glow{animation:none!important}
  .sw-tile:hover .sw-shine{animation:none}
  .sw-tile,.ab-card{opacity:1;transform:none}
}

/* ---------- MARKETPLACE ---------- */
.market{padding:20px 16px 10px;max-width:1100px;margin:0 auto}
.market-full{min-height:100dvh;padding-bottom:90px;background:${C.paper};animation:swFade .35s ease both}
.market-fullhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.market-back{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid ${C.mline};
  border-radius:20px;padding:7px 13px 7px 10px;font-size:12px;font-weight:600;color:${C.inkDim};
  cursor:pointer;font-family:${FONT_BODY}}
.market-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.market-title{font-family:${FONT_DISPLAY};font-size:24px;color:${C.ink};margin:0;font-weight:600}
.market-sub{font-size:12px;color:${C.inkDim}}
.market-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.market-optnote{font-size:11px;color:${C.laitonLo};font-weight:600}
.market-state{font-size:13px;color:${C.inkDim};background:${C.card};border:1px solid ${C.mline};border-radius:12px;padding:18px;text-align:center}
.market-state.err{color:${C.sale}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}

/* ---------- MARKET: do'konlar ro'yxati (1-qadam) ---------- */
.market-hint{font-size:12.5px;color:${C.inkDim};margin:0 0 14px}
.mshop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mshop-card{text-align:left;padding:0;background:${C.card};border:1px solid ${C.mline};border-radius:16px;overflow:hidden;
  cursor:pointer;font-family:inherit;animation:swFade .5s cubic-bezier(.22,1,.36,1) both;
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s}
.mshop-card:hover{transform:translateY(-4px);border-color:${C.laiton};box-shadow:0 12px 26px rgba(11,33,27,.12)}
.mshop-img{position:relative;aspect-ratio:1/1;background:linear-gradient(150deg,#eef1ec,#e2e8e1);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.mshop-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.mshop-card:hover .mshop-img img{transform:scale(1.07)}
.mshop-letter{font-family:${FONT_DISPLAY};font-size:42px;color:${C.laitonLo};opacity:.6}
.mshop-star{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:20px;background:${C.laiton};
  color:${C.noir};font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mshop-body{padding:10px 12px 12px}
.mshop-name{font-weight:600;font-size:14px;color:${C.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mshop-count{display:flex;align-items:center;gap:2px;font-size:11.5px;color:${C.inkDim};margin-top:2px}

/* ---------- MARKET: do'kon ichi (2-qadam) ---------- */
.shopback{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid ${C.mline};
  color:${C.inkDim};border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:pointer;margin-bottom:12px}
.shopback:hover{border-color:${C.ink};color:${C.ink}}
.shophead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shophead-img{width:56px;height:56px;flex-shrink:0;border-radius:16px;overflow:hidden;border:1px solid ${C.mline};
  background:linear-gradient(150deg,#eef1ec,#e2e8e1);display:flex;align-items:center;justify-content:center}
.shophead-img img{width:100%;height:100%;object-fit:cover}
.shophead-name{font-family:${FONT_DISPLAY};font-size:23px;font-weight:600;color:${C.ink};margin:0;line-height:1.1}
.shophead-meta{font-size:12px;color:${C.inkDim};margin-top:2px}
.secchips{position:sticky;top:0;z-index:25;display:flex;gap:7px;overflow-x:auto;padding:10px 2px;margin:0 -2px 6px;
  background:linear-gradient(${C.paper} 88%,transparent);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.secchips::-webkit-scrollbar{display:none}
.secchip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;border:1px solid ${C.mline};background:${C.card};
  color:${C.ink};border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.secchip:hover{border-color:${C.laiton}}
.secchip span{font-size:10.5px;color:${C.laitonLo};font-weight:700}
.secblock{scroll-margin-top:52px}
.sec-title{display:flex;align-items:baseline;gap:7px;font-family:${FONT_DISPLAY};font-size:20px;font-weight:600;
  color:${C.ink};margin:18px 0 10px}
.sec-count{font-family:${FONT_BODY};font-size:11px;font-weight:600;color:${C.laitonLo}}
.pcard{background:${C.card};border:1px solid ${C.mline};border-radius:14px;padding:10px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;font-family:${FONT_BODY}}
.pcard-shop{display:inline-flex;align-items:center;gap:4px;background:transparent;border:none;padding:0;
  font-size:10.5px;font-weight:700;color:${C.laitonLo};cursor:pointer;font-family:${FONT_BODY};text-align:left}
.pcard-shop:hover{text-decoration:underline}
.pcard-img{background:${C.paper};border-radius:10px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pcard-name{font-size:12.5px;font-weight:600;color:${C.ink};line-height:1.3}
.pcard-meta{font-size:11px;color:${C.inkDim}}
.pcard-price{font-size:13.5px;font-weight:700;color:${C.price};margin-top:2px}

/* ---------- kategoriya chiplari + do'kon banneri ---------- */
.catchips{display:inline-flex;gap:6px}
.catchip{border:1px solid ${C.mline};background:${C.card};color:${C.inkDim};border-radius:20px;padding:6px 12px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:${FONT_BODY}}
.catchip.active{border-color:${C.ink};background:${C.ink};color:#fff}
.shopbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FCF3E2;
  border:1px solid #EFD9A8;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:${C.laitonLo}}
.shopbanner span{display:flex;align-items:center;gap:7px}
.shopbanner button{display:flex;align-items:center;gap:4px;background:transparent;border:1px solid ${C.laitonLo};

/* ============ KUN/TUN gul tugmasi — gul ochiladi (kun), g'uncha yumiladi (tun) ============ */
.bloom-toggle{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid #C6A05B66;cursor:pointer;
  overflow:hidden;padding:0;background:transparent;flex:0 0 auto;transition:box-shadow .5s,transform .3s}
.bloom-toggle:active{transform:scale(.92)}
.bt-day{box-shadow:0 0 14px #E7D3A045}
.bt-night{box-shadow:0 0 14px #4A6E8A40}
.bt-sky{position:absolute;inset:0;border-radius:50%;transition:background .9s ease}
.bt-day .bt-sky{background:radial-gradient(circle at 50% 40%,#F7E7B8 0%,#E4C377 50%,#B98F44 100%)}
.bt-night .bt-sky{background:radial-gradient(circle at 64% 30%,#27455C 0%,#0E2233 55%,#081420 100%)}
.bt-flower{position:absolute;inset:4px;width:30px;height:30px}
.bt-rays{transform-origin:20px 20px}
.bt-day .bt-rays{animation:btSpin 16s linear infinite}
.bt-rays line{stroke:#8A5F1E;stroke-width:1.5;stroke-linecap:round;transition:opacity .5s}
.bt-night .bt-rays line{opacity:0}
.bt-petals{transform-origin:20px 20px;transition:transform .9s cubic-bezier(.68,-.15,.32,1.15),opacity .55s ease}
.bt-night .bt-petals{transform:scale(.12) rotate(80deg);opacity:0}
.bt-petal{fill:#E7A8BE;stroke:#C87897;stroke-width:.5}
.bt-core{fill:#F0D48A;stroke:#B98F44;stroke-width:.6;transform-origin:20px 20px;transition:transform .8s,fill .8s}
.bt-night .bt-core{fill:#3E5A4C;transform:scale(.7)}
.bt-moon{fill:#EAD9A8;opacity:0;transform:translate(5px,-4px) scale(.5) rotate(-30deg);transform-origin:20px 20px;
  transition:opacity .7s ease .15s,transform .9s cubic-bezier(.65,0,.35,1)}
.bt-night .bt-moon{opacity:1;transform:none}
.bt-star{fill:#EAD9A8;opacity:0;transition:opacity .6s}
.bt-night .bt-star{animation:btTwinkle 2.6s ease-in-out infinite}
.bt-night .bs1{opacity:.9}
.bt-night .bs2{opacity:.7;animation-delay:.9s}
.bt-night .bs3{opacity:.6;animation-delay:1.6s}
@keyframes btSpin{to{transform:rotate(360deg)}}
@keyframes btTwinkle{0%,100%{opacity:.25}50%{opacity:.95}}

/* ============ UZ/RU — oltin barg slayder + gulbarg portlashi ============ */
.lang-petal{position:relative;display:flex;align-items:center;width:76px;height:34px;border-radius:20px;
  border:1px solid #C6A05B80;background:#0B211B8C;backdrop-filter:blur(8px);cursor:pointer;padding:3px;flex:0 0 auto}
.lp-opt{flex:1;text-align:center;font-family:${FONT_BODY};font-size:11px;letter-spacing:.14em;font-weight:600;
  color:#F1ECDF59;transition:color .45s;position:relative;z-index:1}
.lp-opt.on{color:#0B211B}
.lp-knob{position:absolute;top:2px;left:3px;width:34px;height:28px;border-radius:15px;overflow:hidden;
  background:linear-gradient(135deg,#E7D3A0,#C6A05B);
  transition:transform .55s cubic-bezier(.65,0,.35,1);box-shadow:0 2px 10px #C6A05B73;z-index:0}
.lp-ru .lp-knob{transform:translateX(34px)}
.lp-leaf{position:absolute;top:-3px;left:7px;width:20px;height:34px;opacity:.26;fill:#0B211B;
  transition:transform .55s cubic-bezier(.65,0,.35,1)}
.lp-leaf .lp-vein{stroke:#0B211B;stroke-width:.7;fill:none;opacity:.55}
.lp-ru .lp-leaf{transform:rotate(180deg)}
.lp-burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:2}
.lp-burst i{position:absolute;left:-2.5px;top:-4px;width:5px;height:8px;background:#D98BA6;
  border-radius:60% 60% 60% 60% / 72% 72% 46% 46%;opacity:0;animation:lpBurst .75s ease-out forwards}
@keyframes lpBurst{
  0%{opacity:.95;transform:rotate(var(--a)) translateY(-4px) scale(.5)}
  100%{opacity:0;transform:rotate(var(--a)) translateY(-30px) scale(1.15)}
}

/* ============ Studiya: Qanday ishlaydi ============ */
.hiw{background:${C.vert};color:${C.ivoire};padding:30px 16px 26px;position:relative}
.hiw-inner{max-width:860px;margin:0 auto}
.hiw-lead{font-size:13px;line-height:1.65;color:${C.ivoireDim};text-align:center;max-width:560px;margin:10px auto 0}
.hiw-row{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
.hiw-step{position:relative;text-align:center;padding:16px 14px 18px;border:1px solid #C6A05B2E;border-radius:16px;
  background:linear-gradient(160deg,#FFFFFF08,#FFFFFF02);animation:swFade .6s ease both}
.hiw-num{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px}
.hiw-n{width:26px;height:26px;border-radius:50%;border:1px solid #C6A05B99;color:#E7D3A0;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;font-family:${FONT_DISPLAY};background:#C6A05B1A}
.hiw-t{font-family:${FONT_DISPLAY};font-size:17.5px;margin-bottom:5px;color:#F1ECDF}
.hiw-d{font-size:12.5px;line-height:1.55;color:${C.ivoireDim}}
@media (min-width:640px){
  .hiw-row{grid-template-columns:repeat(3,1fr)}
  .hiw-row4{grid-template-columns:repeat(4,1fr)}
}
.hiw-rules{position:relative;display:flex;gap:13px;align-items:flex-start;margin-top:24px;padding:18px 18px 20px;
  border:1px solid #C6A05B33;border-radius:16px;background:linear-gradient(160deg,#C6A05B12,#FFFFFF03)}
.hiw-rules-ic{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid #C6A05B55;background:#C6A05B1A;margin-top:1px}
.hiw-rules-t{font-family:${FONT_DISPLAY};font-size:16px;color:#F1ECDF;margin-bottom:5px}
.hiw-rules-d{font-size:12.5px;line-height:1.65;color:${C.ivoireDim};margin:0}

/* ============ Studiya: Ilhom galereyasi ============ */
.insp{background:linear-gradient(180deg,${C.vert} 0%,${C.noir} 60%);color:${C.ivoire};padding:28px 0 34px}
.insp-inner{max-width:860px;margin:0 auto;padding:0 16px}
.insp-sub{font-size:12px;color:${C.ivoireDim};text-align:center;margin:0 0 4px}
.insp-row{display:flex;gap:14px;overflow-x:auto;padding:18px 18px 10px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:flex-start}
.insp-row::-webkit-scrollbar{display:none}
.insp-card{position:relative;flex:0 0 200px;height:320px;margin:0;border-radius:18px;overflow:hidden;
  border:1px solid #C6A05B40;background:#000;scroll-snap-align:center;animation:swFade .7s ease both;
  box-shadow:0 14px 34px #00000066}
.insp-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.6,.2,1)}
.insp-card:hover img{transform:scale(1.07)}
.insp-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:4px;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:#E7D3A0;background:#0B211BB3;border:1px solid #C6A05B59;
  border-radius:20px;padding:3px 8px;backdrop-filter:blur(6px)}
.insp-card figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font-size:11.5px;color:#F1ECDF;
  background:linear-gradient(180deg,transparent,#000000C7 68%)}
@media (min-width:720px){
  .insp-row{justify-content:center}
  .insp-card{flex:0 0 220px;height:352px}
}
@media (prefers-reduced-motion: reduce){
  .bt-day .bt-rays{animation:none}
  .bt-night .bt-star{animation:none}
  .lp-burst i{animation:none}
  .insp-card img{transition:none}
}
