<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zetme AI — Admin</title>
<style>
  :root {
    --noir: #0B211B; --vert: #0F2E24; --ivoire: #F1ECDF; --ivoireDim: #B9C4B6;
    --laiton: #C6A05B; --laitonHi: #E7D3A0; --line: #2A4438;
    --paper: #F5F6F3; --ink: #16211B; --inkDim: #69756D; --mline: #E4E7E1; --accent: #2F6B4F;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Jost', system-ui, -apple-system, sans-serif; background: var(--paper); color: var(--ink); }
  .topbar { background: linear-gradient(120deg, var(--vert), var(--noir)); color: var(--ivoire); padding: 18px 20px; display:flex; align-items:center; justify-content:space-between; }
  .topbar b { font-family: Georgia, serif; font-size: 20px; }
  .topbar span { color: var(--laiton); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px 60px; }

  /* login gate */
  #gate { max-width: 340px; margin: 80px auto; text-align:center; }
  #gate input { width:100%; padding:12px 14px; border:1px solid var(--mline); border-radius:10px; font-size:15px; margin-top:14px; }
  #gate button { width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  #gate .err { color:#C6472E; font-size:12.5px; margin-top:10px; min-height:16px; }

  /* form */
  .card { background:#fff; border:1px solid var(--mline); border-radius:16px; padding:20px; margin-bottom:18px; }
  .card h3 { margin:0 0 14px; font-family: Georgia, serif; font-size:18px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card h3 .badge { font-size:11px; font-weight:600; padding:4px 9px; border-radius:99px; background:#EAF3EC; color:var(--accent); }
  .card h3 .badge.editing { background:#FCEFE2; color:#B5711A; }
  label { display:block; font-size:12.5px; color:var(--inkDim); margin:12px 0 5px; }
  label:first-of-type { margin-top:0; }
  input[type=text], input[type=number], select { width:100%; padding:10px 12px; border:1px solid var(--mline); border-radius:9px; font-size:14px; font-family:inherit; }
  .tabs { display:flex; gap:8px; margin-bottom:4px; }
  .tab { flex:1; padding:10px; border:1px solid var(--mline); border-radius:9px; text-align:center; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--inkDim); }
  .tab.active { background: var(--accent); color:#fff; border-color:var(--accent); }
  .submitbtn { width:100%; margin-top:18px; padding:13px; border:none; border-radius:11px; background:var(--accent); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; }
  .submitbtn:disabled { opacity:.5; cursor:not-allowed; }
  .cancelbtn { width:100%; margin-top:9px; padding:11px; border:1px solid var(--mline); border-radius:11px; background:transparent; color:var(--inkDim); font-weight:600; font-size:13.5px; cursor:pointer; }
  .msg { font-size:13px; margin-top:10px; padding:10px 12px; border-radius:9px; }
  .msg.ok { background:#EAF3EC; color:var(--accent); }
  .msg.err { background:#FBEFEA; color:#C6472E; }

  /* variants (litr) */
  .variantsWrap { display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  .variantRow { border:1.5px solid var(--mline); border-radius:12px; padding:12px; position:relative; background:var(--paper); }
  .variantRow .vhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .variantRow .vtitle { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; }
  .variantRow .removeBtn { background:transparent; border:none; color:#C6472E; font-size:13px; cursor:pointer; font-weight:600; padding:2px 6px; }
  .vfields { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .vfields .vf-row { display:flex; gap:8px; }
  .vfields .vf-row > div { flex:1; }
  .vimageslabel { font-size:11px; color:var(--inkDim); margin-bottom:6px; }
  .vimages { display:flex; gap:8px; }
  .vimgslot { width:64px; height:64px; flex-shrink:0; border:1.5px dashed var(--mline); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; background:#fff; font-size:10px; color:var(--inkDim); text-align:center; }
  .vimgslot.filled { border-style:solid; }
  .vimgslot img { width:100%; height:100%; object-fit:cover; }
  .addVariantBtn { width:100%; padding:11px; border:1.5px dashed var(--accent); border-radius:11px; background:transparent; color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer; margin-top:4px; }
  .addVariantBtn:disabled { opacity:.4; cursor:not-allowed; border-color:var(--inkDim); color:var(--inkDim); }
  .hint { font-size:11.5px; color:var(--inkDim); margin-top:6px; }

  /* list */
  .plist { display:flex; flex-direction:column; gap:10px; }
  .prow { display:flex; gap:12px; align-items:center; background:#fff; border:1px solid var(--mline); border-radius:12px; padding:10px; }
  .prow img { width:52px; height:52px; border-radius:8px; object-fit:cover; background:var(--paper); }
  .prow .info { flex:1; min-width:0; }
  .prow .name { font-weight:600; font-size:13.5px; }
  .prow .meta { font-size:11.5px; color:var(--inkDim); }
  .prow .price { font-weight:700; font-size:12.5px; white-space:nowrap; }
  .prow .btns { display:flex; flex-direction:column; gap:6px; }
  .prow button { background:transparent; border:1px solid var(--mline); border-radius:8px; padding:6px 10px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .prow .editBtn { color:var(--accent); border-color:var(--accent); }
  .prow .delBtn { color:#C6472E; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="gate">
  <div class="topbar" style="border-radius:14px; justify-content:center;"><b>ZETME <span>AI</span></b></div>
  <p style="color:var(--inkDim); font-size:13.5px; margin-top:18px;">Admin panelga kirish uchun parolni kiriting</p>
  <input type="password" id="pwInput" placeholder="Parol" />
  <button onclick="tryLogin()">Kirish</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <b>ZETME <span>AI</span> — Admin</b>
    <button onclick="logout()" style="background:transparent;border:1px solid var(--line);color:var(--ivoire);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;">Chiqish</button>
  </div>
  <div class="wrap">

    <div class="card">
      <h3><span id="formTitle">Yangi mahsulot qo'shish</span> <span class="badge" id="modeBadge">yangi</span></h3>

      <label>Kategoriya</label>
      <div class="tabs">
        <div class="tab active" data-cat="tuvak" onclick="setCat('tuvak')">Tuvak</div>
        <div class="tab" data-cat="gul" onclick="setCat('gul')">Gul</div>
      </div>

      <label>Umumiy nomi (masalan: Gul tuvak rombik)</label>
      <input type="text" id="fName" placeholder="Gul tuvak rombik" />

      <label>Rang (ixtiyoriy)</label>
      <input type="text" id="fColor" placeholder="Oq" />

      <label style="margin-top:16px;">Hajm (litr) variantlari — har birida narxi va 3 tagacha rasmi bo'lishi mumkin (1 tadan 10 tagacha)</label>
      <div class="variantsWrap" id="variantsWrap"></div>
      <button type="button" class="addVariantBtn" id="addVariantBtn" onclick="addVariant()">+ Yana hajm (litr) qo'shish</button>
      <div class="hint" id="variantHint">Kamida 1 ta variant kifoya, kerak bo'lsa 10 tagacha qo'shishingiz mumkin. Har bir variantga 3 tagacha rasm qo'yish mumkin.</div>

      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFile(event)" />

      <button class="submitbtn" id="submitBtn" onclick="submitProduct()">Saqlash</button>
      <button class="cancelbtn hidden" id="cancelBtn" onclick="cancelEdit()">Bekor qilish (yangi mahsulotga qaytish)</button>
      <div id="formMsg"></div>
    </div>

    <div class="card">
      <h3>Hozirda sotuvda — hamma tuvaklar</h3>
      <div class="plist" id="plist"><p style="color:var(--inkDim); font-size:13px;">Yuklanmoqda...</p></div>
    </div>

  </div>
</div>

<script>
  let PASSWORD = "";
  let category = "tuvak";
  let productsCache = [];
  let editingId = null; // null = yangi mahsulot, aks holda tahrirlanayotgan mahsulot ID si

  // Har bir variant: { id, litr, price, size, images: [ {url, newImage}, {url, newImage}, {url, newImage} ] } — 3 ta doimiy slot
  const MAX_IMAGES = 3;
  let variants = [];
  let activeVariantIndex = null;
  let activeImageIndex = null;

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function escAttr(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

  function blankImageSlots() {
    return Array.from({ length: MAX_IMAGES }, () => ({ url: "", newImage: null }));
  }
  function blankVariant() {
    return { id: uid(), litr: "", price: "", size: "", images: blankImageSlots() };
  }

  function resetForm() {
    editingId = null;
    document.getElementById("formTitle").textContent = "Yangi mahsulot qo'shish";
    const badge = document.getElementById("modeBadge");
    badge.textContent = "yangi";
    badge.classList.remove("editing");
    document.getElementById("cancelBtn").classList.add("hidden");
    document.getElementById("submitBtn").textContent = "Saqlash";
    document.getElementById("fName").value = "";
    document.getElementById("fColor").value = "";
    setCat("tuvak");
    variants = [blankVariant()];
    renderVariants();
    document.getElementById("formMsg").innerHTML = "";
  }

  function setCat(c) {
    category = c;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.cat === c));
  }

  function addVariant() {
    if (variants.length >= 10) return;
    variants.push(blankVariant());
    renderVariants();
  }
  function removeVariant(idx) {
    if (variants.length <= 1) return;
    variants.splice(idx, 1);
    renderVariants();
  }

  function renderVariants() {
    const wrap = document.getElementById("variantsWrap");
    wrap.innerHTML = variants.map((v, vidx) => {
      const imagesHtml = v.images.map((img, iidx) => {
        const src = img.newImage ? img.newImage.dataUrl : img.url;
        const inner = src ? `<img src="${src}" />` : "+ Rasm";
        return `<div class="vimgslot ${src ? "filled" : ""}" onclick="pickVariantImage(${vidx}, ${iidx})">${inner}</div>`;
      }).join("");
      return `
        <div class="variantRow">
          <div class="vhead">
            <span class="vtitle">Variant ${vidx + 1}</span>
            <button type="button" class="removeBtn" onclick="removeVariant(${vidx})" ${variants.length <= 1 ? "style='visibility:hidden'" : ""}>✕ o'chirish</button>
          </div>
          <div class="vfields">
            <div class="vf-row">
              <div>
                <label style="margin:0 0 4px;">Litr</label>
                <input type="text" placeholder="0,5" value="${escAttr(v.litr)}" oninput="updateVariant(${vidx}, 'litr', this.value)" />
              </div>
              <div>
                <label style="margin:0 0 4px;">Narx (so'm)</label>
                <input type="number" placeholder="12850" value="${escAttr(v.price)}" oninput="updateVariant(${vidx}, 'price', this.value)" />
              </div>
            </div>
            <div>
              <label style="margin:0 0 4px;">O'lcham, sm (ixtiyoriy)</label>
              <input type="text" placeholder="Ø22.5 × 21" value="${escAttr(v.size)}" oninput="updateVariant(${vidx}, 'size', this.value)" />
            </div>
          </div>
          <div class="vimageslabel">Rasmlar (kamida 1 ta, 3 tagacha)</div>
          <div class="vimages">${imagesHtml}</div>
        </div>
      `;
    }).join("");

    document.getElementById("addVariantBtn").disabled = variants.length >= 10;
  }

  function updateVariant(idx, field, val) {
    variants[idx][field] = val;
  }

  function pickVariantImage(vidx, iidx) {
    activeVariantIndex = vidx;
    activeImageIndex = iidx;
    document.getElementById("fileInput").click();
  }
  function onFile(e) {
    const file = e.target.files[0];
    if (!file || activeVariantIndex === null || activeImageIndex === null) return;
    const reader = new FileReader();
    reader.onload = () => {
      variants[activeVariantIndex].images[activeImageIndex] = { url: "", newImage: { file, dataUrl: reader.result } };
      renderVariants();
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function tryLogin() {
    const pw = document.getElementById("pwInput").value;
    if (!pw) return;
    fetch("/api/verify-admin", { headers: { "x-admin-password": pw } })
      .then(r => r.json())
      .then(data => {
        if (!data.ok) {
          document.getElementById("loginErr").textContent = "Noto'g'ri parol";
          return;
        }
        PASSWORD = pw;
        document.getElementById("gate").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        sessionStorage.setItem("zetme_admin_pw", pw);
        resetForm();
        loadProducts();
      });
  }
  function logout() {
    sessionStorage.removeItem("zetme_admin_pw");
    location.reload();
  }
  window.addEventListener("DOMContentLoaded", () => {
    const saved = sessionStorage.getItem("zetme_admin_pw");
    if (saved) {
      fetch("/api/verify-admin", { headers: { "x-admin-password": saved } })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            PASSWORD = saved;
            document.getElementById("gate").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            resetForm();
            loadProducts();
          } else {
            sessionStorage.removeItem("zetme_admin_pw");
          }
        });
    }
  });

  async function uploadImage(imgObj) {
    const base64 = imgObj.dataUrl.split(",")[1];
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-password": PASSWORD },
      body: JSON.stringify({ filename: imgObj.file.name, contentType: imgObj.file.type, dataBase64: base64 }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Yuklashda xatolik");
    return data.url;
  }

  async function submitProduct() {
    const name = document.getElementById("fName").value.trim();
    const color = document.getElementById("fColor").value.trim();
    const msgEl = document.getElementById("formMsg");
    const btn = document.getElementById("submitBtn");

    if (!name) {
      msgEl.innerHTML = '<div class="msg err">Umumiy nomni kiriting</div>';
      return;
    }
    if (variants.length < 1) {
      msgEl.innerHTML = '<div class="msg err">Kamida 1 ta hajm (litr) varianti kerak</div>';
      return;
    }
    for (const v of variants) {
      if (!String(v.litr).trim()) {
        msgEl.innerHTML = '<div class="msg err">Har bir variant uchun litr (hajm) kiriting</div>';
        return;
      }
      if (!v.price || Number(v.price) <= 0) {
        msgEl.innerHTML = '<div class="msg err">Har bir variant uchun narx kiriting</div>';
        return;
      }
      const hasImage = v.images.some(img => img.newImage || img.url);
      if (!hasImage) {
        msgEl.innerHTML = '<div class="msg err">Har bir variant uchun kamida 1 ta rasm yuklang</div>';
        return;
      }
    }

    btn.disabled = true;
    msgEl.innerHTML = '<div class="msg ok">Saqlanmoqda…</div>';

    try {
      const outVariants = [];
      for (const v of variants) {
        const outImages = [];
        for (const img of v.images) {
          if (img.newImage) outImages.push(await uploadImage(img.newImage));
          else if (img.url) outImages.push(img.url);
        }
        outVariants.push({ id: v.id, litr: v.litr.trim(), price: Number(v.price), size: v.size.trim(), images: outImages });
      }

      const payload = { name, category, color, variants: outVariants };
      let res;
      if (editingId) {
        res = await fetch("/api/products", {
          method: "PUT",
          headers: { "Content-Type": "application/json", "x-admin-password": PASSWORD },
          body: JSON.stringify({ id: editingId, ...payload }),
        });
      } else {
        res = await fetch("/api/products", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-password": PASSWORD },
          body: JSON.stringify(payload),
        });
      }
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Xatolik");

      msgEl.innerHTML = `<div class="msg ok">✅ ${editingId ? "Mahsulot yangilandi!" : "Mahsulot qo'shildi!"}</div>`;
      resetForm();
      loadProducts();
    } catch (err) {
      msgEl.innerHTML = `<div class="msg err">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function cancelEdit() {
    resetForm();
  }

  function editProduct(id) {
    const p = productsCache.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById("formTitle").textContent = "Mahsulotni tahrirlash";
    const badge = document.getElementById("modeBadge");
    badge.textContent = "tahrirlash";
    badge.classList.add("editing");
    document.getElementById("cancelBtn").classList.remove("hidden");
    document.getElementById("submitBtn").textContent = "Yangilash";

    document.getElementById("fName").value = p.name || "";
    document.getElementById("fColor").value = p.color || "";
    setCat(p.category === "gul" ? "gul" : "tuvak");

    if (Array.isArray(p.variants) && p.variants.length > 0) {
      variants = p.variants.map(v => {
        const existingImages = Array.isArray(v.images) ? v.images.filter(Boolean) : (v.image ? [v.image] : []);
        const slots = blankImageSlots();
        existingImages.slice(0, MAX_IMAGES).forEach((url, i) => { slots[i] = { url, newImage: null }; });
        return {
          id: v.id || uid(),
          litr: v.litr || "",
          price: v.price || "",
          size: v.size || "",
          images: slots,
        };
      });
    } else {
      // Eski (litr-variantsiz) mahsulot — bitta variant sifatida ko'rsatamiz.
      const slots = blankImageSlots();
      if (p.images && p.images[0]) slots[0] = { url: p.images[0], newImage: null };
      variants = [{ id: uid(), litr: p.capacity || "", price: p.price || "", size: p.size || "", images: slots }];
    }
    renderVariants();
    document.getElementById("formMsg").innerHTML = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function priceRangeText(p) {
    if (!Array.isArray(p.variants) || p.variants.length === 0) {
      return p.price ? Number(p.price).toLocaleString("uz-UZ").replace(/,/g, " ") + " so'm" : "";
    }
    const prices = p.variants.map(v => Number(v.price)).filter(n => !isNaN(n));
    if (prices.length === 0) return "";
    const min = Math.min(...prices), max = Math.max(...prices);
    const f = n => n.toLocaleString("uz-UZ").replace(/,/g, " ");
    return min === max ? `${f(min)} so'm` : `${f(min)} – ${f(max)} so'm`;
  }
  function litrRangeText(p) {
    if (!Array.isArray(p.variants) || p.variants.length === 0) return p.capacity || "";
    const litrs = p.variants.map(v => v.litr).filter(Boolean);
    return `${litrs.join(", ")} L (${p.variants.length} variant)`;
  }
  function thumbUrl(p) {
    if (Array.isArray(p.variants) && p.variants[0]) {
      const v0 = p.variants[0];
      if (Array.isArray(v0.images) && v0.images[0]) return v0.images[0];
      if (v0.image) return v0.image;
    }
    return (p.images && p.images[0]) || "";
  }

  async function loadProducts() {
    const res = await fetch("/api/products");
    const data = await res.json();
    const list = document.getElementById("plist");
    if (!data.ok || data.products.length === 0) {
      productsCache = [];
      list.innerHTML = '<p style="color:var(--inkDim); font-size:13px;">Hali mahsulot yo\'q.</p>';
      return;
    }
    productsCache = data.products;
    list.innerHTML = data.products.map(p => `
      <div class="prow">
        <img src="${thumbUrl(p)}" />
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="meta">${p.category === 'gul' ? 'Gul' : 'Tuvak'}${p.color ? ' · ' + p.color : ''} · ${litrRangeText(p)}</div>
          <div class="price">${priceRangeText(p)}</div>
        </div>
        <div class="btns">
          <button class="editBtn" onclick="editProduct('${p.id}')">Tahrirlash</button>
          <button class="delBtn" onclick="deleteProduct('${p.id}')">O'chirish</button>
        </div>
      </div>
    `).join("");
  }

  async function deleteProduct(id) {
    if (!confirm("Bu mahsulotni butunlay o'chirasizmi?")) return;
    await fetch("/api/products?id=" + encodeURIComponent(id), {
      method: "DELETE",
      headers: { "x-admin-password": PASSWORD },
    });
    if (editingId === id) resetForm();
    loadProducts();
  }
</script>
</body>
</html>
