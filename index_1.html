<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B211B">
<meta name="description" content="Zetme AI — gulingizni tuvakda ko'ring. AI botanik studiya va gul tuvaklar katalogi.">
<title>Zetme AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600;700&display=swap">

<style>
:root{
  --noir:#0B211B; --vert:#0F2E24; --vertLo:#153A2E;
  --ivoire:#F1ECDF; --ivoireDim:#B9C4B6;
  --laiton:#C6A05B; --laitonLo:#9C7C3E; --laitonHi:#E7D3A0;
  --bloom:#D98BA6; --line:#2A4438;
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#16211B; --inkDim:#69756D;
  --mline:#E4E7E1; --accent:#2F6B4F; --sale:#C6472E;
  --display:'Cormorant Garamond',Georgia,serif;
  --body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  padding-bottom:78px;-webkit-font-smoothing:antialiased}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--laiton);outline-offset:2px}

/* ---------- HERO ---------- */
.hero{position:relative;background:radial-gradient(120% 100% at 50% 0%,var(--vert),var(--noir));
  color:var(--ivoire);padding:16px 18px 28px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%,#ffffff0d,transparent 60%)}
.topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px}
.brand-z{width:28px;height:28px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(140deg,var(--laitonHi),var(--laitonLo));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:19px;font-weight:600;color:var(--noir);line-height:1}
.brand-name{font-size:12.5px;letter-spacing:2.4px;font-weight:500;color:var(--ivoire)}
.topbar-right{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid var(--line);
  color:var(--ivoire);border-radius:20px;padding:5px 11px;font-size:11.5px;cursor:pointer}
.chip:hover{background:#ffffff1c}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--laiton);background:#0c261e;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--laiton)}

.eyebrow{position:relative;z-index:2;font-size:10.5px;letter-spacing:3.2px;text-transform:uppercase;
  color:var(--laiton);text-align:center;margin:6px 0 2px}
h1.htitle{position:relative;z-index:2;font-family:var(--display);font-weight:500;text-align:center;
  font-size:clamp(29px,7.5vw,40px);margin:0 0 20px;line-height:1.06;text-wrap:balance}
h1.htitle em{font-style:italic;color:var(--laitonHi)}

.genrow{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.plus-sep{width:26px;height:26px;border-radius:20px;background:#ffffff12;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--laiton);font-size:15px}
.slot{width:min(150px,38vw);height:min(150px,38vw);border:1.5px dashed var(--line);border-radius:16px;
  background:#0c261e;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;color:var(--ivoireDim);font-size:12px;cursor:pointer;
  overflow:hidden;padding:0 8px;text-align:center;transition:border-color .2s}
.slot:hover{border-color:var(--laitonLo)}
.slot.filled{border-style:solid}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot-ic{font-size:22px;line-height:1}
.slot-plus{position:absolute;bottom:8px;right:8px;width:29px;height:29px;border-radius:20px;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
  color:var(--noir);box-shadow:0 4px 12px #0006}

.gen-cta{position:relative;z-index:2;display:flex;margin:0 auto;align-items:center;gap:9px;
  background:linear-gradient(120deg,var(--laitonHi),var(--laiton));color:var(--noir);border:none;
  border-radius:40px;padding:13px 28px;font-weight:600;font-size:14.5px;cursor:pointer}
.gen-cta:disabled{opacity:.38;cursor:not-allowed}
.gen-note{position:relative;z-index:2;text-align:center;margin-top:13px;font-size:12px;color:var(--ivoireDim)}

/* ---------- MARKET ---------- */
.market{padding:22px 16px 8px}
.market-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.market-title{font-family:var(--display);font-size:25px;margin:0;font-weight:600}
.market-sub{font-size:12px;color:var(--inkDim);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.pcard{background:var(--card);border:1px solid var(--mline);border-radius:14px;padding:10px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:box-shadow .18s,transform .18s}
.pcard:hover{box-shadow:0 6px 20px #16211b14;transform:translateY(-2px)}
.pcard-img{background:var(--paper);border-radius:10px;aspect-ratio:1;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:34px}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pcard-name{font-size:12.5px;font-weight:600;line-height:1.3}
.pcard-meta{font-size:11px;color:var(--inkDim)}
.pcard-price{font-size:13.5px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.state{grid-column:1/-1;text-align:center;padding:38px 14px;color:var(--inkDim);font-size:13.5px;
  background:var(--card);border:1px dashed var(--mline);border-radius:14px}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--mline);
  display:flex;z-index:15;padding:7px 0 9px}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;
  color:var(--inkDim);font-size:10.5px;cursor:pointer;position:relative}
.bn.active{color:var(--accent);font-weight:600}
.bn-ic{font-size:17px;line-height:1}
.bn-badge{position:absolute;top:-3px;right:calc(50% - 19px);background:var(--sale);color:#fff;font-size:9px;
  border-radius:20px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ---------- OVERLAYS ---------- */
.ov{position:fixed;inset:0;background:#0b211b70;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{position:relative;background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;animation:up .28s ease both}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pcard{transition:none}}
.x{position:absolute;top:12px;right:12px;background:var(--paper);border:1px solid var(--mline);
  border-radius:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:3;font-size:15px;color:var(--ink)}

.pm-hero{aspect-ratio:1.4;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.pm-hero img{width:100%;height:100%;object-fit:cover}
.pm-body{padding:18px 20px 24px}
.pm-title{font-family:var(--display);font-size:23px;margin:0 0 8px}
.pm-price{font-size:20px;font-weight:700;margin-bottom:14px;font-variant-numeric:tabular-nums}
.pm-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pm-specs div{background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.pm-specs span{display:block;font-size:10px;color:var(--inkDim)}
.pm-specs b{font-size:12px}
.tierchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tierchip{font-size:10.5px;background:#EAF3EC;color:var(--accent);padding:4px 9px;border-radius:20px;font-weight:600}
.qtyrow{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px}
.qtyrow button{width:34px;height:34px;border-radius:10px;border:1px solid var(--mline);background:var(--paper);
  cursor:pointer;font-size:16px;color:var(--ink)}
.qtyrow span{font-size:16px;font-weight:600;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:14px;
  font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-ghost{width:100%;background:transparent;border:1px solid var(--laitonLo);color:var(--laitonLo);
  border-radius:14px;padding:12px;font-weight:600;font-size:13px;cursor:pointer;margin-top:8px}

.cartpad{padding:18px 18px 22px}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cart-head h2{font-family:var(--display);font-size:21px;margin:0;font-weight:600}
.cart-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cart-thumb{width:46px;height:46px;background:var(--paper);border-radius:10px;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.cart-thumb img{width:100%;height:100%;object-fit:cover}
.mini{display:flex;align-items:center;gap:8px}
.mini button{width:24px;height:24px;border-radius:7px;border:1px solid var(--mline);background:var(--paper);
  cursor:pointer;font-size:12px;color:var(--ink)}
.mini span{font-size:13px;font-weight:600;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.cart-tier{background:#EAF3EC;color:var(--accent);font-size:12px;font-weight:600;border-radius:10px;
  padding:9px 12px;margin-bottom:10px}
.cart-totals{border-top:1px dashed var(--mline);padding-top:11px;margin-bottom:14px}
.cart-sub{display:flex;justify-content:space-between;color:var(--inkDim);font-size:12.5px;margin-bottom:4px}
.cart-total{display:flex;justify-content:space-between;font-size:17px;font-variant-numeric:tabular-nums}
.cart-total b{font-weight:700}
.minwarn{display:flex;gap:10px;align-items:flex-start;background:#FBEFEA;color:var(--sale);
  border-radius:12px;padding:12px 14px;font-size:12.5px}
.empty{text-align:center;color:var(--inkDim);font-size:13.5px;padding:34px 10px}

</style>
</head>
<body>


<section class="hero">
  <header class="topbar">
    <div class="brand">
      <div class="brand-z">Z</div>
      <div class="brand-name">ZETME AI</div>
    </div>
    <div class="topbar-right">
      <button class="chip" type="button"><span class="dot">◆</span> 2</button>
      <button class="chip" type="button">UZ</button>
    </div>
  </header>

  <p class="eyebrow">AI botanik studiya</p>
  <h1 class="htitle">Gulingizni <em>tuvakda</em> ko'ring</h1>

  <div class="genrow">
    <div class="slot" id="slotFlower">
      <span class="slot-ic">✿</span><span>Gul rasmi</span>
      <button class="slot-plus" style="background:var(--bloom)" type="button" aria-label="Gul qo'shish">+</button>
    </div>
    <div class="plus-sep">+</div>
    <div class="slot" id="slotPot">
      <span class="slot-ic">🪴</span><span>Tuvak rasmi</span>
      <button class="slot-plus" style="background:var(--laiton)" type="button" aria-label="Tuvak qo'shish">+</button>
    </div>
  </div>

  <button class="gen-cta" id="genBtn" disabled>✦ Generatsiya qilish</button>
  <p class="gen-note" id="genNote">Ikkala rasmni tanlang — keyin generatsiya faollashadi</p>
</section>

<section class="market">
  <div class="market-head">
    <h2 class="market-title">Tuvaklar</h2>
    <span class="market-sub" id="count">yuklanmoqda…</span>
  </div>
  <div class="grid" id="grid">
    <div class="state">Katalog yuklanmoqda…</div>
  </div>
</section>

<nav class="bottomnav">
  <button class="bn active" type="button"><span class="bn-ic">✦</span><span>Studiya</span></button>
  <button class="bn" type="button" id="navShop"><span class="bn-ic">🪴</span><span>Tuvaklar</span></button>
  <button class="bn" type="button" id="navCart"><span class="bn-ic">🛍</span><span id="cartBadgeWrap"></span><span>Savat</span></button>
  <button class="bn" type="button"><span class="bn-ic">☺</span><span>Profil</span></button>
</nav>

<div class="ov" id="pmOv" hidden>
  <div class="sheet" id="pmSheet"></div>
</div>

<div class="ov" id="cartOv" hidden>
  <div class="sheet"><div class="cartpad" id="cartBody"></div></div>
</div>

<script>
const API = "/api/products";
const BOT = "zetmeai_bot";
const MIN_ORDER = 200000;
const TIERS = [
  {min:1, mult:1.00, label:"Dona narx"},
  {min:3, mult:0.93, label:"3+ dona: −7%"},
  {min:6, mult:0.86, label:"6+ dona: −14%"},
  {min:10, mult:0.78, label:"10+ dona: −22%"},
];
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/ /g," ") + " so'm";
const tierFor = q => TIERS.reduce((a,t)=> q>=t.min ? t : a, TIERS[0]);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let PRODUCTS = [];
let cart = [];

/* ---- catalog ---- */
function thumb(p, size){
  return p.images && p.images[0]
    ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy">`
    : "🪴";
}
async function load(){
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  try{
    const r = await fetch(API, {cache:"no-store"});
    const d = await r.json();
    PRODUCTS = (d.products || []).filter(p => p.category !== "gul");
    if(!PRODUCTS.length){
      grid.innerHTML = `<div class="state">Hali mahsulot qo'shilmagan.<br>Admin paneldan qo'shing.</div>`;
      count.textContent = "0 ta mahsulot";
      return;
    }
    count.textContent = PRODUCTS.length + " ta mahsulot";
    grid.innerHTML = PRODUCTS.map((p,i)=>`
      <button class="pcard" data-i="${i}" type="button">
        <div class="pcard-img">${thumb(p)}</div>
        <div class="pcard-name">${esc(p.name)}</div>
        <div class="pcard-meta">${esc([p.capacity,p.color].filter(Boolean).join(" · ")) || "&nbsp;"}</div>
        <div class="pcard-price">${fmt(p.price)}</div>
      </button>`).join("");
    grid.querySelectorAll(".pcard").forEach(b =>
      b.addEventListener("click", ()=> openProduct(PRODUCTS[+b.dataset.i])));
  }catch(e){
    grid.innerHTML = `<div class="state">Katalogni yuklab bo'lmadi.<br>Internetni tekshiring.</div>`;
    count.textContent = "—";
  }
}

/* ---- product sheet ---- */
let pmQty = 1, pmProduct = null;
function openProduct(p){
  pmProduct = p; pmQty = 1;
  renderProduct();
  document.getElementById("pmOv").hidden = false;
}
function renderProduct(){
  const p = pmProduct;
  document.getElementById("pmSheet").innerHTML = `
    <button class="x" type="button" id="pmX" aria-label="Yopish">✕</button>
    <div class="pm-hero">${thumb(p)}</div>
    <div class="pm-body">
      <h3 class="pm-title">${esc(p.name)}</h3>
      <div class="pm-price">${fmt(p.price)}</div>
      <div class="pm-specs">
        <div><span>Sig'imi</span><b>${esc(p.capacity||"—")}</b></div>
        <div><span>O'lcham</span><b>${esc(p.size||"—")}</b></div>
        <div><span>Rang</span><b>${esc(p.color||"—")}</b></div>
      </div>
      <div class="tierchips">${TIERS.slice(1).map(t=>`<span class="tierchip">${t.label}</span>`).join("")}</div>
      <div class="qtyrow">
        <button type="button" id="qMinus" aria-label="Kamaytirish">−</button>
        <span id="qVal">${pmQty}</span>
        <button type="button" id="qPlus" aria-label="Ko'paytirish">+</button>
      </div>
      <button class="btn-primary" id="pmAdd" type="button">🛍 Savatga qo'shish — ${fmt(p.price*pmQty)}</button>
      <button class="btn-ghost" type="button">✦ Shu tuvakka gulni AI bilan moslab ko'rish</button>
    </div>`;
  document.getElementById("pmX").onclick = closeProduct;
  document.getElementById("qMinus").onclick = ()=>{ pmQty=Math.max(1,pmQty-1); renderProduct(); };
  document.getElementById("qPlus").onclick  = ()=>{ pmQty++; renderProduct(); };
  document.getElementById("pmAdd").onclick  = ()=>{ addToCart(p,pmQty); closeProduct(); };
}
function closeProduct(){ document.getElementById("pmOv").hidden = true; }

/* ---- cart ---- */
function addToCart(p,q){
  const ex = cart.find(i=>i.id===p.id);
  if(ex) ex.qty += q; else cart.push({...p, qty:q});
  renderBadge();
}
function changeQty(id,d){
  const it = cart.find(i=>i.id===id);
  if(!it) return;
  it.qty += d;
  if(it.qty<=0) cart = cart.filter(i=>i.id!==id);
  renderBadge(); renderCart();
}
function renderBadge(){
  const n = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById("cartBadgeWrap").innerHTML = n ? `<span class="bn-badge">${n}</span>` : "";
}
function renderCart(){
  const body = document.getElementById("cartBody");
  const head = `<div class="cart-head"><h2>Savat</h2>
      <button class="x" type="button" id="cX" style="position:static" aria-label="Yopish">✕</button></div>`;
  if(!cart.length){
    body.innerHTML = head + `<div class="empty">Savat bo'sh.<br>Tuvaklar bo'limidan mahsulot qo'shing.</div>`;
    document.getElementById("cX").onclick = closeCart;
    return;
  }
  const totalQty = cart.reduce((s,i)=>s+i.qty,0);
  const tier = tierFor(totalQty);
  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const total = subtotal * tier.mult;
  const ok = total >= MIN_ORDER;

  body.innerHTML = head +
    cart.map(i=>`
      <div class="cart-row">
        <div class="cart-thumb">${thumb(i)}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:13.5px">${esc(i.name)}</div>
          <div style="font-size:12px;color:var(--inkDim)">${fmt(i.price)}</div>
        </div>
        <div class="mini">
          <button type="button" data-m="${esc(i.id)}">−</button>
          <span>${i.qty}</span>
          <button type="button" data-p="${esc(i.id)}">+</button>
        </div>
      </div>`).join("") +
    (tier.mult<1 ? `<div class="cart-tier">🎉 ${tier.label} qo'llanildi — ${totalQty} dona uchun</div>` : "") +
    `<div class="cart-totals">
       ${tier.mult<1 ? `<div class="cart-sub"><span>Oddiy narxda</span><s>${fmt(subtotal)}</s></div>` : ""}
       <div class="cart-total"><span>Jami</span><b>${fmt(total)}</b></div>
     </div>` +
    (ok
      ? `<button class="btn-primary" id="cGo" type="button">➤ Buyurtma berish</button>`
      : `<div class="minwarn"><span>🔒</span><div>
           <div style="font-weight:600">Minimal buyurtma — ${fmt(MIN_ORDER)}</div>
           <div style="font-size:11.5px;margin-top:2px">Yana ${fmt(MIN_ORDER-total)}lik mahsulot qo'shing.</div>
         </div></div>`);

  document.getElementById("cX").onclick = closeCart;
  body.querySelectorAll("[data-m]").forEach(b=> b.onclick = ()=> changeQty(b.dataset.m,-1));
  body.querySelectorAll("[data-p]").forEach(b=> b.onclick = ()=> changeQty(b.dataset.p, 1));
  const go = document.getElementById("cGo");
  if(go) go.onclick = ()=> window.open(`https://t.me/${BOT}`, "_blank", "noopener");
}
function openCart(){ renderCart(); document.getElementById("cartOv").hidden = false; }
function closeCart(){ document.getElementById("cartOv").hidden = true; }

/* ---- studio slots (demo) ---- */
let picked = {flower:false, pot:false};
function wireSlot(id, key){
  const el = document.getElementById(id);
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.hidden = true;
  document.body.appendChild(input);
  el.addEventListener("click", ()=> input.click());
  input.addEventListener("change", e=>{
    const f = e.target.files[0]; if(!f) return;
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f); img.alt = "";
    el.querySelectorAll("span:not(.slot-plus)").forEach(s=>s.remove());
    el.querySelector("img")?.remove();
    el.prepend(img);
    el.classList.add("filled");
    picked[key] = true;
    refreshGen();
  });
}
function refreshGen(){
  const on = picked.flower && picked.pot;
  document.getElementById("genBtn").disabled = !on;
  document.getElementById("genNote").textContent = on
    ? "Tayyor — bosing (hozircha demo, AI dvigateli hali ulanmagan)"
    : "Ikkala rasmni tanlang — keyin generatsiya faollashadi";
}
wireSlot("slotFlower","flower");
wireSlot("slotPot","pot");
document.getElementById("genBtn").onclick = function(){
  const note = document.getElementById("genNote");
  this.disabled = true; this.textContent = "Yaratilmoqda…";
  setTimeout(()=>{
    this.textContent = "✦ Generatsiya qilish"; this.disabled = false;
    note.textContent = "Demo: bu yerda AI natijasi chiqadi (Gemini API ulangandan keyin).";
  }, 1400);
};
